<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYLVA — Écosystème infini</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Menu principal ===== -->
<div id="screen-menu" class="overlay">
  <div class="overlay-box">
    <h1>SYLVA</h1>
    <div class="tagline">Écosystème évolutif, infini, à faire prospérer — ou effondrer.</div>
    <div id="menuRank" class="menu-rank"></div>
    <div id="menuLegacy" class="menu-legacy"></div>
    <div id="biomeList"></div>
    <button id="startBtn" class="big-btn">Faire germer l'écosystème</button>
    <div class="menu-btn-row">
      <button id="menuCodexBtn" class="ghost-btn">🧬 Codex</button>
      <button id="menuRulesBtn" class="ghost-btn">📖 Règles</button>
      <button id="menuKeysBtn" class="ghost-btn">⌨️ Raccourcis</button>
    </div>
    <div id="menuStats"></div>
  </div>
</div>

<!-- ===== Codex (méta-progression) ===== -->
<div id="screen-codex" class="overlay hidden">
  <div class="overlay-box">
    <h1 style="font-size:1.6em">Codex Génétique</h1>
    <div id="codexContent"></div>
    <div class="close-row"><button id="codexCloseBtn" class="ghost-btn">Fermer</button></div>
  </div>
</div>

<!-- ===== Règles ===== -->
<div id="screen-rules" class="overlay hidden">
  <div class="overlay-box">
    <h1 style="font-size:1.6em">Règles</h1>
    <div id="rulesContent"></div>
    <div class="close-row"><button id="rulesCloseBtn" class="ghost-btn">Fermer</button></div>
  </div>
</div>

<!-- ===== Raccourcis clavier ===== -->
<div id="screen-keybinds" class="overlay hidden">
  <div class="overlay-box">
    <h1 style="font-size:1.6em">Raccourcis clavier</h1>
    <div id="keybindsContent"></div>
    <div class="close-row">
      <button id="keybindsResetBtn" class="ghost-btn">Réinitialiser</button>
      <button id="keybindsCloseBtn" class="ghost-btn">Fermer</button>
    </div>
  </div>
</div>

<!-- ===== Écran de jeu ===== -->
<div id="screen-game" class="hidden">
  <header>
    <h1>SYLVA</h1>
    <div class="hud">
      <span id="hud-season" class="stat" title="Saison actuelle : influence le soleil, l'eau et les menaces."></span>
      <span class="stat" title="Énergie : finance les plantations, bâtiments et le défrichage.">⚡ <b id="hud-energy">0</b></span>
      <span class="stat" title="Eau : doit rester positive, sinon l'écosystème s'assèche et s'effondre.">💧 <b id="hud-water">0</b></span>
      <span class="stat" title="Biomasse : finance aussi les plantations et bâtiments.">🌾 <b id="hud-biomass">0</b></span>
      <span class="stat" title="Points génétiques : financent les évolutions d'espèces.">🧬 <b id="hud-gp">0</b></span>
      <span class="stat" title="Or : finance les bâtiments et les expéditions (Bourse).">💰 <b id="hud-gold">0</b></span>
      <span class="stat" title="Biodiversité : nombre d'espèces différentes actuellement en vie.">🌍 <b id="hud-biodiversity">0</b></span>
      <span class="stat" title="Vitalité : score composite (biomasse + biodiversité + ancienneté).">✨ vitalité <b id="hud-vitality">0</b></span>
      <span class="stat" title="Pression écologique : augmente avec l'âge et la taille de l'écosystème, rend les menaces plus fréquentes.">🔥 pression <b id="hud-pressure" class="good">0</b></span>
      <span class="stat balance-wrap" title="Équilibre : respectez les proportions producteurs/herbivores/prédateurs/décomposeurs pour le garder haut.">⚖️ <span class="balance-bar"><div id="hud-balance-fill"></div></span> <b id="hud-balance-num">100%</b></span>
      <span class="stat" style="display:none"><div id="hud-water-bar"></div></span>
      <button id="hudCodexBtn" class="ghost-btn small" title="Codex : dépensez vos points d'héritage (💎), gagnés à la fin de chaque partie.">💎</button>
      <button id="keysBtn" class="ghost-btn small">⌨️</button>
      <button id="rulesBtn" class="ghost-btn small">📖</button>
    </div>
  </header>
  <main>
    <div id="boardWrap"><canvas id="board"></canvas></div>
    <div id="sidePanel">
      <div id="tabs">
        <button data-tab="plant" class="active">🌱 Planter</button>
        <button data-tab="evolve">🧬 Évolution</button>
        <button data-tab="market">💰 Bourse</button>
        <button data-tab="defend">🛡️ Défense</button>
        <button data-tab="log">📜 Journal</button>
      </div>
      <div id="panelContent"></div>
      <div id="tileInfo"></div>
      <button id="nextSeasonBtn">Saison suivante ▶</button>
    </div>
  </main>
</div>

<!-- ===== Fin de partie ===== -->
<div id="screen-gameover" class="overlay hidden">
  <div class="overlay-box">
    <h1 style="font-size:1.8em">Effondrement</h1>
    <div id="goReason"></div>
    <div id="goStats"></div>
    <div id="goLegacy"></div>
    <button id="goRestartBtn" class="big-btn">Nouvelle génération</button>
    <button id="goCodexBtn" class="ghost-btn">🧬 Codex Génétique</button>
  </div>
</div>

<script src="js/keybinds.js"></script>
<script src="js/hexgrid.js"></script>
<script src="js/species.js"></script>
<script src="js/buildings.js"></script>
<script src="js/prestige.js"></script>
<script src="js/meta.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
