<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crystal</title>
<style>
  :root{
    --bg1:#100c1a; --bg2:#241a3d;
    --panel-bg:#1c1530; --panel-border:#382a5c;
    --text:#e9e4f5; --text-dim:#b6a8e0;
    --accent:#7a5cff; --accent-glow:#c9b6ff;
    --btn-bg:#4b3a86; --btn-bg-hover:#5f4aab;
    --gold:#ffd76b;
    --p1:#ff6b7d; --p1-soft:#ffb3bd;
    --p2:#6bb4ff; --p2-soft:#b3ddff;
    --danger:#7a2a3a; --danger-hover:#9a3548;
    --tile-bg:#231a3c; --tile-border:#3a2c5c;
    --board-bg:#170f28;
  }
  [data-theme="ambre"]{
    --bg1:#1a1006; --bg2:#3d2a12;
    --panel-bg:#241a0c; --panel-border:#5c4420;
    --text:#f5ecd9; --text-dim:#c9ac7a;
    --accent:#ff9d3c; --accent-glow:#ffd08a;
    --btn-bg:#8a5a1e; --btn-bg-hover:#a56f28;
    --gold:#ffe9a8;
    --p1:#ff6b4d; --p1-soft:#ffb39c;
    --p2:#4dc9ff; --p2-soft:#a9e6ff;
    --danger:#7a2a2a; --danger-hover:#9a3535;
    --tile-bg:#2c1f0e; --tile-border:#5c4420;
    --board-bg:#1e1509;
  }
  [data-theme="emeraude"]{
    --bg1:#08140f; --bg2:#123322;
    --panel-bg:#0f2418; --panel-border:#245c3e;
    --text:#e2f5ea; --text-dim:#8fc9a8;
    --accent:#3cffa0; --accent-glow:#9dffce;
    --btn-bg:#1e7a52; --btn-bg-hover:#279b68;
    --gold:#ffe066;
    --p1:#ff6b7d; --p1-soft:#ffb3bd;
    --p2:#4dd6ff; --p2-soft:#a9edff;
    --danger:#7a2a3a; --danger-hover:#9a3548;
    --tile-bg:#122a1d; --tile-border:#245c3e;
    --board-bg:#0c1f15;
  }
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg1);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;background:var(--btn-bg);color:#fff;padding:8px 14px;font-size:14px;transition:background .15s,transform .1s;}
  button:hover{background:var(--btn-bg-hover);}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  button.danger{background:var(--danger);}
  button.danger:hover{background:var(--danger-hover);}
  input[type=text],input[type=number]{background:#1e1730;border:1px solid var(--btn-bg);color:#fff;border-radius:4px;padding:4px 6px;font-size:14px;width:70px;}
  input[type=text]{width:150px;}
  h1,h2,h3{margin:.2em 0;}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;}
  .hidden{display:none!important;}

  #menuScreen{justify-content:center;gap:14px;background:radial-gradient(ellipse at center,var(--bg2) 0%,var(--bg1) 70%);}
  #menuScreen h1{font-size:2.6em;letter-spacing:3px;color:var(--accent-glow);text-shadow:0 0 18px var(--accent);margin-bottom:8px;}
  #menuScreen .menuBtns{display:flex;flex-direction:column;gap:12px;width:280px;}
  #menuScreen button{padding:14px;font-size:16px;}
  #menuStatus{font-size:13px;color:var(--text-dim);text-align:center;max-width:300px;}
  .botLevelRow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .botLevelRow button{padding:6px 12px;font-size:13px;background:var(--panel-bg);border:1px solid var(--panel-border);}
  .botLevelRow button.selected{background:var(--accent);color:#100c1a;font-weight:bold;}

  #rosterScreen,#settingsScreen{padding:16px;gap:12px;overflow-y:auto;width:100%;}
  .rosterTop{display:flex;justify-content:space-between;width:100%;max-width:960px;align-items:center;}
  #creatorForm{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:10px;padding:14px 18px;width:100%;max-width:960px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  #creatorForm label{display:flex;flex-direction:column;font-size:12px;color:var(--text-dim);gap:3px;}
  #creatorCost{font-size:15px;color:var(--gold);font-weight:bold;}
  #appearancePicker{width:100%;}
  #appearancePicker .label{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  #appearanceGrid{display:flex;flex-wrap:wrap;gap:6px;max-width:100%;max-height:250px;overflow-y:auto;padding:4px;background:rgba(0,0,0,.15);border-radius:8px;}
  .appBadge{width:60px;height:74px;border-radius:8px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px;}
  .appBadge:hover{background:rgba(255,255,255,.1);}
  .appBadge.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--accent);}
  .appBadge svg{width:50px;height:auto;display:block;}
  #charListWrap,#spellListWrap{width:100%;max-width:960px;}
  #charList,#spellList{width:100%;display:flex;flex-direction:column;gap:8px;}
  .charRow{display:flex;align-items:center;gap:12px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:8px;padding:8px 12px;}
  .charRow svg{flex:none;}
  .charRow .cName{font-weight:bold;min-width:120px;}
  .charRow .cStats{flex:1;font-size:13px;color:var(--text-dim);}
  .charRow .cCost{color:var(--gold);font-weight:bold;min-width:50px;}
  .charRow label.equip{display:flex;align-items:center;gap:4px;font-size:12px;}

  .settingsBlock{width:100%;max-width:640px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:10px;padding:16px;}
  .settingsLabel{font-size:13px;color:var(--text-dim);margin-bottom:10px;}
  .themeRow,.langRow{display:flex;gap:12px;flex-wrap:wrap;}
  .themeSwatch{display:flex;flex-direction:column;gap:6px;align-items:center;background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:8px;padding:10px;width:130px;}
  .themeSwatch.selected{border-color:var(--gold);}
  .themeSwatch .bars{display:flex;gap:3px;}
  .themeSwatch .bars span{width:14px;height:24px;border-radius:3px;}
  .langBtn{min-width:110px;}
  .langBtn.selected{background:var(--accent);color:#100c1a;font-weight:bold;}

  #gameScreen{justify-content:flex-start;}
  #hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 16px;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);flex:none;}
  .goldBox{font-size:16px;font-weight:bold;display:flex;align-items:center;gap:6px;}
  #goldP1{color:var(--p1);}
  #goldP2{color:var(--p2);}
  #gameBody{flex:1;display:flex;width:100%;min-height:0;}
  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0;background:var(--board-bg);position:relative;padding:10px;}
  #boardFrame{max-width:100%;max-height:100%;display:flex;}
  #board{width:100%;height:100%;display:block;border-radius:8px;}
  #placementBanner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:1px solid var(--accent);border-radius:10px;padding:10px 20px;font-size:14px;text-align:center;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  #pauseBanner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,15,.55);z-index:6;font-size:2em;letter-spacing:2px;color:var(--accent-glow);text-shadow:0 0 18px var(--accent);}
  #hudHint{width:100%;text-align:center;font-size:11px;color:var(--text-dim);padding:4px 0;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);flex:none;}
  .sidePanel{width:216px;flex:none;display:flex;flex-direction:column;gap:7px;padding:10px;overflow-y:auto;background:var(--panel-bg);}
  .sidePanel.p1{border-right:2px solid var(--panel-border);}
  .sidePanel.p2{border-left:2px solid var(--panel-border);}
  .sideHeader{font-size:12px;color:var(--text-dim);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--panel-border);margin-bottom:2px;}
  .unitBtn{width:100%;background:#241a3d;border:2px solid var(--btn-bg);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--text);text-align:left;line-height:1.4;display:flex;flex-direction:column;gap:2px;}
  .unitBtn b{display:flex;align-items:center;gap:6px;font-size:12px;}
  .unitBtn .cost{color:var(--gold);font-weight:bold;}
  .unitBtn.armed{outline:3px solid var(--gold);background:#3a2a5c;}
  .unitBtn.crystalBtn{background:#1e2f3a;border-color:#3a6b7a;}
  .unitBtn.crystalBtn.armed{outline:3px solid var(--p2);}
  .unitBtn.spellBtn{background:#2a1e4d;border-color:#8a5cff;}
  .unitBtn.spellBtn.armed{outline:3px solid #b78cff;}
  .unitBtn.readonly{cursor:default;opacity:.9;}
  .unitBtn:disabled{opacity:.35;}

  #endOverlay{position:fixed;inset:0;background:rgba(10,6,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;}
  #endOverlay h1{font-size:2.4em;text-shadow:0 0 20px var(--accent);}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;font-size:13px;max-width:80%;text-align:center;}
  #toast.show{opacity:1;}

  #tooltip{position:fixed;z-index:70;background:var(--panel-bg);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:12px;max-width:260px;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.5);}
  #tooltip .ttHead{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  #tooltip .ttHead b{font-size:13px;}
  #tooltip .ttStats{color:var(--text-dim);}
  #tooltip .ttDesc{color:var(--text);line-height:1.4;}
  #tooltip .ttCost{color:var(--gold);font-weight:bold;margin-top:5px;}

  .backBtn{position:absolute;top:14px;left:14px;}
</style>
</head>
<body>

<div id="menuScreen" class="screen">
  <h1 id="menuTitleText">⬡ CRYSTAL ⬡</h1>
  <div class="menuBtns">
    <button id="btnPlay"></button>
    <button id="btnRoster"></button>
    <button id="btnSettings"></button>
  </div>
  <div class="botLevelRow">
    <span id="botLevelLabel"></span>
    <button id="botLvl1">1</button>
    <button id="botLvl2">2</button>
    <button id="botLvl3">3</button>
  </div>
  <div id="menuStatus"></div>
</div>

<div id="rosterScreen" class="screen hidden">
  <button class="backBtn" id="rosterBack">← <span id="rosterBackLabel"></span></button>
  <div class="rosterTop"><h2 id="rosterTitleText"></h2><span style="font-size:13px;color:var(--text-dim);"><span id="equippedLabelText"></span> <span id="equipCount">0</span> / 7</span></div>

  <div id="creatorForm">
    <input type="hidden" id="editId" value="">
    <label><span id="lblName"></span> <input type="text" id="fName" value="Perso"></label>
    <label><span id="lblAtk"></span> <input type="number" id="fAtk" min="0" value="2"></label>
    <label><span id="lblHp"></span> <input type="number" id="fHp" min="1" value="3"></label>
    <label><span id="lblRange"></span> <input type="number" id="fRange" min="0" value="1"></label>
    <label><span id="lblSpeed"></span> <input type="number" id="fSpeed" min="0" value="2"></label>
    <div><span id="lblCost"></span> <span id="creatorCost">8€</span></div>
    <button id="btnSave"></button>
    <button id="btnCancelEdit" class="danger hidden"></button>
    <div id="appearancePicker">
      <div class="label" id="lblAppearance"></div>
      <div id="appearanceGrid"></div>
    </div>
  </div>

  <div id="charListWrap">
    <h3 id="charactersHeading"></h3>
    <div id="charList"></div>
  </div>

  <div id="spellListWrap">
    <h3 id="spellHeading"></h3>
    <div id="spellList"></div>
  </div>
</div>

<div id="settingsScreen" class="screen hidden">
  <button class="backBtn" id="settingsBack">← <span id="settingsBackLabel"></span></button>
  <h2 id="settingsTitleText"></h2>
  <div class="settingsBlock">
    <div class="settingsLabel" id="settingsThemeLabel"></div>
    <div class="themeRow" id="themeRow"></div>
  </div>
  <div class="settingsBlock">
    <div class="settingsLabel" id="settingsLangLabel"></div>
    <div class="langRow" id="langRow"></div>
  </div>
  <div class="settingsBlock">
    <div class="settingsLabel" id="settingsGoldLabel"></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <input type="number" id="goldPerSecInput" min="0.5" max="30" step="0.5" style="width:90px;">
      <span>€ / s</span>
    </div>
  </div>
</div>

<div id="gameScreen" class="screen hidden">
  <div id="hud">
    <div class="goldBox" id="goldP1">💰 0€</div>
    <div style="display:flex;gap:10px;">
      <button id="btnPause" class="hidden"></button>
      <button id="btnQuit"></button>
    </div>
    <div class="goldBox" id="goldP2">💰 0€</div>
  </div>
  <div id="hudHint"></div>
  <div id="gameBody">
    <div class="sidePanel p1 hidden" id="panelP1"></div>
    <div id="boardWrap">
      <div id="placementBanner" class="hidden"></div>
      <div id="pauseBanner" class="hidden"></div>
      <div id="boardFrame"><canvas id="board"></canvas></div>
    </div>
    <div class="sidePanel p2 hidden" id="panelP2"></div>
  </div>
</div>

<div id="endOverlay" class="hidden">
  <h1 id="endText"></h1>
  <button id="btnReplay"></button>
  <button id="btnEndMenu"></button>
</div>

<div id="toast"></div>
<div id="tooltip" class="hidden"></div>

<script>
(function(){
"use strict";
try{

function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }

/* ============================================================
   I18N
   ============================================================ */
const LANG_KEY="hexcristal_lang", THEME_KEY="hexcristal_theme", BOTLEVEL_KEY="hexcristal_botlevel";
let lang = safeGet(LANG_KEY) || "fr";
let theme = safeGet(THEME_KEY) || "violet";
let botLevel = parseInt(safeGet(BOTLEVEL_KEY),10) || 1;
if(botLevel<1||botLevel>3) botLevel=1;

const STRINGS = {
  fr:{
    menuTitle:"⬡ CRYSTAL ⬡", play:"Jouer", myCharacters:"Mes personnages", settings:"Paramètres",

    equip:"Équiper", equipped:"Équipé ✓", edit:"Modifier", delete:"Supprimer", confirmDelete:"Supprimer \"{n}\" ?",
    equipCapMsg:"Maximum 7 personnages équipés", unequippedOverflow:"Certains personnages ont été déséquipés (maximum 7)",

    langFr:"Français", langEn:"English",

  en:{

    equip:"Equip", equipped:"Equipped ✓", edit:"Edit", delete:"Delete", confirmDelete:"Delete \"{n}\"?",

    settingsTitle:"Settings", settingsTheme:"Visual style", settingsLang:"Language",
    themeViolet:"Violet Night", themeAmbre:"Golden Crystal", themeEmeraude:"Emerald Forest",
    langFr:"Français", langEn:"English",
    quitMatch:"Quit match", you:"You", bot:"Bot", botN:"Bot Lvl.{n}", ready:"Ready",
    crystalName:"Crystal", freeLabel:"Free", cooldownLabel:"Cooldown:",
    needTeam:"Equip at least one character before playing", invalidCell:"Invalid cell (out of crystal range, or occupied)",
    spellOnCooldown:"Spell on cooldown", invalidSummon:"Invalid cell for summoning",
    youWin:"You win the match!", botWins:"The bot wins...", replay:"Replay", mainMenu:"Main menu",
    statAtk:"ATK", statHp:"HP", statRange:"Range", statSpeed:"Speed",
    choosePlacement:"Choose where to place your crystal (highlighted zone)", invalidPlacementZone:"Choose a tile in your zone (left side)",
    pause:"⏸ Pause", resume:"▶ Resume", pausedLabel:"⏸ PAUSED",
    hudHint:"⌨ P Pause · Esc Cancel · C Crystal · S Spell · 1-7 Characters",
    settingsGold:"Gold earned per second (per player)"
  }
};
function tr(key, vars){
  let s = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.fr[key] || key;
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
function localName(o){ return (o.name && o.name[lang]) || (o.name && o.name.fr) || ""; }
function localDesc(o){ return (o.desc && o.desc[lang]) || (o.desc && o.desc.fr) || ""; }

/* ============================================================
   APPARENCES (40 personnages illustrés en SVG vectoriel)
   ============================================================ */
const APPEARANCE_DEFS = [
  {id:"app0", name:{fr:"Chevalier",en:"Knight"}, body:"humanoid", accessory:"helmet", weapon:"sword"},
  {id:"app1", name:{fr:"Guerrier",en:"Warrior"}, body:"humanoid", accessory:"none", weapon:"axe"},
  {id:"app2", name:{fr:"Archer",en:"Archer"}, body:"humanoid", accessory:"hood", weapon:"bow"},

  {id:"app19", name:{fr:"Renard",en:"Fox"}, body:"creature", accessory:"ears", weapon:"tail", scale:0.85},
  {id:"app20", name:{fr:"Araignée",en:"Spider"}, body:"creature", accessory:"none", weapon:"none", scale:0.78},
  {id:"app21", name:{fr:"Serpent",en:"Snake"}, body:"creature", accessory:"none", weapon:"none", scale:0.85},
  {id:"app22", name:{fr:"Scorpion",en:"Scorpion"}, body:"creature", accessory:"none", weapon:"claws", scale:0.85},

function paletteFor(def,i){
  const hue = Math.round((i*137.508)%360);
  return {
    primary: def.primary || ("hsl("+hue+",58%,42%)"),
    secondary: def.secondary || ("hsl("+hue+",40%,24%)"),
    skin: def.skin || "#e3b78a",
    eye: def.eye || "#241a3d",
    accent: def.accent || ("hsl("+((hue+40)%360)+",70%,60%)")
  };
}
const APPEARANCES = APPEARANCE_DEFS.map((def,i)=>Object.assign({}, def, {palette:paletteFor(def,i)}));
console.assert(APPEARANCES.length===40, "il faut exactement 40 apparences");

function shade(color, amt){
  if(typeof color==="string" && color.indexOf("hsl(")===0){
    const m = color.match(/hsl\(([-0-9.]+),\s*([0-9.]+)%,\s*([0-9.]+)%\)/);
    if(m){ let h=parseFloat(m[1]), s=parseFloat(m[2]), l=parseFloat(m[3]); l=Math.min(96,Math.max(4,l+amt)); return "hsl("+h+","+s+"%,"+l+"%)"; }
    return color;
  }
  let hex = String(color).replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16)||0;
  const p = amt*2.55;
  let r=(num>>16)+Math.round(p), g=((num>>8)&0xff)+Math.round(p), b=(num&0xff)+Math.round(p);
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function svgCharacterMarkup(pal, def, size){
  size = size || 48;
  const OUT = "#1a1420";
  function E(cx,cy,rx,ry,fill,noStroke,op){ return "<ellipse cx='"+cx+"' cy='"+cy+"' rx='"+rx+"' ry='"+ry+"' fill='"+fill+"'"+(noStroke?"":" stroke='"+OUT+"' stroke-width='1.8'")+(op?" opacity='"+op+"'":"")+"/>"; }
  function Rt(x,y,w,h,rx,fill,noStroke,op){ return "<rect x='"+x+"' y='"+y+"' width='"+w+"' height='"+h+"' rx='"+(rx==null?2:rx)+"' fill='"+fill+"'"+(noStroke?"":" stroke='"+OUT+"' stroke-width='1.8'")+(op?" opacity='"+op+"'":"")+"/>"; }
  function Ci(cx,cy,r,fill,noStroke,op){ return "<circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='"+fill+"'"+(noStroke?"":" stroke='"+OUT+"' stroke-width='1.8'")+(op?" opacity='"+op+"'":"")+"/>"; }
  function Tr(pts,fill,noStroke,op){ return "<polygon points='"+pts+"' fill='"+fill+"' stroke-linejoin='round'"+(noStroke?"":" stroke='"+OUT+"' stroke-width='1.6'")+(op?" opacity='"+op+"'":"")+"/>"; }
  function Pa(d,fill,noStroke,op){ return "<path d='"+d+"' fill='"+fill+"' stroke-linejoin='round'"+(noStroke?"":" stroke='"+OUT+"' stroke-width='1.8'")+(op?" opacity='"+op+"'":"")+"/>"; }
  function Ln(x1,y1,x2,y2,color,w){ return "<line x1='"+x1+"' y1='"+y1+"' x2='"+x2+"' y2='"+y2+"' stroke='"+color+"' stroke-width='"+w+"' stroke-linecap='round'/>"; }

  const bg="url(#bg)", sg="url(#sg)", hg="url(#hg)";
  const defsStr = "<defs>"+
    "<linearGradient id='bg' x1='0' y1='0' x2='0.3' y2='1'><stop offset='0' stop-color='"+shade(pal.primary,20)+"'/><stop offset='1' stop-color='"+shade(pal.primary,-16)+"'/></linearGradient>"+
    "<linearGradient id='sg' x1='0' y1='0' x2='0.3' y2='1'><stop offset='0' stop-color='"+shade(pal.secondary,18)+"'/><stop offset='1' stop-color='"+shade(pal.secondary,-14)+"'/></linearGradient>"+
    "<radialGradient id='hg' cx='.38' cy='.32' r='.8'><stop offset='0' stop-color='"+shade(pal.skin,16)+"'/><stop offset='1' stop-color='"+shade(pal.skin,-6)+"'/></radialGradient>"+
    "</defs>";

  function face(cx,cy,r,fierce,oneEye){
    let f="";
    if(oneEye){
      const er=r*0.34, dy=r*0.04;
      f += E(cx,cy+dy,er*1.2,er*1.35,"#fff",true);
      f += Ci(cx,cy+dy,er*0.6,pal.eye,true);
      f += Ci(cx+er*0.25,cy+dy-er*0.35,er*0.22,"#fff",true);
      if(fierce){
        f += Ln(cx-er*1.5, cy-er*1.8, cx-er*0.2, cy-er*1.1, OUT, 2.2);
        f += Ln(cx+er*1.5, cy-er*1.8, cx+er*0.2, cy-er*1.1, OUT, 2.2);
      }
    } else {
      const dx=r*0.4, dy=r*0.06, er=r*0.19;
      f += E(cx-dx,cy+dy,er*1.2,er*1.35,"#fff",true);
      f += E(cx+dx,cy+dy,er*1.2,er*1.35,"#fff",true);
      f += Ci(cx-dx,cy+dy,er*0.6,pal.eye,true);
      f += Ci(cx+dx,cy+dy,er*0.6,pal.eye,true);
      f += Ci(cx-dx+er*0.25,cy+dy-er*0.35,er*0.22,"#fff",true);
      f += Ci(cx+dx+er*0.25,cy+dy-er*0.35,er*0.22,"#fff",true);
      if(fierce){
        f += Ln(cx-dx-er*1.4, cy-er*1.7, cx-dx+er*0.7, cy-er*0.7, OUT, 2);
        f += Ln(cx+dx+er*1.4, cy-er*1.7, cx+dx-er*0.7, cy-er*0.7, OUT, 2);
      }
    }
    f += "<path d='M"+(cx-r*0.22)+","+(cy+r*0.52)+" Q"+cx+","+(cy+r*0.64)+" "+(cx+r*0.22)+","+(cy+r*0.52)+"' fill='none' stroke='"+OUT+"' stroke-width='1.6' stroke-linecap='round'/>";
    return f;
  }

  let parts = "";
  const bodyType = def.body;
  const fierce = ["sword","axe","claws","dagger"].indexOf(def.weapon)!==-1;
  let headCX,headCY,headR,handX,handY,headTopY;

  if(bodyType==="blob"){
    headCX=30; headCY=44; headR=15; handX=48; handY=42; headTopY=16;
    parts += Pa("M9,42 Q7,18 30,16 Q53,18 51,42 Q53,61 30,63 Q7,61 9,42 Z", bg);
    parts += E(21,30,6,7,"#ffffff",true,.4);
    parts += face(headCX,headCY,headR,false);
  } else if(bodyType==="construct"){
    headCX=30; headCY=35; headR=13; handX=51; handY=38; headTopY=25;
    parts += Rt(19,60,8,10,2, shade(pal.secondary,-20));
    parts += Rt(33,60,8,10,2, shade(pal.secondary,-20));
    parts += Rt(17,44,26,18,4, sg);
    parts += Rt(21,50,18,3,1, shade(pal.secondary,-12));
    parts += Ci(30,55,7, pal.eye, true, .25);
    parts += Ci(30,55,4, pal.eye, true, .95);
    parts += Rt(9,30,8,18,3, bg);
    parts += Rt(43,30,8,18,3, bg);
    parts += Ci(13,30,3.2, sg);
    parts += Ci(47,30,3.2, sg);
    parts += Rt(14,25,32,22,5, bg);
    parts += Rt(18,32,24,6,2, shade(pal.secondary,-8));
    parts += Ci(24,35,5.5, pal.eye, true, .25);
    parts += Ci(36,35,5.5, pal.eye, true, .25);
    parts += Ci(24,35,3, pal.eye, true, .95);
    parts += Ci(36,35,3, pal.eye, true, .95);
  } else if(bodyType==="creature"){
    headCX=13; headCY=34; headR=11; handX=1; handY=38; headTopY=23;
    parts += Rt(38,50,7,14,3, sg);
    parts += Rt(47,48,7,14,3, sg);
    parts += Rt(12,48,7,14,3, sg);
    parts += Rt(21,50,7,14,3, sg);
    parts += Pa("M46,40 Q64,32 62,50 Q60,58 50,52 Z", sg);
    parts += E(30,44,20,13, bg);
    parts += Tr((headCX-11)+","+(headCY+2)+" "+(headCX-3)+","+(headCY-4)+" "+(headCX-3)+","+(headCY+8), hg);
    parts += Ci(headCX,headCY,headR, hg);
    parts += face(headCX,headCY,headR,fierce,def.oneEye);
  } else {
    headCX=30; headCY=17; headR=14; handX=53; handY=40; headTopY=3;
    parts += Rt(16,65,10,6,3, shade(pal.secondary,-22));
    parts += Rt(34,65,10,6,3, shade(pal.secondary,-22));
    parts += Rt(18,49,9,18,4, sg);
    parts += Rt(33,49,9,18,4, sg);
    parts += Pa("M16,29 Q16,25 21,25 L39,25 Q44,25 44,29 L42,50 Q30,55 18,50 Z", bg);
    parts += Rt(18,47,24,4,2, shade(pal.secondary,-8));
    parts += E(10,37,6.5,11, bg);
    parts += E(50,37,6.5,11, bg);
    parts += Ci(9,47,4.2, hg);
    parts += Ci(51,47,4.2, hg);
    parts += Rt(26,21,8,6,2, hg);
    parts += Ci(headCX,headCY,headR, hg);
    parts += face(headCX,headCY,headR,fierce,def.oneEye);
  }

  switch(def.accessory){
    case "helmet":
      parts += Pa("M"+(headCX-headR)+","+headCY+" Q"+(headCX-headR)+","+(headTopY-4)+" "+headCX+","+(headTopY-4)+" Q"+(headCX+headR)+","+(headTopY-4)+" "+(headCX+headR)+","+headCY+" Z", sg);
      break;
    case "hood":
      parts += Pa("M"+(headCX-headR-3)+","+(headCY-2)+" Q"+headCX+","+(headTopY-headR*0.9)+" "+(headCX+headR+3)+","+(headCY-2)+" L"+(headCX+headR-1)+","+(headCY+headR*1.5)+" Q"+headCX+","+(headCY+headR*0.9)+" "+(headCX-headR+1)+","+(headCY+headR*1.5)+" Z", sg, false, .97);

    case "hat_wizard":
      parts += Tr(headCX+","+(headTopY-15)+" "+(headCX-headR+2)+","+(headTopY+3)+" "+(headCX+headR-2)+","+(headTopY+3), sg);
      parts += E(headCX,headTopY+3,headR-1,3, sg);

    case "ears":
      parts += Tr((headCX-headR+3)+","+(headCY-headR*0.3)+" "+(headCX-headR-3)+","+(headTopY-6)+" "+(headCX-headR+10)+","+(headCY-headR*0.3), bg);

      break;
    case "mask":
      parts += Rt(headCX-headR+1,headCY-headR*0.3,headR*2-2,headR*0.55,3, "#1a1420");
      break;
    case "wings":
      parts += Pa("M"+(headCX-headR-2)+","+(headCY+2)+" Q"+(headCX-headR-22)+","+(headCY-8)+" "+(headCX-headR-12)+","+(headCY+20)+" Q"+(headCX-headR-4)+","+(headCY+14)+" "+(headCX-headR-2)+","+(headCY+2)+" Z", sg, false, .92);
      parts += Pa("M"+(headCX+headR+2)+","+(headCY+2)+" Q"+(headCX+headR+22)+","+(headCY-8)+" "+(headCX+headR+12)+","+(headCY+20)+" Q"+(headCX+headR+4)+","+(headCY+14)+" "+(headCX+headR+2)+","+(headCY+2)+" Z", sg, false, .92);
      break;
    case "antenna":
      parts += Rt(headCX-1, headTopY-9, 2, 9, 1, sg);
      parts += Ci(headCX, headTopY-9, 5, pal.eye, true, .3);
      parts += Ci(headCX, headTopY-9, 2.6, pal.eye, true, .95);
      break;
  }

  switch(def.weapon){
    case "sword":
      parts += Rt(handX-1,handY-24,4,26,1,"#dfe6ee");
      parts += Rt(handX-5,handY-2,12,4,1, sg);
      break;
    case "axe":
      parts += Rt(handX,handY-20,4,32,1,"#8a5a2c");
      parts += Tr((handX-4)+","+(handY-22)+" "+(handX+16)+","+(handY-26)+" "+(handX+12)+","+(handY-8)+" "+(handX-4)+","+(handY-12), "#dfe6ee");

      parts += Ln(handX,handY-18,handX,handY+18,"#e8e2d0",1);

    case "staff":
      parts += Rt(handX-1,handY-24,3,40,1,"#8a5a2c");

      parts += Ci(handX,handY-26,5, pal.accent, true, .95);
      break;
    case "dagger":
      parts += Rt(handX,handY-6,3,14,1,"#dfe6ee");
      break;
    case "claws":
      parts += Tr((handX-2)+","+(handY+2)+" "+(handX+6)+","+(handY-6)+" "+(handX+3)+","+(handY+8), "#e8e2d0");
      parts += Tr((handX+3)+","+(handY+5)+" "+(handX+11)+","+(handY-2)+" "+(handX+7)+","+(handY+11), "#e8e2d0");
      break;
    case "potion":
      parts += Rt(handX-3,handY-2,8,14,2,"#cfe3f2");
      parts += Rt(handX-1,handY-8,4,7,1,"#8a5a2c");
      parts += Ci(handX+1,handY+5,2.6, pal.accent, true, .95);
      break;
  }

  const scl = def.scale || 1;
  const scaledParts = scl===1 ? parts : "<g transform='translate(30,68) scale("+scl+") translate(-30,-68)'>"+parts+"</g>";
  return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='-24 -16 96 100' width='"+size+"' height='"+Math.round(size*100/96)+"'>"+defsStr+scaledParts+"</svg>";
}

/* ============================================================
   HEX GRID (rayon 5 -> 91 cases)
   ============================================================ */
const HEX_RADIUS = 5;
const HEX_SIZE = 36;

const allCells = [];
for(let q=-HEX_RADIUS; q<=HEX_RADIUS; q++){
  const r1 = Math.max(-HEX_RADIUS, -q-HEX_RADIUS);
  const r2 = Math.min(HEX_RADIUS, -q+HEX_RADIUS);
  for(let r=r1; r<=r2; r++) allCells.push({q,r});
}
console.assert(allCells.length===91, "board must have 91 cells");

const cellKey = (q,r) => q+","+r;
const validKeys = new Set(allCells.map(c=>cellKey(c.q,c.r)));
function inBoard(q,r){ return validKeys.has(cellKey(q,r)); }
function hexDistance(a,b){ return (Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs((a.q+a.r)-(b.q+b.r)))/2; }
const NEIGHBORS = [{q:1,r:0},{q:1,r:-1},{q:0,r:-1},{q:-1,r:0},{q:-1,r:1},{q:0,r:1}];
function hexToPixel(q,r){ return { x: HEX_SIZE*Math.sqrt(3)*(q+r/2), y: HEX_SIZE*1.5*r }; }
function cubeRound(x,y,z){
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if(dx>dy && dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return {q:rx, r:rz};
}
function pixelToAxial(px,py){
  const rr = py/(HEX_SIZE*1.5);
  const qq = px/(HEX_SIZE*Math.sqrt(3)) - rr/2;
  return cubeRound(qq, -qq-rr, rr);
}
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for(const c of allCells){ const p=hexToPixel(c.q,c.r); minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
const PAD = HEX_SIZE*1.6;
const BOARD_W = (maxX-minX)+PAD*2, BOARD_H=(maxY-minY)+PAD*2;
const OX = -minX+PAD, OY = -minY+PAD;
function screenPos(q,r){ const p=hexToPixel(q,r); return {x:p.x+OX, y:p.y+OY}; }

const THEME_COLORS = {};
function lighten(hex, percent){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16);
  let r=(num>>16)+Math.round(2.55*percent), g=((num>>8)&0xff)+Math.round(2.55*percent), b=(num&0xff)+Math.round(2.55*percent);
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function refreshThemeColors(){
  const cs = getComputedStyle(document.documentElement);
  const get = (v)=>cs.getPropertyValue(v).trim() || "#000000";
  THEME_COLORS.tileBg = get("--tile-bg");
  THEME_COLORS.tileBorder = get("--tile-border");
  THEME_COLORS.boardBg = get("--board-bg");
  THEME_COLORS.p1 = get("--p1");
  THEME_COLORS.p2 = get("--p2");
  THEME_COLORS.gold = get("--gold");
}
function applyTheme(id){
  theme = id;
  if(id==="violet") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", id);
  safeSet(THEME_KEY, id);
  refreshThemeColors();
  if(canvas) canvas.style.background = THEME_COLORS.boardBg;
  if(game) draw();
  renderSettingsScreen();
}

let game = null;
let currentScreen = "menu";
let animHandle = null;

function pickRandomBotDeck(){
  const pool = roster.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
  return pool.slice(0, Math.min(MAX_EQUIPPED, pool.length));
}

function newGame(){
  return {
    clock: 0, phase: "placement", hoverCell: null, paused: false,
    players: {
      1: {id:1, gold:0, crystals:[], nextCrystalCost:10, unitPurchaseCount:{}, spellId:equippedSpellId, spellCooldownUntil:0},
      2: {id:2, gold:0, crystals:[], nextCrystalCost:10, unitPurchaseCount:{}, spellId:null, spellCooldownUntil:0}
    },
    characters: [], nextCharId: 1, armed: null, ended: false, botTimer: 900, botDeck: pickRandomBotDeck()
  };
}
function currentUnitCost(pl, t){
  const n = pl.unitPurchaseCount[t.id] || 0;
  return Math.round(statCost(t) * Math.pow(PRICE_INCREASE, n));
}
function enemyOf(pid){ return pid===1?2:1; }
function inP1Zone(q,r){ return inBoard(q,r) && q<0; }
function mirrorCell(q,r){ return {q:-q, r:-r}; }
function crystalOccupied(q,r){
  for(const p of [1,2]) for(const cr of game.players[p].crystals) if(cr.q===q && cr.r===r) return true;
  return false;
}
function openCrystalCells(){
  const result = new Set();
  for(const cell of allCells){ if(!crystalOccupied(cell.q,cell.r)) result.add(cellKey(cell.q,cell.r)); }
  return result;
}

function validPlacementCells(pid){
  const result = new Set();
  for(const cr of game.players[pid].crystals){
    for(const cell of allCells){ if(hexDistance(cell,cr)<=PLACEMENT_RANGE) result.add(cellKey(cell.q,cell.r)); }
  }
  for(const p of [1,2]) for(const cr of game.players[p].crystals) result.delete(cellKey(cr.q,cr.r));
  return result;
}
function greedyStep(from, target){
  let best=null, bestD=hexDistance(from,target);
  for(const off of NEIGHBORS){
    const nq=from.q+off.q, nr=from.r+off.r;
    if(!inBoard(nq,nr)) continue;
    const d=hexDistance({q:nq,r:nr}, target);
    if(d<bestD){ bestD=d; best={q:nq,r:nr}; }
  }
  return best;
}
function pushAway(c, center, steps){
  for(let i=0;i<steps;i++){
    let best=null, bestD=hexDistance(c,center);
    for(const off of NEIGHBORS){
      const nq=c.q+off.q, nr=c.r+off.r;
      if(!inBoard(nq,nr)) continue;
      const d=hexDistance({q:nq,r:nr}, center);
      if(d>bestD){ bestD=d; best={q:nq,r:nr}; }
    }
    if(best){ c.q=best.q; c.r=best.r; } else break;
  }
}
function unitsInRadius(center, radius, filterFn){ return game.characters.filter(c=>c.alive && filterFn(c) && hexDistance(c,center)<=radius); }
function removeCrystal(pid, crystal){ const pl=game.players[pid]; pl.crystals = pl.crystals.filter(c=>c!==crystal); }
function endGame(winnerPid){
  game.ended = true;
  document.getElementById("endText").textContent = winnerPid===1 ? tr("youWin") : tr("botWins");
  document.getElementById("endOverlay").classList.remove("hidden");
}
function applyDamage(target, amount){
  if(target.shield && target.shield>0){ const absorb=Math.min(target.shield,amount); target.shield-=absorb; amount-=absorb; }
  if(amount>0) target.hp -= amount;
}
function damageCharacter(c, amount){ applyDamage(c, amount); if(c.hp<=0) c.alive=false; }
function damageCrystal(ownerPid, cr, amount){
  applyDamage(cr, amount);
  if(cr.hp<=0){ removeCrystal(ownerPid, cr); if(game.players[ownerPid].crystals.length===0){ endGame(enemyOf(ownerPid)); } }
}
function makeCharacter(owner, t, q, r){
  return {
    id: game.nextCharId++, owner, templateId:t.id,
    atk:t.atk, hp:t.hp, maxHp:t.hp, range:t.range, speed:t.speed,
    q, r, nextQ:null, nextR:null, moveProgress:0, cooldown:0, alive:true,
    atkMult:1, atkMultUntil:0, speedMult:1, speedMultUntil:0,
    frozenUntil:0, shield:0, poisonUntil:0, poisonDps:0, poisonTick:0,
    appearance:getAppearance(t)
  };
}
function summonUnit(pid, cell){
  const valid = validPlacementCells(pid);
  if(!valid.has(cellKey(cell.q,cell.r))){ showToast(tr("invalidSummon")); return false; }
  game.characters.push({
    id: game.nextCharId++, owner: pid, templateId: null,
    atk:3, hp:6, maxHp:6, range:1, speed:2,
    q:cell.q, r:cell.r, nextQ:null, nextR:null, moveProgress:0, cooldown:0, alive:true,
    atkMult:1, atkMultUntil:0, speedMult:1, speedMultUntil:0,
    frozenUntil:0, shield:0, poisonUntil:0, poisonDps:0, poisonTick:0,
    appearance:{name:{fr:"Invocation",en:"Summon"}, body:"blob", palette:{primary:"#ffd76b", secondary:"#c9a23a", skin:"#ffd76b", eye:"#fff", accent:"#fff"}}
  });
  return true;
}

let lastTs = null;
function tick(ts){
  if(currentScreen !== "game"){ animHandle=null; return; }
  if(lastTs===null) lastTs=ts;
  const dt = Math.min((ts-lastTs)/1000, 0.1);
  lastTs = ts;
  if(!game.ended && !game.paused && game.phase==="battle"){
    game.clock += dt*1000;
    updateGold(dt);
    updateCharacters(dt);
    if(!game.ended) updateBot(dt);
  }
  draw();
  updateHUD();
  animHandle = requestAnimationFrame(tick);
}
function togglePause(){
  if(!game || game.ended || game.phase!=="battle") return;
  game.paused = !game.paused;
  document.getElementById("btnPause").textContent = game.paused ? tr("resume") : tr("pause");
  document.getElementById("pauseBanner").classList.toggle("hidden", !game.paused);
  if(game.paused){ document.getElementById("pauseBanner").textContent = tr("pausedLabel"); }
}
function updateGold(dt){ for(const pid of [1,2]) game.players[pid].gold += goldPerSec*dt; }

function updateCharacters(dt){
  for(const c of game.characters){
    if(!c.alive) continue;
    if(c.poisonUntil > game.clock && c.poisonDps>0){
      c.poisonTick += dt*1000;
      while(c.poisonTick>=1000 && c.alive){ c.poisonTick-=1000; damageCharacter(c, c.poisonDps); }
      if(game.ended) return;
    }
    if(!c.alive) continue;
    const frozen = c.frozenUntil > game.clock;
    c.cooldown -= dt*1000;
    const enemyPid = enemyOf(c.owner);
    const enemyCrystals = game.players[enemyPid].crystals;
    if(enemyCrystals.length===0) continue;
    if(frozen) continue;
    const atk = c.atk * (c.atkMultUntil>game.clock ? c.atkMult : 1);
    const speed = c.speed * (c.speedMultUntil>game.clock ? c.speedMult : 1);
    let target=null, bestD=Infinity;
    for(const cr of enemyCrystals){ const d=hexDistance(c,cr); if(d<bestD){bestD=d; target=cr;} }
    if(bestD <= c.range){
      if(c.cooldown<=0){ damageCrystal(enemyPid, target, atk); c.cooldown=ATTACK_COOLDOWN_MS; if(game.ended) return; }
      c.moveProgress=0; c.nextQ=null; c.nextR=null;
      continue;
    }
    let ec=null, ecD=Infinity;
    for(const e of game.characters){ if(e.owner===enemyPid && e.alive){ const d=hexDistance(c,e); if(d<ecD){ecD=d; ec=e;} } }
    if(ec && ecD<=c.range){
      if(c.cooldown<=0){ damageCharacter(ec, atk); c.cooldown=ATTACK_COOLDOWN_MS; }
      c.moveProgress=0; c.nextQ=null; c.nextR=null;
      continue;
    }
    c.moveProgress += speed*dt;
    while(c.moveProgress>=1){
      c.moveProgress -= 1;
      const step = greedyStep(c, target);
      if(step){ c.q=step.q; c.r=step.r; } else { c.moveProgress=0; break; }
    }
    const nxt = greedyStep(c, target);
    if(nxt){ c.nextQ=nxt.q; c.nextR=nxt.r; } else { c.nextQ=null; c.nextR=null; c.moveProgress=0; }
  }
  game.characters = game.characters.filter(c=>c.alive);
}

function castSpell(pid, spellId, cell){
  const spell = SPELLS.find(s=>s.id===spellId);
  if(!spell) return false;
  const pl = game.players[pid];
  if(game.clock < (pl.spellCooldownUntil||0)){ showToast(tr("spellOnCooldown")); return false; }
  const ok = spell.cast(pid, cell);
  if(!ok) return false;
  pl.spellCooldownUntil = game.clock + spell.cooldownMs;
  return true;
}

   BOT
   ============================================================ */
/* Le bot n'utilise jamais de sort : recharge très courte et économie tendue -> difficile purement via placement/rythme */
const BOT_CONFIG = {
  1:{interval:1600, crystalChance:0.15, pickUnit:(list)=>list.reduce((a,b)=>statCost(b)<statCost(a)?b:a)},
  2:{interval:800,  crystalChance:0.25, pickUnit:(list)=>list[Math.floor(Math.random()*list.length)]},
  3:{interval:350,  crystalChance:0.4,  pickUnit:(list)=>list.reduce((a,b)=>statCost(b)>statCost(a)?b:a)}
};
function updateBot(dt){
  game.botTimer -= dt*1000;
  if(game.botTimer>0) return;
  const cfg = BOT_CONFIG[botLevel] || BOT_CONFIG[1];
  game.botTimer = cfg.interval * (0.8+Math.random()*0.4);
  const pid=2, pl=game.players[pid];
  if(pl.crystals.length===0) return;
  const deck = game.botDeck;
  if(!deck || !deck.length) return;

  if(pl.gold>=pl.nextCrystalCost && Math.random()<cfg.crystalChance){
    const cells=Array.from(openCrystalCells());
    if(cells.length){
      const [q,r]=cells[Math.floor(Math.random()*cells.length)].split(",").map(Number);
      pl.gold-=pl.nextCrystalCost; pl.nextCrystalCost=Math.round(pl.nextCrystalCost*PRICE_INCREASE);
      pl.crystals.push({q,r,hp:START_HP,maxHp:START_HP});
      return;
    }
  }
  const affordable = deck.filter(t=>currentUnitCost(pl,t)<=pl.gold);
  if(affordable.length){
    const t = cfg.pickUnit(affordable);
    const cells=Array.from(validPlacementCells(pid));
    if(cells.length){
      const [q,r]=cells[Math.floor(Math.random()*cells.length)].split(",").map(Number);
      pl.gold-=currentUnitCost(pl,t);
      pl.unitPurchaseCount[t.id] = (pl.unitPurchaseCount[t.id]||0)+1;
      game.characters.push(makeCharacter(pid,t,q,r));
    }
  }
}

/* ============================================================
   RENDU CANVAS
   ============================================================ */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
canvas.width = BOARD_W; canvas.height = BOARD_H;
document.getElementById("boardFrame").style.aspectRatio = BOARD_W+" / "+BOARD_H;
refreshThemeColors();
if(theme!=="violet") document.documentElement.setAttribute("data-theme", theme);
canvas.style.background = THEME_COLORS.boardBg;

function hexPath(cx,cy,size){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const ang = Math.PI/180*(60*i-30);
    const x=cx+size*Math.cos(ang), y=cy+size*Math.sin(ang);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function drawHpBar(cx,cy,hp,maxHp,color,width){
  const h=5;
  ctx.fillStyle="#000"; ctx.fillRect(cx-width/2-1, cy-h/2-1, width+2, h+2);
  ctx.fillStyle="#3a2a5c"; ctx.fillRect(cx-width/2, cy-h/2, width, h);
  ctx.fillStyle=color; ctx.fillRect(cx-width/2, cy-h/2, width*Math.max(0,hp/maxHp), h);
}
function drawCrystal(p, hp, maxHp, color){
  const s = HEX_SIZE*0.5;
  ctx.save();
  ctx.translate(p.x,p.y);
  const grad = ctx.createLinearGradient(0,-s,0,s);
  grad.addColorStop(0, lighten(color,35));
  grad.addColorStop(1, color);
  ctx.beginPath();
  ctx.moveTo(0,-s); ctx.lineTo(s*0.7,-s*0.15); ctx.lineTo(s*0.4,s); ctx.lineTo(-s*0.4,s); ctx.lineTo(-s*0.7,-s*0.15);
  ctx.closePath();
  ctx.fillStyle=grad; ctx.shadowColor=color; ctx.shadowBlur=18; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(0,s); ctx.moveTo(-s*0.7,-s*0.15); ctx.lineTo(s*0.7,-s*0.15);
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
  drawHpBar(p.x,p.y-s-10,hp,maxHp,color,36);
}

function draw(){
  ctx.clearRect(0,0,BOARD_W,BOARD_H);
  const placing = game.phase==="placement";
  const armedKind = (!placing && game.armed) ? game.armed.kind : null;
  const validSet = (armedKind==="unit") ? validPlacementCells(game.armed.player) : null;

  for(const cell of allCells){
    const p = screenPos(cell.q,cell.r);
    hexPath(p.x,p.y,HEX_SIZE-2);
    ctx.fillStyle = THEME_COLORS.tileBg;
    ctx.fill();
    ctx.strokeStyle = THEME_COLORS.tileBorder;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if(placing){
      if(inP1Zone(cell.q,cell.r)){
        hexPath(p.x,p.y,HEX_SIZE-4);
        ctx.fillStyle = "rgba(107,255,150,.16)";
        ctx.fill();
      }
    } else if(validSet && validSet.has(cellKey(cell.q,cell.r))){
      hexPath(p.x,p.y,HEX_SIZE-4);
      ctx.fillStyle = game.armed.player===1 ? "rgba(255,107,125,.28)" : "rgba(107,180,255,.28)";
      ctx.fill();
    } else if(armedKind==="crystal"){
      hexPath(p.x,p.y,HEX_SIZE-4);
      ctx.fillStyle = crystalOccupied(cell.q,cell.r) ? "rgba(255,80,80,.16)" : "rgba(107,180,255,.10)";
      ctx.fill();
    } else if(armedKind==="spell"){
      hexPath(p.x,p.y,HEX_SIZE-4);
      ctx.fillStyle = "rgba(183,140,255,.10)";
      ctx.fill();
    }
  }

  if(placing && game.hoverCell && inP1Zone(game.hoverCell.q,game.hoverCell.r)){
    ctx.globalAlpha = .55;
    drawCrystal(screenPos(game.hoverCell.q,game.hoverCell.r), START_HP, START_HP, THEME_COLORS.p1);
    const m = mirrorCell(game.hoverCell.q,game.hoverCell.r);
    drawCrystal(screenPos(m.q,m.r), START_HP, START_HP, THEME_COLORS.p2);
    ctx.globalAlpha = 1;
  }

  for(const pid of [1,2]){
    for(const cr of game.players[pid].crystals){
      drawCrystal(screenPos(cr.q,cr.r), cr.hp, cr.maxHp, pid===1?THEME_COLORS.p1:THEME_COLORS.p2);
    }
  }

  for(const c of game.characters){
    let p;
    if(c.nextQ!=null && c.moveProgress>0){
      const from = screenPos(c.q,c.r), to = screenPos(c.nextQ,c.nextR);
      p = { x: from.x + (to.x-from.x)*c.moveProgress, y: from.y + (to.y-from.y)*c.moveProgress };
    } else {
      p = screenPos(c.q,c.r);
    }
    const ownerColor = c.owner===1 ? THEME_COLORS.p1 : THEME_COLORS.p2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y+HEX_SIZE*0.32, HEX_SIZE*0.34, HEX_SIZE*0.13, 0, 0, Math.PI*2);
    ctx.fillStyle=ownerColor; ctx.globalAlpha=.5; ctx.fill(); ctx.globalAlpha=1;

    const img = getAppearanceImage(c.appearance);
    const dw = HEX_SIZE*1.35, dh = dw*100/96;
    if(img.complete && img.naturalWidth){
      ctx.drawImage(img, p.x-dw/2, p.y-dh*0.62, dw, dh);
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.fillStyle=c.appearance.palette.primary; ctx.fill();
    }
    if(c.frozenUntil>game.clock){
      ctx.strokeStyle="#bfe9ff"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,dw*0.62,0,Math.PI*2); ctx.stroke();
    }
    drawHpBar(p.x, p.y-dh*0.62-4, c.hp+(c.shield||0), c.maxHp+(c.shield||0), ownerColor, HEX_SIZE*0.7);
  }
}

function canvasCellFromEvent(ev){
  const rect = canvas.getBoundingClientRect();
  const px = (ev.clientX-rect.left)*(canvas.width/rect.width) - OX;
  const py = (ev.clientY-rect.top)*(canvas.height/rect.height) - OY;
  return pixelToAxial(px,py);
}
canvas.addEventListener("mousemove", (ev)=>{
  if(!game || game.phase!=="placement") return;
  const {q,r} = canvasCellFromEvent(ev);
  game.hoverCell = inBoard(q,r) ? {q,r} : null;
});
canvas.addEventListener("mouseleave", ()=>{ if(game) game.hoverCell=null; });
canvas.addEventListener("click", (ev)=>{
  if(!game || game.ended) return;
  if(game.phase==="placement"){
    const {q,r} = canvasCellFromEvent(ev);
    if(!inP1Zone(q,r)){ showToast(tr("invalidPlacementZone")); return; }
    game.players[1].crystals.push({q,r,hp:START_HP,maxHp:START_HP});
    const m = mirrorCell(q,r);
    game.players[2].crystals.push({q:m.q,r:m.r,hp:START_HP,maxHp:START_HP});
    game.phase = "battle";
    document.getElementById("placementBanner").classList.add("hidden");
    document.getElementById("panelP1").classList.remove("hidden");
    document.getElementById("panelP2").classList.remove("hidden");
    document.getElementById("btnPause").classList.remove("hidden");
    renderPanels();
    return;
  }
  if(game.paused) return;
  if(!game.armed) return;
  const {q,r} = canvasCellFromEvent(ev);
  if(!inBoard(q,r)) return;
  const {player, kind, id} = game.armed;
  if(player!==1) return; // seul le joueur humain agit via clic
  const pl = game.players[player];

  if(kind==="spell"){
    const ok = castSpell(player, id, {q,r});
    if(ok){ game.armed=null; renderPanels(); }
    return;
  }
  if(kind==="crystal"){
    if(crystalOccupied(q,r)){ showToast(tr("invalidCell")); return; }
    const cost = pl.nextCrystalCost;
    if(pl.gold<cost) return;
    pl.gold -= cost; pl.nextCrystalCost = Math.round(pl.nextCrystalCost*PRICE_INCREASE);
    pl.crystals.push({q,r,hp:START_HP,maxHp:START_HP});
  } else if(kind==="unit"){
    const valid = validPlacementCells(player);
    if(!valid.has(cellKey(q,r))){ showToast(tr("invalidCell")); return; }
    const t = roster.find(t=>t.id===id);
    if(!t){ game.armed=null; return; }
    const cost = currentUnitCost(pl, t);
    if(pl.gold<cost) return;
    pl.gold -= cost;
    pl.unitPurchaseCount[t.id] = (pl.unitPurchaseCount[t.id]||0)+1;
    game.characters.push(makeCharacter(player, t, q, r));
  }
  game.armed = null;
  renderPanels();
});

document.addEventListener("keydown",(ev)=>{
  if(!game || game.ended || game.phase!=="battle") return;
  if(ev.key==="Escape"){ game.armed=null; renderPanels(); return; }
  const k = ev.key.toLowerCase();
  if(k==="p"){ togglePause(); return; }
  if(game.paused) return;
  if(k==="c"){ armSelection(1,"crystal",null); return; }
  if(k==="s"){ const sid=game.players[1].spellId; if(sid) armSelection(1,"spell",sid); return; }
  if(/^[1-7]$/.test(ev.key)){
    const idx = parseInt(ev.key,10)-1;
    const equipped = roster.filter(t=>t.equipped);
    if(equipped[idx]) armSelection(1,"unit",equipped[idx].id);
  }
});

/* ============================================================
   TOOLTIP
   ============================================================ */
const tooltipEl = document.getElementById("tooltip");
function showTooltip(html, x, y){
  tooltipEl.innerHTML = html;
  tooltipEl.classList.remove("hidden");
  const pad=16;
  let left=x+pad, top=y+pad;
  if(left+270>window.innerWidth) left = x-270-pad;
  if(top+160>window.innerHeight) top = y-160;
  tooltipEl.style.left = Math.max(4,left)+"px";
  tooltipEl.style.top = Math.max(4,top)+"px";
}
function hideTooltip(){ tooltipEl.classList.add("hidden"); }
function attachTooltip(el, htmlFn){
  el.addEventListener("mousemove", (e)=> showTooltip(htmlFn(), e.clientX, e.clientY));
  el.addEventListener("mouseleave", hideTooltip);
}
function tooltipHTMLForUnit(tpl, cost){
  const appr = getAppearance(tpl);
  return "<div class='ttHead'>"+appearanceSVG(appr,44)+"<b>"+escapeHtml(tpl.name)+"</b></div>"+
    "<div class='ttStats'>"+tr("statAtk")+" "+tpl.atk+" · "+tr("statHp")+" "+tpl.hp+" · "+tr("statRange")+" "+tpl.range+" · "+tr("statSpeed")+" "+tpl.speed+"</div>"+
    "<div class='ttCost'>"+(cost==null?statCost(tpl):cost)+"€</div>";
}
function tooltipHTMLForCrystal(cost){
  return "<div class='ttHead'><b>◆ "+tr("crystalName")+"</b></div>"+
    "<div class='ttStats'>"+tr("statHp")+" "+START_HP+"</div>"+
    "<div class='ttCost'>"+cost+"€</div>";
}
function tooltipHTMLForSpell(spell){
  return "<div class='ttHead'><b>"+spell.icon+" "+escapeHtml(localName(spell))+"</b></div>"+
    "<div class='ttDesc'>"+escapeHtml(localDesc(spell))+"</div>"+
    "<div class='ttCost'>"+tr("freeLabel")+" · "+tr("cooldownLabel")+" "+(spell.cooldownMs/1000)+"s</div>";
}

/* ============================================================
   HUD / PANELS
   ============================================================ */
function updateHUD(){
  document.getElementById("goldP1").textContent = "💰 "+Math.floor(game.players[1].gold)+"€";
  document.getElementById("goldP2").textContent = "💰 "+Math.floor(game.players[2].gold)+"€";
  for(const pid of [1,2]){
    const pl = game.players[pid];
    if(pid===1){
      document.querySelectorAll("#panelP1 .unitBtn[data-cost]").forEach(b=>{
        const cost = parseInt(b.dataset.cost,10);
        b.disabled = pl.gold < cost;
      });
    }
    const sBtn = document.getElementById("spellBtn"+pid);
    if(sBtn){
      const remaining = Math.max(0, Math.ceil((pl.spellCooldownUntil-game.clock)/1000));
      const costEl = sBtn.querySelector(".cost");
      if(costEl) costEl.textContent = remaining>0 ? ("⏳ "+remaining+"s") : tr("ready");
      if(pid===1) sBtn.disabled = remaining>0;
    }
  }
}

function renderPanels(){
  for(const pid of [1,2]){
    const equipped = pid===1 ? roster.filter(t=>t.equipped) : (game.botDeck||[]);
    const panel = document.getElementById("panelP"+pid);
    panel.innerHTML = "";
    const header = document.createElement("div");
    header.className = "sideHeader";
    header.textContent = pid===1 ? tr("you") : tr("botN",{n:botLevel});
    panel.appendChild(header);

    const crystalBtn = document.createElement("button");
    crystalBtn.className = "unitBtn crystalBtn" + (pid===2?" readonly":"") + (game.armed && game.armed.player===pid && game.armed.kind==="crystal" ? " armed" : "");
    const ccost = game.players[pid].nextCrystalCost;
    crystalBtn.dataset.cost = ccost;
    crystalBtn.innerHTML = "<b>◆ "+tr("crystalName")+"</b><span class='cost'>"+ccost+"€</span>";
    if(pid===1) crystalBtn.onclick = ()=> armSelection(pid, "crystal", null);
    attachTooltip(crystalBtn, ()=>tooltipHTMLForCrystal(ccost));
    panel.appendChild(crystalBtn);

    const spellId = game.players[pid].spellId;
    if(spellId){
      const spell = SPELLS.find(s=>s.id===spellId);
      if(spell){
        const sBtn = document.createElement("button");
        sBtn.id = "spellBtn"+pid;
        sBtn.className = "unitBtn spellBtn" + (pid===2?" readonly":"") + (game.armed && game.armed.player===pid && game.armed.kind==="spell" ? " armed" : "");
        sBtn.innerHTML = "<b>"+spell.icon+" "+escapeHtml(localName(spell))+"</b><span class='cost'>"+tr("ready")+"</span>";
        if(pid===1) sBtn.onclick = ()=> armSelection(pid, "spell", spell.id);
        attachTooltip(sBtn, ()=>tooltipHTMLForSpell(spell));
        panel.appendChild(sBtn);
      }
    }

    for(const t of equipped){
      const cost = currentUnitCost(game.players[pid], t);
      const appr = getAppearance(t);
      const btn = document.createElement("button");
      btn.className = "unitBtn" + (pid===2?" readonly":"") + (game.armed && game.armed.player===pid && game.armed.kind==="unit" && game.armed.id===t.id ? " armed" : "");
      btn.dataset.cost = cost;
      btn.innerHTML = "<b>"+appearanceSVG(appr,26)+" "+escapeHtml(t.name)+"</b><span class='cost'>"+cost+"€</span>";
      if(pid===1) btn.onclick = ()=> armSelection(pid, "unit", t.id);
      attachTooltip(btn, ()=>tooltipHTMLForUnit(t,cost));
      panel.appendChild(btn);
    }
  }
}
function armSelection(pid, kind, id){
  if(!game || game.ended || game.paused) return;
  if(game.armed && game.armed.player===pid && game.armed.kind===kind && game.armed.id===id) game.armed=null;
  else game.armed = {player:pid, kind, id};
  renderPanels();
}

let toastTimer=null;
function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }

/* ============================================================
   NAVIGATION
   ============================================================ */
function showScreen(name){
  currentScreen = name;
  document.getElementById("menuScreen").classList.toggle("hidden", name!=="menu");
  document.getElementById("rosterScreen").classList.toggle("hidden", name!=="roster");
  document.getElementById("settingsScreen").classList.toggle("hidden", name!=="settings");
  document.getElementById("gameScreen").classList.toggle("hidden", name!=="game");
  if(name==="menu") refreshMenuStatus();
  if(name==="settings") renderSettingsScreen();
  if(name==="game"){
    document.getElementById("endOverlay").classList.add("hidden");
    lastTs=null;
    if(!animHandle) animHandle = requestAnimationFrame(tick);
  }
}
function refreshMenuStatus(){
  const el = document.getElementById("menuStatus");
  if(!el) return;
  const n = roster.filter(t=>t.equipped).length;
  const spell = SPELLS.find(s=>s.id===equippedSpellId);
  el.textContent = tr("statusTeam",{n:n, max:MAX_EQUIPPED, spell: spell?localName(spell):tr("statusNoSpell")});
  [1,2,3].forEach(n=>document.getElementById("botLvl"+n).classList.toggle("selected", botLevel===n));
}

function startPlacementPhase(){
  game = newGame();
  document.getElementById("panelP1").classList.add("hidden");
  document.getElementById("panelP2").classList.add("hidden");
  document.getElementById("btnPause").classList.add("hidden");
  document.getElementById("btnPause").textContent = tr("pause");
  document.getElementById("pauseBanner").classList.add("hidden");
  document.getElementById("hudHint").textContent = tr("hudHint");
  const banner = document.getElementById("placementBanner");
  banner.textContent = tr("choosePlacement");
  banner.classList.remove("hidden");
  showScreen("game");
}
document.getElementById("btnPlay").onclick = ()=>{
  const equippedCount = roster.filter(t=>t.equipped).length;
  if(equippedCount===0){ showToast(tr("needTeam")); renderRosterScreen(); showScreen("roster"); return; }
  startPlacementPhase();
};
document.getElementById("btnRoster").onclick = ()=>{ renderRosterScreen(); showScreen("roster"); };
document.getElementById("btnSettings").onclick = ()=>{ renderSettingsScreen(); showScreen("settings"); };
document.getElementById("rosterBack").onclick = ()=> showScreen("menu");
document.getElementById("settingsBack").onclick = ()=> showScreen("menu");
document.getElementById("btnQuit").onclick = ()=>{ game=null; showScreen("menu"); };
document.getElementById("btnPause").onclick = togglePause;
document.getElementById("btnReplay").onclick = ()=>{
  document.getElementById("endOverlay").classList.add("hidden");
  const equippedCount = roster.filter(t=>t.equipped).length;
  if(equippedCount===0){ showToast(tr("needTeam")); renderRosterScreen(); showScreen("roster"); return; }
  startPlacementPhase();
};
document.getElementById("btnEndMenu").onclick = ()=>{ document.getElementById("endOverlay").classList.add("hidden"); game=null; showScreen("menu"); };
[1,2,3].forEach(n=>{
  document.getElementById("botLvl"+n).onclick = ()=>{ botLevel=n; safeSet(BOTLEVEL_KEY,String(n)); refreshMenuStatus(); };
});

/* ============================================================
   ROSTER SCREEN
   ============================================================ */
const fName=document.getElementById("fName"), fAtk=document.getElementById("fAtk"),
      fHp=document.getElementById("fHp"), fRange=document.getElementById("fRange"),
      fSpeed=document.getElementById("fSpeed"), editId=document.getElementById("editId"),
      creatorCost=document.getElementById("creatorCost"), btnSave=document.getElementById("btnSave"),
      btnCancelEdit=document.getElementById("btnCancelEdit");

let selectedAppearanceId = APPEARANCES[0].id;
const appearanceGrid = document.getElementById("appearanceGrid");
APPEARANCES.forEach(a=>{
  const b = document.createElement("button");
  b.type="button"; b.className="appBadge"; b.dataset.appid=a.id;
  b.innerHTML = appearanceSVG(a,50);
  b.title = localName(a);
  b.onclick = ()=>{ selectedAppearanceId=a.id; highlightAppearance(); };
  appearanceGrid.appendChild(b);
});
function highlightAppearance(){
  document.querySelectorAll(".appBadge").forEach(b=> b.classList.toggle("selected", b.dataset.appid===selectedAppearanceId));
}
function refreshAppearanceNames(){
  document.querySelectorAll(".appBadge").forEach(b=>{
    const a = APPEARANCES.find(a=>a.id===b.dataset.appid);
    if(a) b.title = localName(a);
  });
}

function currentFormCost(){ return (parseInt(fAtk.value,10)||0)+(parseInt(fHp.value,10)||0)+(parseInt(fRange.value,10)||0)+(parseInt(fSpeed.value,10)||0); }
function refreshCreatorCost(){ creatorCost.textContent = currentFormCost()+"€"; }
[fAtk,fHp,fRange,fSpeed].forEach(el=>el.addEventListener("input", refreshCreatorCost));

function resetForm(){
  editId.value=""; fName.value="Perso"; fAtk.value=2; fHp.value=3; fRange.value=1; fSpeed.value=2;
  selectedAppearanceId = APPEARANCES[0].id;
  highlightAppearance();
  btnSave.textContent = tr("create");
  btnCancelEdit.classList.add("hidden");
  refreshCreatorCost();
}
btnSave.onclick = ()=>{
  const name = (fName.value||"Perso").trim().slice(0,24) || "Perso";
  const atk = Math.max(0, parseInt(fAtk.value,10)||0);
  const hp = Math.max(1, parseInt(fHp.value,10)||1);
  const range = Math.max(0, parseInt(fRange.value,10)||0);
  const speed = Math.max(0, parseInt(fSpeed.value,10)||0);
  const appearanceId = selectedAppearanceId;
  if(editId.value){
    const t = roster.find(t=>t.id===editId.value);
    if(t){ t.name=name; t.atk=atk; t.hp=hp; t.range=range; t.speed=speed; t.appearanceId=appearanceId; }
  } else {
    roster.push({id:"c"+Date.now()+Math.random().toString(36).slice(2,7), name, atk, hp, range, speed, equipped:false, appearanceId});
  }
  saveRoster();
  resetForm();
  renderRosterScreen();
};
btnCancelEdit.onclick = resetForm;

function renderRosterScreen(){
  enforceEquipCap();
  document.getElementById("rosterTitleText").textContent = tr("rosterTitle");
  document.getElementById("rosterBackLabel").textContent = tr("back");
  document.getElementById("equippedLabelText").textContent = tr("equippedLabel");
  document.getElementById("lblName").textContent = tr("lblName");
  document.getElementById("lblAtk").textContent = tr("lblAtk");
  document.getElementById("lblHp").textContent = tr("lblHp");
  document.getElementById("lblRange").textContent = tr("lblRange");
  document.getElementById("lblSpeed").textContent = tr("lblSpeed");
  document.getElementById("lblCost").textContent = tr("lblCost");
  document.getElementById("lblAppearance").textContent = tr("lblAppearance");
  document.getElementById("charactersHeading").textContent = tr("charactersHeading");
  document.getElementById("spellHeading").textContent = tr("spellHeading");
  btnCancelEdit.textContent = tr("cancel");
  btnSave.textContent = editId.value ? tr("save") : tr("create");
  refreshAppearanceNames();

  const list = document.getElementById("charList");
  list.innerHTML = "";
  document.getElementById("equipCount").textContent = roster.filter(t=>t.equipped).length;

  for(const t of roster){
    const appr = getAppearance(t);
    const row = document.createElement("div");
    row.className = "charRow";
    row.innerHTML = appearanceSVG(appr,40)+
      "<span class='cName'>"+escapeHtml(t.name)+"</span>"+
      "<span class='cStats'>"+tr("statAtk")+" "+t.atk+" · "+tr("statHp")+" "+t.hp+" · "+tr("statRange")+" "+t.range+" · "+tr("statSpeed")+" "+t.speed+"</span>"+
      "<span class='cCost'>"+statCost(t)+"€</span>";

    const equipLabel = document.createElement("label");
    equipLabel.className = "equip";
    const cb = document.createElement("input");
    cb.type="checkbox"; cb.checked=!!t.equipped;
    cb.onchange = ()=>{
      const nowEquipped = roster.filter(x=>x.equipped).length;
      if(cb.checked && nowEquipped>=MAX_EQUIPPED){ cb.checked=false; showToast(tr("equipCapMsg")); return; }
      t.equipped = cb.checked; saveRoster(); renderRosterScreen();
    };
    equipLabel.appendChild(cb);
    equipLabel.appendChild(document.createTextNode(tr("equip")));
    row.appendChild(equipLabel);

    const editBtn = document.createElement("button");
    editBtn.textContent = tr("edit");
    editBtn.onclick = ()=>{
      editId.value=t.id; fName.value=t.name; fAtk.value=t.atk; fHp.value=t.hp; fRange.value=t.range; fSpeed.value=t.speed;
      selectedAppearanceId = t.appearanceId || APPEARANCES[0].id;
      highlightAppearance();
      btnSave.textContent = tr("save");
      btnCancelEdit.classList.remove("hidden");
      refreshCreatorCost();
      window.scrollTo(0,0);
    };
    row.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.className="danger"; delBtn.textContent=tr("delete");
    delBtn.onclick = ()=>{
      if(!confirm(tr("confirmDelete",{n:t.name}))) return;
      roster = roster.filter(x=>x.id!==t.id);
      saveRoster(); renderRosterScreen();
    };
    row.appendChild(delBtn);
    list.appendChild(row);
  }
  refreshCreatorCost();
  renderSpellSection();
}
function renderSpellSection(){
  const wrap = document.getElementById("spellList");
  wrap.innerHTML = "";
  for(const s of SPELLS){
    const selected = equippedSpellId===s.id;
    const row = document.createElement("div");
    row.className = "charRow";
    row.innerHTML = "<span style='font-size:22px;flex:none;'>"+s.icon+"</span>"+
      "<span class='cName'>"+escapeHtml(localName(s))+"</span>"+
      "<span class='cStats'>"+escapeHtml(localDesc(s))+" ("+tr("cooldownLabel")+" "+(s.cooldownMs/1000)+"s)</span>"+
      "<span class='cCost'>"+tr("freeLabel")+"</span>";
    const btn = document.createElement("button");
    btn.textContent = selected ? tr("equipped") : tr("equip");
    if(selected) btn.style.background = "#2f7a4a";
    btn.onclick = ()=>{
      equippedSpellId = selected ? null : s.id;
      saveEquippedSpell(equippedSpellId);
      renderSpellSection();
    };
    row.appendChild(btn);
    wrap.appendChild(row);
  }
}

  const el = document.getElementById("goldPerSecInput");

];

/* ============================================================
   REFRESH GLOBAL DES TEXTES (i18n)
   ============================================================ */
function refreshAllTexts(){
  document.getElementById("menuTitleText").textContent = tr("menuTitle");
  document.getElementById("btnPlay").textContent = tr("play");
  document.getElementById("btnRoster").textContent = tr("myCharacters");
  document.getElementById("btnSettings").textContent = tr("settings");
  document.getElementById("botLevelLabel").textContent = tr("botLevelLabel");
  document.getElementById("btnQuit").textContent = tr("quitMatch");
  document.getElementById("btnReplay").textContent = tr("replay");
  document.getElementById("btnEndMenu").textContent = tr("mainMenu");
  document.getElementById("hudHint").textContent = tr("hudHint");
  refreshMenuStatus();
  if(currentScreen==="roster") renderRosterScreen();
  if(currentScreen==="settings") renderSettingsScreen();
  if(currentScreen==="game" && game){
    document.getElementById("btnPause").textContent = game.paused ? tr("resume") : tr("pause");
    if(game.paused) document.getElementById("pauseBanner").textContent = tr("pausedLabel");
    if(game.phase==="placement") document.getElementById("placementBanner").textContent = tr("choosePlacement");
    else renderPanels();
  }
}

resetForm();
refreshAllTexts();

}catch(err){
  console.error(err);
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#7a2a3a;color:#fff;padding:10px 14px;z-index:9999;font-family:monospace;font-size:13px;white-space:pre-wrap;";
  banner.textContent = "Erreur au chargement du jeu : " + (err && err.message ? err.message : err);
  document.body.appendChild(banner);
}
})();
