    else if(canCrystal) h+=`<p class="hint">${t('crystalHint',{n:infiniteCrystals})}</p>`;
    if(canAlly)   h+=`<button id="buyAlly" ${disA}>${t('summonAlly')} (<span class="price">${priceLabel(pA)}</span>)</button>`;
    if(canMidas)  h+=`<button id="useDoubler" ${disMidas}>Utiliser un doubleur (x2 argent) : ${midasDoublers} en stock</button>`;
    if(canMidas)  h+=`<p class="hint">Dette maximale autorisee : -${Math.floor(midasMaxMoney)}&euro;</p>`;
    if(sessionMode==='gameplay8') h+=`<p class="hint">Taille : ${1+heroExtraTiles.length} case(s) — prochaine dans ${3-gastonGuardsSinceGrowth} garde(s)</p>`;
    if(hasTrait('mobileGuards')){

    if(canSwap) document.getElementById('buySwap').onclick=()=>{
      if(!canAfford(costs.swap)) return;
      spend(costs.swap);pendingAction='swapSelect';swapTargets=[];

    };

      playSfx('buy');updateHUD();renderPanel();saveChaosState();

      playSfx('buy');updateHUD();renderPanel();saveChaosState();
    };
    if(hasTrait('spellZones')){
      const goldBtn=document.getElementById('castGoldSpell'), witherBtn=document.getElementById('castWitherSpell');

    }

    };
    if(massTeleportReady) document.getElementById('useMassTeleport').onclick=()=>{
      pendingAction='massTeleportTarget';log(t('massTeleportHint'));
    };
    if(canAlly) document.getElementById('buyAlly').onclick=()=>{
      if(!canAfford(priceFor('summonAlly',costs.summonAlly))) return;
      pendingAction='placeAlly';log(t('chooseTileForAlly'));
    };
    if(canMidas) document.getElementById('useDoubler').onclick=()=>{
      if(midasDoublers<=0) return;
      midasDoublers--;money*=2;playSfx('buy');log('Argent double !');showToast('x2 Argent !');updateHUD();renderPanel();

  } else if(selected.type==='ally'){
    const al=selected.a;
    const pG=priceFor('guardPlace',al.costs.guardPlace);

    const disP=!canAfford(al.costs.point)?'disabled':'';
    let h=`<h3>&#10084; ${t('ally')} (${Math.round(Math.max(0,al.hp))}/${al.maxhp} PV)</h3>

    panel.innerHTML=h;

      spend(al.costs.point);al.costs.point=Math.ceil(al.costs.point*1.25);
      pointRate+=0.3;al.pointContribution=(al.pointContribution||0)+0.3;
      playSfx('buy');updateHUD();renderPanel();log(t('pointBought'));
    };

  } else if(selected.type==='guard'){
    const g=selected.g;
    const pUd=priceFor('dmgAll',g.costDmgUp);
    const pUb=priceFor('bountyAll',g.costBountyUp);
    let h=`<h3>${t('guard')}${g.boosted?' ⚡':''}</h3>
      <div class="row"><span>${t('dmg')}</span><span>${g.dmg}</span></div>
      <div class="row"><span>${t('range')}</span><span>${g.range}</span></div>
      <div class="row"><span>${t('bountyPerKill')}</span><span>+${g.bounty}&euro;</span></div>`;
    if(g.boosted) h+=`<p class="hint">⚡ Case boostante : +1 degat de depart gratuit.</p>`;
    const disUd=!canAfford(g.costDmgUp)?'disabled':'';
    const disUb=!canAfford(g.costBountyUp)?'disabled':'';
    h+=`<button id="upDmg" ${disUd}>${t('upDmg')} (<span class="price">${priceLabel(pUd)}</span>)</button>`;
    h+=`<button id="upBounty" ${disUb}>${t('upBounty')} (<span class="price">${priceLabel(pUb)}</span>)</button>`;
    panel.innerHTML=h;
    document.getElementById('upDmg').onclick=()=>{
      if(!canAfford(g.costDmgUp)) return;spend(g.costDmgUp);g.costDmgUp=Math.ceil(g.costDmgUp*1.25);g.dmg++;
      playSfx('buy');updateHUD();renderPanel();
    };
    document.getElementById('upBounty').onclick=()=>{
      if(!canAfford(g.costBountyUp)) return;spend(g.costBountyUp);g.costBountyUp=Math.ceil(g.costBountyUp*1.25);g.bounty++;
      playSfx('buy');updateHUD();renderPanel();
    };
  }
}

// Hover monstres (tooltip)
cv.addEventListener('mousemove',e=>{
  const {sx,sy,rect}=canvasScale();
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  hoverMonster=null;
  for(const m of monsters)
    if(Math.hypot(m.px-mx,m.py-my)<=SIZE*(m.isBoss?0.7:0.52)){hoverMonster=m;break;}
});
cv.addEventListener('mouseleave',()=>{hoverMonster=null;});

// Clic canvas
cv.addEventListener('click',e=>{
  const {sx,sy,rect}=canvasScale();
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  const tt=pxToHex(mx,my);
  if(!tt) return;

  // Placement initial des gardes
  if(initialPlacement){
    const k=axKey(tt.q,tt.r);
    if(occupiedSet().has(k)) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const g=newGuard();g.q=tt.q;g.r=tt.r;
    if(boostTiles.has(k)){g.dmg=2;g.boosted=true;}
    guards.push(g);
    if(guards.length>=GUARD_INIT) initialPlacement=false;
    return;
  }
  if(!gameRunning) return;

  if(pendingAction==='placeGuard'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const costObj=pendingAllySource?pendingAllySource.costs:costs;
    const price=priceFor('guardPlace',costObj.guardPlace);
    const g=newGuard();g.q=tt.q;g.r=tt.r;
    if(boostTiles.has(axKey(tt.q,tt.r))){g.dmg=2;g.boosted=true;}
    guards.push(g);
    spend(price);costObj.guardPlace=Math.ceil(costObj.guardPlace*1.25);
    if(sessionMode==='gameplay8'&&!pendingAllySource){
      gastonGuardsSinceGrowth++;
      if(gastonGuardsSinceGrowth>=3){gastonGuardsSinceGrowth=0;growHero();}
    }
    if(hasTrait('shufflingGuards')){
      guardsSinceShuffle++;
      if(guardsSinceShuffle>=5){ guardsSinceShuffle=0; shuffleAllGuards(); }
    }
    pendingAction=null;pendingAllySource=null;playSfx('buy');
    log(t('newGuardPlaced'));updateHUD();renderPanel();return;
  }

  if(pendingAction==='placeAlly'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const price=priceFor('summonAlly',costs.summonAlly);
    allies.push({q:tt.q,r:tt.r,hp:ALLY_MAXHP,maxhp:ALLY_MAXHP,pointContribution:0,costs:{guardPlace:BASE_COSTS.guardPlace,point:BASE_COSTS.point}});
    spend(price);costs.summonAlly=Math.ceil(costs.summonAlly*1.25);
    pendingAction=null;playSfx('buy');
    log(t('allyPlaced'));updateHUD();renderPanel();return;
  }

  if(pendingAction==='moveHeroFree'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    hero.q=tt.q;hero.r=tt.r;
    freeMoveAvailable=false;freeMoveTimer=0;
    pendingAction=null;playSfx('buy');
    updateHUD();renderPanel();saveChaosState();return;
  }

  if(pendingAction==='massTeleportTarget'){
    monsters.forEach(m=>{ m.q=tt.q;m.r=tt.r; const[px,py]=axToPx(tt.q,tt.r); m.px=px;m.py=py; m.pathKeys=null; });
    massTeleportReady=false;massTeleportTimer=0;
    pendingAction=null;playSfx('buy');
    log(t('massTeleportReady'));updateHUD();return;
  }

  if(pendingAction==='placeCrystal'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    crystalEntities.push({q:tt.q,r:tt.r,hp:20,maxhp:20});
    pendingAction=null;playSfx('buy');
    log(t('crystalBought'));updateHUD();renderPanel();saveChaosState();return;
  }

  if(pendingAction==='placeSpell'){
    const center=axKey(tt.q,tt.r);
    const zoneTiles=[center,...neighbors(tt.q,tt.r)].slice(0,4);
    spellZone={tiles:zoneTiles,type:pendingSpellType,untilWave:waveNum+1};
    spellCooldownWave=waveNum+3;
    pendingAction=null;pendingSpellType=null;playSfx('buy');
    log(t('placeSpellHint'));updateHUD();renderPanel();saveChaosState();return;
  }

  if(pendingAction==='swapSelect'){
    // Detect which entity was clicked (hero, guard, monster, zone de spawn, ou case vide)
    let entity=null;
    const dist=SIZE*0.76;
    if(Math.hypot(hero.px-mx,hero.py-my)<=dist) entity={type:'hero',obj:hero};
    if(!entity){
      const g=guards.find(g=>{const[px,py]=axToPx(g.q,g.r);return Math.hypot(px-mx,py-my)<=dist;});
      if(g) entity={type:'guard',obj:g};
    }
    if(!entity){
      const m=monsters.find(m=>Math.hypot(m.px-mx,m.py-my)<=dist);
      if(m) entity={type:'monster',obj:m};
    }
    if(!entity){
      const k=axKey(tt.q,tt.r);
      if(!tiles[k]) return;
      if(spawnPoints.includes(k)) entity={type:'spawn',obj:{q:tt.q,r:tt.r},key:k};
      else entity={type:'empty',obj:{q:tt.q,r:tt.r}};
    }
    // Avoid duplicate selection (meme case deja choisie)
    const entKey=axKey(entity.obj.q,entity.obj.r);
    if(swapTargets.some(t=>axKey(t.obj.q,t.obj.r)===entKey)) return;
    swapTargets.push(entity);
    if(swapTargets.length===2){
      // Execute swap: exchange q,r between all; snap monsters' px,py to new hex
      const a=swapTargets[0],b=swapTargets[1];
      const aq=a.obj.q,ar=a.obj.r,bq=b.obj.q,br=b.obj.r;
      if(a.type==='hero'||a.type==='guard'||a.type==='monster'){a.obj.q=bq;a.obj.r=br;}
      if(b.type==='hero'||b.type==='guard'||b.type==='monster'){b.obj.q=aq;b.obj.r=ar;}
      if(a.type==='monster'){const[px,py]=axToPx(a.obj.q,a.obj.r);a.obj.px=px;a.obj.py=py;a.obj.pathKeys=null;}
      if(b.type==='monster'){const[px,py]=axToPx(b.obj.q,b.obj.r);b.obj.px=px;b.obj.py=py;b.obj.pathKeys=null;}
      if(a.type==='spawn'){spawnPoints=spawnPoints.filter(k=>k!==a.key);spawnPoints.push(axKey(bq,br));}
      if(b.type==='spawn'){spawnPoints=spawnPoints.filter(k=>k!==b.key);spawnPoints.push(axKey(aq,ar));}
      // Recompute paths for all monsters
      monsters.forEach(m=>recomputePath(m));
      pendingAction=null;swapTargets=[];
      log('Echange effectue !');renderPanel();
    } else {
      log('Selectionne une 2eme entite.');
    }
    return;
  }

  // Selection hero / allie / garde
  const onHeroBody=(tt.q===hero.q&&tt.r===hero.r)||heroExtraTiles.some(ht=>ht.q===tt.q&&ht.r===tt.r);
  const guardHere=guards.find(g=>g.q===tt.q&&g.r===tt.r);
  if(onHeroBody&&guardHere){
    // Case partagee (Gaston + garde) : la moitie cliquee (gauche/droite) determine la cible
    const [tpx]=axToPx(tt.q,tt.r);
    selected=(mx<tpx)?{type:'hero'}:{type:'guard',g:guardHere};
  } else if(onHeroBody){
    selected={type:'hero'};
  } else {
    const al=allies.find(a=>a.q===tt.q&&a.r===tt.r);
    if(al){selected={type:'ally',a:al};}
    else{
      selected=guardHere?{type:'guard',g:guardHere}:null;
    }
  }
  renderPanel();
});

// Un raccourci peut etre une touche clavier ('p', 'f'...) ou un bouton de souris
// ('mouse1'=milieu, 'mouse2'=droit, 'mouse3'=retour, 'mouse4'=suivant — le clic
// gauche 'mouse0' reste reserve aux interactions de jeu et n'est jamais assignable).
function shortcutLabel(k){
  if(!k) return '-';
  if(k==='wheelup') return 'MOLETTE HAUT';
  if(k==='wheeldown') return 'MOLETTE BAS';
  if(k.startsWith('mouse')){
    const names={mouse1:'SOURIS MILIEU',mouse2:'SOURIS DROIT',mouse3:'SOURIS RETOUR',mouse4:'SOURIS SUIVANT'};
    return names[k]||('SOURIS '+k.slice(5));
  }
  return k.toUpperCase();
}
const SHORTCUT_BTN_IDS={pause:'pauseKeyBtn',abandon:'abandonKeyBtn',topBuy:'topBuyKeyBtn',
  bottomBuy:'bottomBuyKeyBtn',special:'specialKeyBtn'};
function captureShortcut(key){
  if(!listeningFor) return;
  if(listeningFor==='pause'){pauseKey=key;}
  if(listeningFor==='abandon'){abandonKey=key;}
  if(listeningFor==='topBuy'){topBuyKey=key;}
  if(listeningFor==='bottomBuy'){bottomBuyKey=key;}
  if(listeningFor==='special'){specialKey=key;}
  document.getElementById(SHORTCUT_BTN_IDS[listeningFor]).textContent=shortcutLabel(key);
  listeningFor=null;saveSettings();
}
// Pendant la capture d'un raccourci, un clic de souris (hors clic gauche) compte comme touche
document.addEventListener('mousedown',e=>{
  if(!listeningFor||e.button===0) return;
  e.preventDefault();
  captureShortcut('mouse'+e.button);
});
// ...ou un cran de molette (haut/bas assignables separement)
document.addEventListener('wheel',e=>{
  if(!listeningFor) return;
  e.preventDefault();
  captureShortcut(e.deltaY<0?'wheelup':'wheeldown');
},{passive:false});
document.addEventListener('contextmenu',e=>{
  if(listeningFor){ e.preventDefault(); return; }
  // Empeche le menu contextuel du navigateur si le clic droit sert de raccourci en jeu
  if(state==='playing'&&[pauseKey,abandonKey,topBuyKey,bottomBuyKey,specialKey].includes('mouse2')) e.preventDefault();
});
let abandonKeyHeld=false;
function triggerShortcut(k){
  if(listeningFor) return;
  if(k===pauseKey&&state==='playing'){togglePause();return;}
  if(abandonKey&&k===abandonKey&&state==='playing'){
    if(chaosMode){ if(!abandonKeyHeld){abandonKeyHeld=true;quitInfinite();} return; }
    if(!abandonKeyHeld){abandonKeyHeld=true;abandonHoldActive=true;abandonHoldT=0;}
    return;
  }
  if(topBuyKey&&k===topBuyKey&&state==='playing'){doTopBuy();return;}
  if(bottomBuyKey&&k===bottomBuyKey&&state==='playing'){doBottomBuy();return;}
  if(specialKey&&k===specialKey&&state==='playing'){doSpecial();return;}
}
function releaseShortcut(k){
  if(abandonKey&&k===abandonKey){abandonKeyHeld=false;stopAbandonHold();}
}
document.addEventListener('keydown',e=>{
  if(listeningFor){ captureShortcut(e.key.toLowerCase()); return; }
  triggerShortcut(e.key.toLowerCase());
});
document.addEventListener('keyup',e=>{ releaseShortcut(e.key.toLowerCase()); });
document.addEventListener('mousedown',e=>{
  if(listeningFor||e.button===0) return;
  triggerShortcut('mouse'+e.button);
});
document.addEventListener('mouseup',e=>{
  if(e.button===0) return;
  releaseShortcut('mouse'+e.button);
});
document.addEventListener('wheel',e=>{
  if(listeningFor) return;
  const k=e.deltaY<0?'wheelup':'wheeldown';
  // La molette n'a pas d'evenement de "relachement" : on declenche puis on relache aussitot
  triggerShortcut(k); releaseShortcut(k);
});

  abandonBtn.style.background=`linear-gradient(to right,#a33 ${pct*100}%,#333 ${pct*100}%)`;

}
function renderHeroCards(){

    {mode:'gameplay6',color:'#22ccaa',border:'#88ffe0',descKey:'heroDesc6'},
    {mode:'gameplay8',color:'#d97a3a',border:'#ffcc99',descKey:'heroDesc8'},
