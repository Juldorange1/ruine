<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hex Defense</title>
<style>
/* ── RESET & BASE ─────────────────────────────── */
*{user-select:none;-webkit-user-select:none;}
html,body{margin:0;background:#1b1b1b;color:#eee;font-family:sans-serif;height:100%;overflow:hidden;}
:root{
  --side-bg:#262626;--side-border:#444;--box-bg:#333;--accent:#ffd23f;
  --menu-bg:#1b1b1b;--btn-bg:#3a3a3a;--btn-border:#555;--btn-hover:#4a4a4a;
}
h2{margin:4px 0 16px;font-size:26px;color:var(--accent,#eee);}
h3{margin:4px 0;font-size:19px;}
button{background:var(--btn-bg);color:#eee;border:1px solid var(--btn-border);border-radius:5px;
  padding:10px;margin:5px 0;width:100%;cursor:pointer;font-size:15px;}
button:hover:not(:disabled){background:var(--btn-hover);}
button:disabled{opacity:.4;cursor:default;}

/* ── LAYOUT ───────────────────────────────────── */
#wrap{display:flex;height:100vh;}
#canvasWrap{flex:1 1 78%;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;}
canvas{background:#222;max-width:100%;max-height:100%;}

/* ── SIDEBAR ──────────────────────────────────── */
#side{display:none;width:380px;flex:0 0 380px;background:var(--side-bg);
  padding:18px;box-sizing:border-box;overflow-y:auto;border-left:3px solid var(--side-border);}
.statbox{display:flex;justify-content:space-between;align-items:center;margin:8px 0;
  background:var(--box-bg);border-radius:8px;padding:12px 16px;border:1px solid var(--side-border);}
.statbox .lbl{color:#ddd;font-size:17px;font-weight:600;}
.statbox .val{font-weight:bold;font-size:28px;}
#money{color:#ffd23f;} #hp{color:#ff6666;} #chrono{color:#7fd1ff;} #point{color:#ff7fe0;}
.row{display:flex;justify-content:space-between;margin:6px 0;font-size:16px;}
.price{font-weight:800;color:var(--accent,#ffd23f);}
.hint{font-size:14px;color:#9c9;margin:6px 0;}
#offerBox{display:none;}
#log{font-size:13px;color:#bbb;max-height:120px;overflow-y:auto;
  margin-top:12px;border-top:1px solid var(--side-border);padding-top:6px;}
#panel{margin-top:16px;padding-top:12px;border-top:2px solid var(--side-border);}
#panel h3{font-size:21px;}
#panel button{font-size:17px;padding:13px 12px;font-weight:600;}
#panel .row{font-size:19px;padding:4px 0;}
#boxHp,#boxWave{display:none !important;}

/* ── OVERLAYS ─────────────────────────────────── */
#overlay,#settingsOverlay,#detteSetupOverlay,#rulesOverlay{
  position:absolute;inset:0;background:var(--menu-bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
#settingsOverlay,#detteSetupOverlay,#rulesOverlay{display:none;z-index:5;}
#overlay h2{font-size:42px;margin-bottom:10px;}
#overlay p{font-size:22px;margin:4px 0 14px;}
#overlay button{width:300px;font-size:18px;padding:14px;}

/* ── DIFFICULTE ROWS ──────────────────────────── */
.diffrow{display:flex;align-items:center;gap:14px;margin:7px 0;justify-content:center;}
.diffbtn{font-size:18px;padding:14px 10px;width:180px;flex:0 0 180px;}
.diffstats{font-size:14px;color:#ddd;text-align:left;min-width:200px;}
.daily-btn{background:linear-gradient(135deg,#1a3a6b,#2a5fa8)!important;border-color:#6aabff!important;}
.daily-btn:hover:not(:disabled){background:linear-gradient(135deg,#2a5fa8,#3a7fd8)!important;}

/* ── PARAMETRES & REGLES ──────────────────────── */
.settingsRow{margin:10px 0;font-size:15px;}
.settingsRow select{font-size:14px;padding:4px;}
#settingsBtn{position:absolute;width:auto;padding:8px 12px;top:10px;left:10px;}
#rulesBtn{position:absolute;width:auto;padding:8px 12px;top:54px;left:10px;}
.rulesCard{background:var(--box-bg);border:1px solid var(--side-border);border-radius:14px;
  padding:28px 32px;max-width:620px;max-height:82vh;overflow-y:auto;
  box-shadow:0 10px 36px rgba(0,0,0,.5);}
.rulesCard h2{text-align:center;margin-top:0;}
#rulesText{text-align:left;font-size:15px;line-height:1.7;color:#e8e0d0;}
#rulesText b{display:block;color:var(--accent,#ffd23f);font-size:17px;margin:16px 0 4px;}
#rulesText b:first-child{margin-top:0;}

/* ── HUD IN-GAME ──────────────────────────────── */
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,.95);color:#ffd23f;padding:10px 22px;border-radius:8px;
  font-size:18px;font-weight:700;opacity:0;transition:opacity .4s;
  pointer-events:none;z-index:40;white-space:nowrap;}
#holdDarken{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:90;}

/* ── STATS DERNIERE PARTIE (affiché dans le menu) ── */
#lastStats{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,0.82);
  color:#eee;padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.8;
  z-index:3;display:none;pointer-events:none;border:1px solid #555;}
#lastStats b{color:var(--accent,#ffd23f);}
.keyBtn{width:80px!important;display:inline-block;}

/* ── THEMES ───────────────────────────────────── */
body.theme-desert{
  --side-bg:linear-gradient(165deg,#3d2b14,#6b4423 50%,#8a5a2a);
  --side-border:#d99b3f;--accent:#2ec4b6;--box-bg:linear-gradient(135deg,#4a341a,#6b4423);
  --menu-bg:#2b2014;--btn-bg:linear-gradient(135deg,#5c3f1e,#7a531f);--btn-border:#d99b3f;
  --btn-hover:linear-gradient(135deg,#7a531f,#a06a2a);}
body.theme-forest{
  --side-bg:linear-gradient(165deg,#0d2414,#1f3d22 50%,#2f5233);
  --side-border:#7bc47f;--accent:#d9a441;--box-bg:linear-gradient(135deg,#16321b,#234d2a);
  --menu-bg:#13211a;--btn-bg:linear-gradient(135deg,#1f4d24,#2e6b32);--btn-border:#7bc47f;
  --btn-hover:linear-gradient(135deg,#2e6b32,#3c8c3c);}
body.theme-characters{
  --side-bg:linear-gradient(165deg,#2a1830,#44225a 50%,#5c2e78);
  --side-border:#d8a8ff;--accent:#ffd23f;--box-bg:linear-gradient(135deg,#3a1f4a,#54306e);
  --menu-bg:#1f1726;--btn-bg:linear-gradient(135deg,#4a2760,#6a3a8a);--btn-border:#d8a8ff;
  --btn-hover:linear-gradient(135deg,#6a3a8a,#8a4ac0);}
body.theme-epure{
  --side-bg:linear-gradient(165deg,#1a2030,#28333f 50%,#34404f);
  --side-border:#90aac0;--accent:#60d8e0;--box-bg:linear-gradient(135deg,#1e2838,#2e3c4a);
  --menu-bg:#141c28;--btn-bg:linear-gradient(135deg,#263040,#344458);--btn-border:#90aac0;
  --btn-hover:linear-gradient(135deg,#344458,#445870);}
.statbox{border:1px solid var(--side-border);}
</style>
</head>

  <div id="canvasWrap">

      <div id="diffList"></div>
    </div>

    <!-- Selection du heros -->
    <div id="heroSelectOverlay" style="position:absolute;inset:0;background:var(--menu-bg);

      <h2 style="margin:10px 0 4px;">Choisir le Héros</h2>

      <button id="closeHeroSelect" style="width:200px;margin-top:4px;"></button>
    </div>

    <!-- Regles -->
    <div id="rulesOverlay">
      <div class="rulesCard">
        <h2 id="rulesTitle"></h2>
        <div id="rulesText"></div>
        <button id="closeRules" style="width:200px;margin-top:18px;"></button>
      </div>
    </div>

    <!-- Setup dette (Otto) -->
    <div id="detteSetupOverlay">
      <h2 id="detteSetupTitle"></h2>
      <p id="detteSetupLabel"></p>
      <input type="number" id="detteAmountInput" value="100" min="0" step="100"
        style="width:140px;font-size:18px;padding:8px;text-align:center;margin:8px 0;">
      <button id="detteStartBtn" style="width:200px;"></button>
      <button id="detteCancelBtn" style="width:200px;"></button>
    </div>

    <!-- Parametres -->
    <div id="settingsOverlay">
      <h2 id="setTitle"></h2>
      <div class="settingsRow">
        <span id="langLbl"></span> :
        <select id="langSelect">
          <option value="fr">Francais</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="settingsRow"><span id="decorLbl"></span> : <select id="decorSelect"></select></div>
      <div class="settingsRow" style="display:none;"><span id="modeLbl"></span> : <select id="modeSelect"></select></div>
      <div class="settingsRow">
        <span id="volLbl"></span> :
        <input type="range" id="volSlider" min="0" max="100" value="50">
      </div>
      <div class="settingsRow">
        <span id="pauseKeyLbl"></span> :
        <button id="pauseKeyBtn" class="keyBtn">P</button>
      </div>
      <button id="closeSettings"></button>
    </div>

    <div id="holdDarken"></div>
    <button id="settingsBtn">&#9881;</button>
    <button id="rulesBtn">&#128220;</button>
  </div>

  <!-- ── SIDEBAR ───────────────────────────────── -->
  <div id="side">
    <h2>Hex Defense</h2>
    <button id="speedBtn"></button>
    <div class="statbox" id="boxHp">
      <span class="lbl" id="lblHp"></span><span class="val" id="hp">50/50</span>
    </div>
    <div class="statbox">
      <span class="lbl" id="lblMoney"></span><span class="val" id="money">0</span>
    </div>
    <div class="statbox" id="boxPoint">
      <span class="lbl" id="lblPoint"></span><span class="val" id="point">0</span>
    </div>
    <div id="boxDiff" style="font-size:13px;color:#bbb;text-align:center;margin:2px 0 2px;letter-spacing:.5px;"></div>
    <div class="statbox" id="boxSpecial" style="display:none;">
      <span class="lbl" id="lblSpecial">⏱</span><span class="val" id="specialVal">-</span>
    </div>
    <div class="statbox" id="boxEnzo" style="display:none;gap:6px;">
      <span class="lbl" id="lblEnzo">Ennemis vague</span>
      <span style="display:flex;align-items:center;gap:6px;">
        <span class="val" id="enzoVal">0</span>
        <button id="enzoPlus" style="width:34px;padding:2px 0;font-size:20px;font-weight:900;line-height:1;">+</button>
      </span>
    </div>
    <div class="statbox" id="boxWave">
      <span class="lbl" id="lblWave"></span><span class="val" id="wave">-</span>
    </div>
    <div class="statbox" id="boxTimer">
      <span class="lbl" id="lblTimer"></span><span class="val" id="timer">-</span>
    </div>
    <div class="statbox" id="boxChrono">
      <span class="lbl" id="lblChrono"></span><span class="val" id="chrono">00:00</span>
    </div>
    <div id="offerBox"></div>
    <div class="statbox" id="boxDette" style="display:none;">
      <span class="lbl" id="lblDette">Dette</span><span class="val" id="detteVal">0/0&euro;</span>
    </div>
    <button id="abandonBtn"></button>
    <div id="panel"></div>
    <div id="log"></div>
  </div>

</div>

// GEOMETRIE HEX (coordonnees axiales)
// ══════════════════════════════════════════════════════
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const SPEED_PX = SIZE * Math.sqrt(3); // px/s a vitesse x1

function axKey(q, r){ return q+','+r; }

function axToPxRel(q, r){
  return [SIZE * 1.5 * q, SIZE * Math.sqrt(3) * (r + q/2)];
}

function hexCorner(cx, cy, i){
  const a = Math.PI / 180 * (60 * i);
  return [cx + SIZE*Math.cos(a), cy + SIZE*Math.sin(a)];
}

function hexDist(q1, r1, q2, r2){
  return (Math.abs(q1-q2)+Math.abs(r1-r2)+Math.abs(q1+r1-q2-r2)) / 2;
}

// Construit un dict de tuiles {key:{q,r,pxRel,pyRel}} pour un rayon donne
function buildTileData(Rv){
  const d = {};
  for(let q=-Rv; q<=Rv; q++)
    for(let r=-Rv; r<=Rv; r++)
      if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r)) <= Rv){
        const [px,py] = axToPxRel(q,r);
        d[axKey(q,r)] = {q,r,pxRel:px,pyRel:py};
      }
  return d;
}

const normalTileData = buildTileData(HEX_R);
const largeTileData  = buildTileData(LARGE_R);

// Tuiles actives + offsets canvas (muables selon le mode)
let tiles = {};
let CX=0, CY=0;

// Applique un jeu de tuiles et redimensionne le canvas
function applyTileData(tdata){
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for(const k in tdata){
    mnX=Math.min(mnX,tdata[k].pxRel); mxX=Math.max(mxX,tdata[k].pxRel);
    mnY=Math.min(mnY,tdata[k].pyRel); mxY=Math.max(mxY,tdata[k].pyRel);
  }
  cv.width  = Math.ceil(mxX-mnX+PAD_TILE*2);
  cv.height = Math.ceil(mxY-mnY+PAD_TILE*2);
  CX = PAD_TILE-mnX; CY = PAD_TILE-mnY;
  tiles = {};
  for(const k in tdata)
    tiles[k] = {q:tdata[k].q, r:tdata[k].r,
                px:tdata[k].pxRel+CX, py:tdata[k].pyRel+CY};
}
applyTileData(normalTileData);

function axToPx(q,r){ const [p,q2]=axToPxRel(q,r); return [p+CX, q2+CY]; }
function neighbors(q,r){ return DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>tiles[k]); }


// ══════════════════════════════════════════════════════
// DEFI DU JOUR — RNG deterministe + generation de carte
// ══════════════════════════════════════════════════════
function seededRng(seed){
  let s = seed|0;
  return ()=>{ s=Math.imul(1664525,s)+1013904223|0; return (s>>>0)/4294967296; };
}
function dailySeed(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function dailyDateStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Genere un sous-ensemble connexe de 80-120 tuiles via BFS aleatoire
function generateDailyMap(){
  const rng=seededRng(dailySeed());
  const target=80+Math.floor(rng()*41);
  const active=new Set(['0,0']), frontier=['0,0'];
  while(active.size<target){
    if(!frontier.length) break;
    const fi=Math.floor(rng()*frontier.length), cur=frontier[fi];
    const [q,r]=cur.split(',').map(Number);
    const ns=DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>largeTileData[k]&&!active.has(k));
    if(!ns.length){ frontier.splice(fi,1); continue; }
    const nk=ns[Math.floor(rng()*ns.length)];
    active.add(nk); frontier.push(nk);
    if(rng()<0.12) frontier.splice(fi,1);
  }
  const res={};
  for(const k of active) res[k]=largeTileData[k];
  return res;
}

// HELPERS GRILLE
// ══════════════════════════════════════════════════════
function occupiedSet(){
  const s=new Set(); s.add(axKey(hero.q,hero.r));
  guards.forEach(g=>s.add(axKey(g.q,g.r)));
  allies.forEach(a=>s.add(axKey(a.q,a.r)));
  if(debtTileKey) s.add(debtTileKey);
  return s;
}

// Verifie que poser un garde en (q,r) ne deconnecte pas la grille
function canPlaceGuard(q,r){
  const k=axKey(q,r);
  if(!tiles[k]||spawnPoints.includes(k)) return false;
  const occ=occupiedSet(); if(occ.has(k)) return false;
  occ.add(k);
  const reach=new Set([axKey(hero.q,hero.r)]), queue=[axKey(hero.q,hero.r)];
  while(queue.length){
    const cur=queue.shift(); const tt=tiles[cur];
    for(const nk of neighbors(tt.q,tt.r)){
      if(!occ.has(nk)&&!reach.has(nk)){ reach.add(nk); queue.push(nk); }
    }
  }
  for(const k2 in tiles) if(!occ.has(k2)&&!reach.has(k2)) return false;
  return true;
}

// BFS du point A vers B en evitant blocked (sauf destination)
function bfsPath(fq,fr,tq,tr,blocked){
  const start=axKey(fq,fr), goal=axKey(tq,tr);
  if(start===goal) return [];
  const came={}, visited=new Set([start]), queue=[start];
  while(queue.length){
    const cur=queue.shift(); if(cur===goal) break;
    const tt=tiles[cur];
    for(const nk of neighbors(tt.q,tt.r)){
      if(visited.has(nk)||blocked.has(nk)&&nk!==goal) continue;
      visited.add(nk); came[nk]=cur; queue.push(nk);
    }
  }
  if(!visited.has(goal)) return null;
  const path=[]; let cur=goal;
  while(cur!==start){ path.unshift(cur); cur=came[cur]; }
  return path;
}

// Verifie si un garde intercepte la ligne monstre->heros
function pointNearSegment(px,py,x1,y1,x2,y2,thr){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0) return Math.hypot(px-x1,py-y1)<thr;
  const t2=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t2*dx),py-(y1+t2*dy))<thr;
}
function guardBlocksLOS(m,heroPx){
  if(!m.rangeBonus) return false;
  for(const g of guards){
    const [gx,gy]=axToPx(g.q,g.r);
    if(pointNearSegment(gx,gy,m.px,m.py,heroPx[0],heroPx[1],SIZE*0.85)) return true;
  }
  return false;
}

function pxToHex(mx,my){
  let best=null,bestD=Infinity;
  for(const k in tiles){
    const tt=tiles[k], d=(tt.px-mx)**2+(tt.py-my)**2;
    if(d<bestD){bestD=d;best=tt;}
  }
  return bestD<=SIZE*SIZE?best:null;
}
function canvasScale(){
  const rect=cv.getBoundingClientRect();
  return {sx:cv.width/rect.width,sy:cv.height/rect.height,rect};
}

const MONSTER_TYPES=['fast','hp','dmg'];

function monsterStats(){
  const hp = Math.max(1, Math.ceil(2 * Math.pow(1.1, waveNum - 1) * DIFF_HP_MULT[difficulty-1]));
  const dmg = 1;

function pickRandomSpawnPoints(){

  const cands=Object.keys(tiles).filter(k=>{
    if(occ.has(k)) return false;
    const tt=tiles[k]; return hexDist(tt.q,tt.r,hero.q,hero.r)>4;
  });
  spawnPoints=[];
  while(spawnPoints.length<2&&cands.length){
    spawnPoints.push(cands.splice(Math.floor(Math.random()*cands.length),1)[0]);
  }
}
function pickDebtTile(){
  const occ=occupiedSet();
  const cands=Object.keys(tiles).filter(k=>!occ.has(k)&&!spawnPoints.includes(k));
  debtTileKey=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
}

function startWave(){

function spawnMonster(){
  if(!spawnPoints.length) return;
  const k=spawnPoints[Math.floor(Math.random()*spawnPoints.length)];
  const tt=tiles[k]; if(!tt) return;
  let {hp,dmg}=monsterStats(), speedMult=1, rangeBonus=0;
  switch(currentMonsterType){
    case 'fast': speedMult=1.5; break;
    case 'hp':   hp=Math.round(hp*1.5); break;
    case 'dmg':  dmg=Math.round(dmg*1.5); break;
  }
  monsters.push({q:tt.q,r:tt.r,px:tt.px,py:tt.py,hp,maxhp:hp,dmg,
    speedMult,rangeBonus,type:currentMonsterType,pathKeys:null,attackAcc:0});
}

function recomputePath(m){
  const blocked=new Set();
  guards.forEach(g=>blocked.add(axKey(g.q,g.r)));
  m.pathKeys=bfsPath(m.q,m.r,hero.q,hero.r,blocked);
}

// ══════════════════════════════════════════════════════
// BOUCLE DE JEU — update
// ══════════════════════════════════════════════════════
function update(dt){
  if(state!=='playing') return;
  elapsedSeconds+=realDt;

  // Chrono de partie
  matchTimer-=dt;
  document.getElementById('chrono').textContent=formatTime(Math.max(0,matchTimer));
  if(matchTimer<=0){ matchTimer=0; endGame('timeup'); return; }

  // Regeneration heros
  if(hero.hp<hero.maxhp) hero.hp=Math.min(hero.maxhp,hero.hp+HERO_REGEN*dt);

  // Revenu adjacent (Noa)
  if(pointRate>0&&sessionMode==='gameplay2'){
    pointIncomeAcc+=dt;
    while(pointIncomeAcc>=1){
      pointIncomeAcc-=1;
      const occ=occupiedSet();
      const adj=neighbors(hero.q,hero.r).filter(nk=>tiles[nk]&&!occ.has(nk)).length;
      point+=pointRate*adj; updateHUD();
    }
  }
  // Doublement automatique toutes les 3 min (Midas)
  if(sessionMode==='gameplay3'){
    midasTimer+=dt;
    const midasLeft=Math.max(0,Math.ceil(180-midasTimer));
    document.getElementById('specialVal').textContent=midasLeft+'s';
    if(midasTimer>=180){midasTimer-=180;money*=2;updateHUD();log('Midas : argent double !');showToast('x2 Argent !');}
  }
  // Changement de carte toutes les 4 min (Kael)
  if(sessionMode==='gameplay4'){
    if(kaelPendingGuards.length===0){
      mapChangeTimer-=dt;
      document.getElementById('specialVal').textContent=Math.max(0,Math.ceil(mapChangeTimer))+'s';
    } else {
      document.getElementById('specialVal').textContent='En cours...';
    }
    if(mapChangeTimer<=0&&kaelPendingGuards.length===0){
      kaelPendingGuards=guards.map(g=>Object.assign({},g));
      applyTileData(generateRandomMap());
      hero.q=0;hero.r=0;
      guards=[];monsters=[];swapTargets=[];kaelSelectedPending=null;
      mapChangeTimer=240;
      pickRandomSpawnPoints();
      renderKaelList();
      log(t('mapChange'));showToast(t('mapChange'));
    }
  }
  // Points accumulés (autres modes)
  if(pointRate>0&&sessionMode!=='gameplay2'){
    point+=pointRate*dt;
  }

  // Vagues
  waveTimer-=dt;
  document.getElementById('timer').textContent=Math.max(0,Math.ceil(waveTimer))+'s';
  if(waveTimer<=0){ startWave(); return; }
  const kaelBlocking=sessionMode==='gameplay4'&&kaelPendingGuards.length>0;
  if(!kaelBlocking){
    if(sessionMode==='gameplay5'){
      const remaining=waveSpawnTotal-waveSpawnCount;
      if(remaining>0&&waveTimer>0){
        const dynInterval=Math.max(0.05,waveTimer/remaining);
        spawnAcc+=dt;
        if(spawnAcc>=dynInterval){spawnAcc=0;spawnMonster();waveSpawnCount++;updateEnzoDisplay();}
      }
    } else {
      spawnAcc+=dt;
      if(spawnAcc>=SPAWN_INTERVAL&&waveSpawnCount<waveSpawnTotal){
        spawnAcc-=SPAWN_INTERVAL; spawnMonster(); waveSpawnCount++;
      }
    }
  }

  const heroPx=axToPx(hero.q,hero.r);

  // ── Monstres : attaque / deplacement ──
  for(const m of monsters){
    const atkRange=SIZE*1.8+(m.rangeBonus?m.rangeBonus*SIZE*Math.sqrt(3):0);
    const distHero=Math.hypot(heroPx[0]-m.px,heroPx[1]-m.py);

    let atkTarget=null, atkPx=null, atkDist=Infinity;
    if(distHero<=atkRange&&!guardBlocksLOS(m,heroPx)){atkTarget=hero;atkPx=heroPx;atkDist=distHero;}
    for(const al of allies){
      const [apx,apy]=axToPx(al.q,al.r);
      const dA=Math.hypot(apx-m.px,apy-m.py);
      if(dA<=atkRange&&dA<atkDist&&!guardBlocksLOS(m,[apx,apy])){atkTarget=al;atkPx=[apx,apy];atkDist=dA;}
    }

    if(atkTarget){
      m.attackAcc+=dt;
      while(m.attackAcc>=1){
        m.attackAcc-=1; atkTarget.hp-=m.dmg;
        if(atkTarget===hero) heroHitFlash=0.35;
        monsterAttackFx.push({x1:m.px,y1:m.py,x2:atkPx[0],y2:atkPx[1],life:0.3});
        playSfx('hit');
      }
      continue;
    }

    if(!m.pathKeys||!m.pathKeys.length) recomputePath(m);
    if(!m.pathKeys||!m.pathKeys.length) continue;
    let rem=SPEED_PX*(m.speedMult||1)*dt;
    while(rem>0&&m.pathKeys&&m.pathKeys.length){
      const nk=m.pathKeys[0];
      if(guards.some(g=>axKey(g.q,g.r)===nk)){m.pathKeys=null;break;}
      const nt=tiles[nk];
      const dx=nt.px-m.px,dy=nt.py-m.py,d=Math.hypot(dx,dy);
      if(d<=rem){
        m.px=nt.px;m.py=nt.py;m.q=nt.q;m.r=nt.r;rem-=d;m.pathKeys.shift();
        if(Math.hypot(heroPx[0]-m.px,heroPx[1]-m.py)<=atkRange) break;
      } else {
        m.px+=dx/d*rem;m.py+=dy/d*rem;rem=0;
      }
    }
  }

  // ── Gardes : attaque des monstres ──
  for(const g of guards){
    g.cooldown-=dt; if(g.cooldown>0) continue; g.cooldown+=1;
    const [gx,gy]=axToPx(g.q,g.r);
    const maxR=g.range*SIZE*Math.sqrt(3)+SIZE*0.5;
    let target=null;
    for(const m of monsters){
      const d=Math.hypot(gx-m.px,gy-m.py);
      if(d<=maxR&&(!target||m.hp<target.hp)){target=m;}
    }
    if(!target) continue;
    attackFx.push({x1:gx,y1:gy,x2:target.px,y2:target.py,life:0.25});
    target.hp-=g.dmg;
    playSfx('attack');
    if(target.hp<=0){
      money+=g.bounty;
      monsters=monsters.filter(m=>m!==target);
      playSfx('kill');log(t('guardKill',{x:g.bounty}));
    }
  }

  // Decrementation effets
  for(const fx of attackFx) fx.life-=dt;
  for(const fx of monsterAttackFx) fx.life-=dt;
  attackFx=attackFx.filter(fx=>fx.life>0);
  monsterAttackFx=monsterAttackFx.filter(fx=>fx.life>0);
  if(heroHitFlash>0) heroHitFlash-=realDt;

  if(allies.some(a=>a.hp<=0)){
    allies.filter(a=>a.hp<=0).forEach(a=>{pointRate-=(a.pointContribution||0);log(t('allyDown'));});
    allies=allies.filter(a=>a.hp>0);
    if(selected&&selected.type==='ally'&&!allies.includes(selected.a)){selected=null;renderPanel();}
  }
  if(hero.hp<=0){hero.hp=0;playSfx('lose');endGame();return;}
  updateHUD();
}

function formatTime(s){
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

    }
    if(s.sfxVolume!==undefined) sfxVolume=s.sfxVolume;
    if(s.pauseKey) pauseKey=s.pauseKey;
  }catch(e){}
}

}

function generateRandomMap(){
  const rng=seededRng(Math.floor(Math.random()*2147483647));
  const target=80+Math.floor(rng()*41);
  const active=new Set(['0,0']), frontier=['0,0'];
  while(active.size<target){
    if(!frontier.length) break;
    const fi=Math.floor(rng()*frontier.length), cur=frontier[fi];
    const [q,r]=cur.split(',').map(Number);
    const ns=DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>largeTileData[k]&&!active.has(k));
    if(!ns.length){frontier.splice(fi,1);continue;}
    const nk=ns[Math.floor(rng()*ns.length)];
    active.add(nk);frontier.push(nk);
    if(rng()<0.12) frontier.splice(fi,1);
  }
  const res={};for(const k of active) res[k]=largeTileData[k];
  return res;
}

// Termine la partie — retour direct au menu + stats en bas a gauche
function endGame(reason){
  state='gameover';gameRunning=false;

  // Otto : succes/echec du remboursement de dette
  let detteLine='';
  if(sessionMode==='gameplay7'){
    if(debtPaid>=debtGoal&&debtGoal>0){
      point=point*(debtGoal/100);
      detteLine=t('detteSuccess')+' (x'+(debtGoal/100).toFixed(2)+')<br>';
    } else {
      point=0;
      detteLine=t('detteFail')+'<br>';
    }
  }

  if(dailyMode) recordDailyResult(Math.floor(point));
  else recordNormalResult(difficulty,sessionMode,Math.floor(point));

  const label=reason==='abandon'?t('abandoned'):reason==='timeup'?t('timeUp'):t('gameOver');

  // Construction HTML des stats
  let html='<b>'+t('lastGame')+' &mdash; '+label+'</b><br>';
  html+=detteLine;
  html+=t('finalPoint')+' : '+Math.floor(point)+'<br>';
  html+=t('totalSpent')+' : '+Math.floor(totalSpent)+'&euro;<br>';
  html+=t('time')+' : '+formatTime(elapsedSeconds);

  showMenu();
  const el=document.getElementById('lastStats');
  el.innerHTML=html; el.style.display='block';
}

// Formes des monstres selon leur type
function drawMonsterShape(m){
  const px=m.px,py=m.py,r=SIZE*0.38*(m.isBoss?1.7:1);
  if(m.isBoss){
    ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle='#8a1a1a';ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.stroke();
    return;
  }
  switch(m.type){
    case 'fast':
      ctx.beginPath();
      ctx.moveTo(px,py-r*1.7);ctx.lineTo(px+r*0.55,py);
      ctx.lineTo(px,py+r*0.75);ctx.lineTo(px-r*0.55,py);ctx.closePath();
      ctx.fillStyle='#0899bb';ctx.fill();ctx.strokeStyle='#66ddff';ctx.lineWidth=2;ctx.stroke();break;
    case 'hp':
      ctx.beginPath();ctx.arc(px,py,r*1.28,0,Math.PI*2);
      ctx.fillStyle='#aa8800';ctx.fill();ctx.strokeStyle='#ffdd44';ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(px,py,r*0.75,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,220,60,0.4)';ctx.lineWidth=1.5;ctx.stroke();break;
    case 'dmg':
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const ang=i/12*Math.PI*2-Math.PI/2,rad=i%2===0?r*1.35:r*0.52;
        const x=px+rad*Math.cos(ang),y=py+rad*Math.sin(ang);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fillStyle='#aa1111';ctx.fill();ctx.strokeStyle='#ff5544';ctx.lineWidth=2;ctx.stroke();break;
    case 'fly':
      // corps central violet clair
      ctx.beginPath();ctx.arc(px,py,r*0.7,0,Math.PI*2);
      ctx.fillStyle='#cc44cc';ctx.fill();ctx.strokeStyle='#ff88ff';ctx.lineWidth=2;ctx.stroke();
      // ailes gauche et droite
      ctx.fillStyle='rgba(220,150,255,0.7)';
      ctx.beginPath();ctx.ellipse(px-r*1.3,py-r*0.3,r*0.85,r*0.4,0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(px+r*1.3,py-r*0.3,r*0.85,r*0.4,-0.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,180,255,0.8)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(px-r*1.3,py-r*0.3,r*0.85,r*0.4,0.5,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.ellipse(px+r*1.3,py-r*0.3,r*0.85,r*0.4,-0.5,0,Math.PI*2);ctx.stroke();break;
    default:
      ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fillStyle='#a8311f';ctx.fill();ctx.strokeStyle='#ff9a6a';ctx.lineWidth=2;ctx.stroke();
  }
}

// Tooltip au survol d un ennemi
function drawTooltip(m){
  const names=lang==='en'
    ?{fast:'Fast',hp:'HP',dmg:'Damage',range:'Range'}
    :{fast:'Rapide',hp:'PV',dmg:'Degats',range:'Portee'};
  const lines=['❤ '+Math.round(m.hp)+' / '+m.maxhp, '⚔ '+m.dmg+' dmg/s',
    (lang==='en'?'Type: ':'Type : ')+(m.isBoss?'BOSS':(names[m.type]||'?'))];
  if(m.speedMult>1) lines.push('x'+m.speedMult.toFixed(1)+' vitesse');
  if(m.rangeBonus>0) lines.push('+'+m.rangeBonus+' portee');
  const fw=150,lh=17,pad=8,fh=lines.length*lh+pad*2;
  let tx=m.px+SIZE*0.55,ty=m.py-fh-SIZE*0.3;
  if(tx+fw>cv.width-4) tx=m.px-fw-SIZE*0.55;
  if(ty<4) ty=m.py+SIZE*0.55;
  ctx.fillStyle='rgba(0,0,0,0.88)';
  ctx.beginPath();const rx=5;
  ctx.moveTo(tx+rx,ty);ctx.lineTo(tx+fw-rx,ty);ctx.arcTo(tx+fw,ty,tx+fw,ty+rx,rx);
  ctx.lineTo(tx+fw,ty+fh-rx);ctx.arcTo(tx+fw,ty+fh,tx+fw-rx,ty+fh,rx);
  ctx.lineTo(tx+rx,ty+fh);ctx.arcTo(tx,ty+fh,tx,ty+fh-rx,rx);
  ctx.lineTo(tx,ty+rx);ctx.arcTo(tx,ty,tx+rx,ty,rx);ctx.closePath();
  ctx.fill();ctx.strokeStyle='rgba(200,200,200,0.3)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#eee';ctx.font='12px sans-serif';ctx.textAlign='left';
  lines.forEach((l,i)=>ctx.fillText(l,tx+pad,ty+pad+12+i*lh));
}

// Rendu principal (appelee chaque frame)
function render(){
  const d=DECORS[decorIndex];
  ctx.clearRect(0,0,cv.width,cv.height);

  // Tuiles
  const spawnSet=new Set(spawnPoints);
  for(const k in tiles){
    const tt=tiles[k];
    let fill=((tt.q+tt.r)%2===0)?d.tile:(d.tile2||d.tile);
    if(spawnSet.has(k)) fill=d.spawnTile;
    if(sessionMode==='gameplay7'&&k===debtTileKey) fill='#c9a227';
    drawHex(tt.px,tt.py,fill,'#3a3a3a');
  }
  if(sessionMode==='gameplay7'&&debtTileKey&&tiles[debtTileKey]){
    const dt=tiles[debtTileKey];
    ctx.fillStyle='#1a1408';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.floor(debtPaid)+'/'+debtGoal+'€',dt.px,dt.py+4);
  }

  // Heros
  const hpx=axToPx(hero.q,hero.r);
  if(d.characters){
    drawCharacterHero(hpx[0],hpx[1]);
  } else if(d.emoji){
    ctx.font=(SIZE*1.2)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText(d.heroEmoji||'🧑',hpx[0],hpx[1]+SIZE*0.35);
  } else {
    const hColors={gameplay1:['#3388ee','#88ccff'],gameplay2:['#2aaa6a','#7be0b0'],
      gameplay3:['#cc9922','#ffe070'],gameplay4:['#9933cc','#dd88ff'],gameplay5:['#ee4411','#ffaa55'],
      gameplay6:['#22ccaa','#88ffe0'],gameplay7:['#c9a227','#ffe090']};
    const [hFill,hStroke]=(hColors[sessionMode]||[d.heroColor,d.heroStroke]);
    drawHex(hpx[0],hpx[1],hFill,hStroke);
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(heroName(sessionMode).toUpperCase(),hpx[0],hpx[1]-4);
  }
  if(selected&&selected.type==='hero'){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
    ctx.setLineDash([5,4]);ctx.beginPath();
    ctx.arc(hpx[0],hpx[1],SIZE*0.76,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  if(swapTargets.some(t=>t.obj===hero)){
    ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
    ctx.setLineDash([]);ctx.beginPath();
    ctx.arc(hpx[0],hpx[1],SIZE*0.78,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText(Math.round(Math.max(0,hero.hp))+'/'+hero.maxhp,hpx[0],hpx[1]+(d.emoji?SIZE*0.7:12));

  // Allies (Iris)
  for(const al of allies){
    const [apx,apy]=axToPx(al.q,al.r);
    drawHex(apx,apy,'#22ccaa','#88ffe0');
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('❤ '+Math.round(Math.max(0,al.hp))+'/'+al.maxhp,apx,apy+4);
    if(selected&&selected.type==='ally'&&selected.a===al){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
      ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.arc(apx,apy,SIZE*0.76,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  // Flash rouge sur le heros uniquement
  if(heroHitFlash>0){
    const a=Math.min(1,heroHitFlash/0.35)*0.88;
    const grad=ctx.createRadialGradient(hpx[0],hpx[1],SIZE*0.15,hpx[0],hpx[1],SIZE*1.15);
    grad.addColorStop(0,'rgba(255,50,50,'+a+')');
    grad.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(hpx[0],hpx[1],SIZE*1.2,0,Math.PI*2);ctx.fill();
  }

  // Gardes
  for(const g of guards){
    const [px,py]=axToPx(g.q,g.r);
    const isSel=selected&&selected.g===g;
    const isMoving=pendingAction==='moveSelect'&&moveSelected.includes(g);
    if(d.characters){
      drawCharacterGuard(px,py,isSel,isMoving);
    } else {
      drawHex(px,py,isSel?d.guardSelColor:d.guardColor,isSel?d.guardSelStroke:d.guardStroke);
    }
    if(isSel){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
      ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.arc(px,py,SIZE*0.76,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(swapTargets.some(t=>t.obj===g)){
      ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
      ctx.setLineDash([]);ctx.beginPath();
      ctx.arc(px,py,SIZE*0.78,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('d'+g.dmg+' p'+g.range+' +'+g.bounty+'€',px,py+(d.emoji?SIZE*0.65:14));
  }

  // Effets attaques gardes (jaune)
  for(const fx of attackFx){
    const a=Math.max(0,fx.life/0.25);
    ctx.strokeStyle='rgba(255,220,80,'+a+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);ctx.lineTo(fx.x2,fx.y2);ctx.stroke();
    ctx.beginPath();ctx.arc(fx.x2,fx.y2,SIZE*0.5*a+4,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,220,80,'+a+')';ctx.lineWidth=2;ctx.stroke();
  }

  // Effets attaques monstres (rouge pointille)
  for(const fx of monsterAttackFx){
    const a=Math.max(0,fx.life/0.3);
    ctx.save();ctx.setLineDash([6,4]);
    ctx.strokeStyle='rgba(255,60,60,'+a+')';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);ctx.lineTo(fx.x2,fx.y2);ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(fx.x2,fx.y2,SIZE*0.5*a,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,80,80,'+a*0.6+')';ctx.lineWidth=2;ctx.stroke();
  }

  // Monstres
  for(const m of monsters){
    const sc=m.isBoss?1.7:1;
    if(d.emoji){
      ctx.font=(SIZE*0.85*sc)+'px sans-serif';ctx.textAlign='center';
      ctx.fillText(monsterEmoji(m),m.px,m.py+SIZE*0.28*sc);
    } else {
      drawMonsterShape(m);
    }
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font=(m.isBoss?'bold 13px':'bold 11px')+' sans-serif';
    ctx.fillText(Math.round(m.hp),m.px,m.py+(d.emoji?SIZE*0.6*sc:3));
    if(swapTargets.some(t=>t.obj===m)){
      ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
      ctx.setLineDash([]);ctx.beginPath();
      ctx.arc(m.px,m.py,SIZE*0.78*sc,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  // Tooltip hover ennemi
  if(hoverMonster&&monsters.includes(hoverMonster)) drawTooltip(hoverMonster);

  // Bandeau placement initial (supprimé)
  if(false&&initialPlacement&&state==='playing'){
    const txt=t('chooseGuardTiles',{n:guards.length,g:GUARD_INIT});
    const tw=ctx.measureText(txt).width+24;
    ctx.fillStyle='rgba(255,220,80,0.95)';
    ctx.fillRect(cv.width/2-tw/2,4,tw,26);
    ctx.fillStyle='#111';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(txt,cv.width/2,22);
  }
  if(pendingAction==='placeGuard'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('hintPlaceGuard'),cv.width/2,24);
  }
  if(pendingAction==='placeAlly'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('chooseTileForAlly'),cv.width/2,24);
  }
  if(paused){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('paused'),cv.width/2,cv.height/2);
  }
}

// Boucle principale
function loop(ts){
  const dtRaw=(ts-lastT)/1000;lastT=ts;
  realDt=Math.min(dtRaw,0.25);
  abandonTick(realDt);
  if(!paused&&gameRunning) update(Math.min(dtRaw,0.2)*SPEEDS[speedIndex]);
  refreshAffordability();
  render();
  requestAnimationFrame(loop);
}

function refreshAffordability(){
  if(!selected) return;
  const q=id=>document.getElementById(id);
  if(selected.type==='hero'){
    if(q('buyGuard'))  q('buyGuard').disabled =money<priceFor('guardPlace',costs.guardPlace);
    if(q('buySwap'))   q('buySwap').disabled  =money<costs.swap;
    if(q('buyPoint'))  q('buyPoint').disabled =money<costs.point;
    if(q('buyAlly'))   q('buyAlly').disabled  =money<priceFor('summonAlly',costs.summonAlly);
  } else if(selected.type==='ally'){
    const al=selected.a;
    if(q('allyBuyGuard')) q('allyBuyGuard').disabled=money<priceFor('guardPlace',al.costs.guardPlace);
    if(q('allyBuyPoint')) q('allyBuyPoint').disabled=money<al.costs.point;
  } else if(selected.type==='guard'){
    const g=selected.g;
    if(q('upDmg'))       q('upDmg').disabled      =money<priceFor('dmgAll',g.costDmgUp);
    if(q('upBounty'))    q('upBounty').disabled    =money<priceFor('bountyAll',g.costBountyUp);
  }
}

function renderPanel(){
  const panel=document.getElementById('panel');
  if(!selected){panel.innerHTML='';return;}
  const canPoint   =true;
  const canSwap    =sessionMode==='gameplay1';

  if(selected.type==='hero'){
    const pG=priceFor('guardPlace',costs.guardPlace);
    const disG=money<pG?'disabled':'';
    const disS=money<costs.swap?'disabled':'';
    const disP=money<costs.point?'disabled':'';
    const ptLabel=sessionMode==='gameplay2'?'+1 adj./pts':'+1 pt/s';
    const ptHint=sessionMode==='gameplay2'?`Pts/s adj. : +${pointRate}/case vide/s`:`Points : +${pointRate}/s`;
    const canAlly=canPoint&&sessionMode==='gameplay6';
    const pA=priceFor('summonAlly',costs.summonAlly);
    const disA=money<pA?'disabled':'';
    let h=`<h3>&#10084; ${heroName(sessionMode)}</h3>
      <button id="buyGuard" ${disG}>${t('buyGuard')} (<span class="price">${pG}&euro;</span>)</button>`;
    if(canSwap)   h+=`<button id="buySwap" ${disS}>Echanger 2 entites (<span class="price">${costs.swap}&euro;</span>)</button>`;
    if(canPoint)  h+=`<button id="buyPoint" ${disP}>${ptLabel} (<span class="price">${costs.point}&euro;</span>)</button>`;
    if(canPoint)  h+=`<p class="hint">${ptHint}</p>`;
    if(canAlly)   h+=`<button id="buyAlly" ${disA}>${t('summonAlly')} (<span class="price">${pA}&euro;</span>)</button>`;
    panel.innerHTML=h;
    document.getElementById('buyGuard').onclick=()=>{
      if(money<priceFor('guardPlace',costs.guardPlace)) return;
      pendingAction='placeGuard';log(t('chooseTileForGuard'));
    };
    if(canSwap) document.getElementById('buySwap').onclick=()=>{
      if(money<costs.swap) return;
      spend(costs.swap);pendingAction='swapSelect';swapTargets=[];
      log('Selectionne 2 entites a echanger.');updateHUD();renderPanel();
    };
    if(canPoint) document.getElementById('buyPoint').onclick=()=>{
      if(money<costs.point) return;
      spend(costs.point);costs.point=Math.ceil(costs.point*1.2);pointRate++;
      playSfx('buy');updateHUD();renderPanel();log(t('pointBought'));
    };
    if(canAlly) document.getElementById('buyAlly').onclick=()=>{
      if(money<priceFor('summonAlly',costs.summonAlly)) return;
      pendingAction='placeAlly';log(t('chooseTileForAlly'));
    };

  } else if(selected.type==='ally'){
    const al=selected.a;
    const pG=priceFor('guardPlace',al.costs.guardPlace);
    const disG=money<pG?'disabled':'';
    const disP=money<al.costs.point?'disabled':'';
    let h=`<h3>&#10084; ${t('ally')} (${Math.round(Math.max(0,al.hp))}/${al.maxhp} PV)</h3>
      <button id="allyBuyGuard" ${disG}>${t('buyGuard')} (<span class="price">${pG}&euro;</span>)</button>
      <button id="allyBuyPoint" ${disP}>+1 pt/s (<span class="price">${al.costs.point}&euro;</span>)</button>
      <p class="hint">Points : +${pointRate}/s (dont ${al.pointContribution||0}/s de cet allie)</p>`;
    panel.innerHTML=h;
    document.getElementById('allyBuyGuard').onclick=()=>{
      if(money<priceFor('guardPlace',al.costs.guardPlace)) return;
      pendingAction='placeGuard';pendingAllySource=al;log(t('chooseTileForGuard'));
    };
    document.getElementById('allyBuyPoint').onclick=()=>{
      if(money<al.costs.point) return;
      spend(al.costs.point);al.costs.point=Math.ceil(al.costs.point*1.2);
      pointRate++;al.pointContribution=(al.pointContribution||0)+1;
      playSfx('buy');updateHUD();renderPanel();log(t('pointBought'));
    };

  } else if(selected.type==='guard'){
    const g=selected.g;
    const pUd=priceFor('dmgAll',g.costDmgUp);
    const pUb=priceFor('bountyAll',g.costBountyUp);
    let h=`<h3>${t('guard')}</h3>
      <div class="row"><span>${t('dmg')}</span><span>${g.dmg}</span></div>
      <div class="row"><span>${t('range')}</span><span>${g.range}</span></div>
      <div class="row"><span>${t('bountyPerKill')}</span><span>+${g.bounty}&euro;</span></div>`;
    const disUd=money<g.costDmgUp?'disabled':'';
    const disUb=money<g.costBountyUp?'disabled':'';
    h+=`<button id="upDmg" ${disUd}>${t('upDmg')} (<span class="price">${pUd}&euro;</span>)</button>`;
    h+=`<button id="upBounty" ${disUb}>${t('upBounty')} (<span class="price">${pUb}&euro;</span>)</button>`;
    panel.innerHTML=h;
    document.getElementById('upDmg').onclick=()=>{
      if(money<g.costDmgUp) return;spend(g.costDmgUp);g.costDmgUp=Math.ceil(g.costDmgUp*1.2);g.dmg++;
      playSfx('buy');updateHUD();renderPanel();
    };
    document.getElementById('upBounty').onclick=()=>{
      if(money<g.costBountyUp) return;spend(g.costBountyUp);g.costBountyUp=Math.ceil(g.costBountyUp*1.2);g.bounty++;
      playSfx('buy');updateHUD();renderPanel();
    };
  }
}

// Hover monstres (tooltip)
cv.addEventListener('mousemove',e=>{

  hoverMonster=null;

// Clic canvas
cv.addEventListener('click',e=>{
  const {sx,sy,rect}=canvasScale();
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  const tt=pxToHex(mx,my); if(!tt) return;

  // Placement initial des gardes
  if(initialPlacement){
    const k=axKey(tt.q,tt.r);
    if(occupiedSet().has(k)) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const g=newGuard();g.q=tt.q;g.r=tt.r;guards.push(g);
    if(guards.length>=GUARD_INIT) initialPlacement=false;
    return;
  }
  if(!gameRunning) return;

  // Placement garde Kael depuis la liste
  if(sessionMode==='gameplay4'&&kaelPendingGuards.length>0&&kaelSelectedPending!==null){
    if(occupiedSet().has(axKey(tt.q,tt.r))){log(t('invalidPlacement'));return;}
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const g=kaelPendingGuards.splice(kaelSelectedPending,1)[0];
    g.q=tt.q;g.r=tt.r;guards.push(g);
    kaelSelectedPending=null;
    renderKaelList();
    if(kaelPendingGuards.length===0){log('Tous les gardes places !');showToast('Gardes places !');}
    return;
  }

  if(pendingAction==='placeGuard'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const costObj=pendingAllySource?pendingAllySource.costs:costs;
    const price=priceFor('guardPlace',costObj.guardPlace);
    const g=newGuard();g.q=tt.q;g.r=tt.r;guards.push(g);
    spend(price);costObj.guardPlace=Math.ceil(costObj.guardPlace*1.2);
    pendingAction=null;pendingAllySource=null;playSfx('buy');
    log(t('newGuardPlaced'));updateHUD();renderPanel();return;
  }

  if(pendingAction==='placeAlly'){
    if(occupiedSet().has(axKey(tt.q,tt.r))) return;
    if(!canPlaceGuard(tt.q,tt.r)){log(t('invalidPlacement'));return;}
    const price=priceFor('summonAlly',costs.summonAlly);
    allies.push({q:tt.q,r:tt.r,hp:ALLY_MAXHP,maxhp:ALLY_MAXHP,pointContribution:0,costs:{guardPlace:BASE_COSTS.guardPlace,point:BASE_COSTS.point}});
    spend(price);costs.summonAlly=Math.ceil(costs.summonAlly*1.2);
    pendingAction=null;playSfx('buy');
    log(t('allyPlaced'));updateHUD();renderPanel();return;
  }

  if(sessionMode==='gameplay7'&&debtTileKey&&axKey(tt.q,tt.r)===debtTileKey){
    if(money>0){debtPaid+=money;money=0;playSfx('buy');log(t('detteRepaid'));updateHUD();}
    return;
  }

  if(pendingAction==='swapSelect'){
    // Detect which entity was clicked (hero, guard, monster)
    let entity=null;
    const dist=SIZE*0.76;
    if(Math.hypot(hero.px-mx,hero.py-my)<=dist) entity={type:'hero',obj:hero};
    if(!entity){
      const g=guards.find(g=>{const[px,py]=axToPx(g.q,g.r);return Math.hypot(px-mx,py-my)<=dist;});
      if(g) entity={type:'guard',obj:g};
    }
    if(!entity){
      const m=monsters.find(m=>Math.hypot(m.px-mx,m.py-my)<=dist);
      if(m) entity={type:'monster',obj:m};
    }
    if(!entity) return;
    // Avoid duplicate selection
    if(swapTargets.some(t=>t.obj===entity.obj)) return;
    swapTargets.push(entity);
    if(swapTargets.length===2){
      // Execute swap: exchange q,r between all; snap monsters' px,py to new hex
      const a=swapTargets[0],b=swapTargets[1];
      const aq=a.obj.q,ar=a.obj.r,bq=b.obj.q,br=b.obj.r;
      a.obj.q=bq;a.obj.r=br;b.obj.q=aq;b.obj.r=ar;
      if(a.type==='monster'){const[px,py]=axToPx(a.obj.q,a.obj.r);a.obj.px=px;a.obj.py=py;a.obj.pathKeys=null;}
      if(b.type==='monster'){const[px,py]=axToPx(b.obj.q,b.obj.r);b.obj.px=px;b.obj.py=py;b.obj.pathKeys=null;}
      // Recompute paths for all monsters
      monsters.forEach(m=>recomputePath(m));
      pendingAction=null;swapTargets=[];
      log('Echange effectue !');renderPanel();
    } else {
      log('Selectionne une 2eme entite.');
    }
    return;
  }

  // Selection hero / allie / garde
  if(tt.q===hero.q&&tt.r===hero.r){selected={type:'hero'};}
  else {
    const al=allies.find(a=>a.q===tt.q&&a.r===tt.r);
    if(al){selected={type:'ally',a:al};}
    else{
      const g=guards.find(g=>g.q===tt.q&&g.r===tt.r);
      selected=g?{type:'guard',g}:null;
    }
  }
  renderPanel();
});

  abandonHoldT+=dt;
  const pct=Math.min(1,abandonHoldT/1.2);
  abandonBtn.style.background=`linear-gradient(to right,#a33 ${pct*100}%,#333 ${pct*100}%)`;
  if(abandonHoldT>=1.2){abandonHoldActive=false;abandonBtn.style.background='';endGame('abandon');}
}

document.getElementById('detteCancelBtn').addEventListener('click',()=>{
  document.getElementById('detteSetupOverlay').style.display='none';
  document.getElementById('overlay').style.display='flex';
  pendingGameStart=null;
});
document.getElementById('detteStartBtn').addEventListener('click',()=>{
  debtGoal=Math.max(0,parseInt(document.getElementById('detteAmountInput').value,10)||0);
  document.getElementById('detteSetupOverlay').style.display='none';
  const fn=pendingGameStart;pendingGameStart=null;
  if(fn) fn();
});


// ══════════════════════════════════════════════════════
// MENU — rendu des listes
// ══════════════════════════════════════════════════════
function renderHeroCards(){
  const container=document.getElementById('heroCards');
  if(!container) return;
  const heroes=[
    {mode:'gameplay1',color:'#3388ee',border:'#88ccff',descKey:'heroDesc1'},
    {mode:'gameplay2',color:'#2aaa6a',border:'#7be0b0',descKey:'heroDesc2'},
    {mode:'gameplay3',color:'#cc9922',border:'#ffe070',descKey:'heroDesc3'},
    {mode:'gameplay4',color:'#9933cc',border:'#dd88ff',descKey:'heroDesc4'},
    {mode:'gameplay5',color:'#ee4411',border:'#ffaa55',descKey:'heroDesc5'},
    {mode:'gameplay6',color:'#22ccaa',border:'#88ffe0',descKey:'heroDesc6'},
    {mode:'gameplay7',color:'#c9a227',border:'#ffe090',descKey:'heroDesc7'},
  ];
  container.innerHTML='';
  heroes.forEach(h=>{
    const name=heroName(h.mode);
    const isSelected=gameMode===h.mode;
    const card=document.createElement('div');
    card.style.cssText=`background:#2a2a2a;border:2px solid ${isSelected?h.border:'#555'};border-radius:12px;
      padding:18px 20px;width:190px;cursor:pointer;text-align:center;transition:border .2s;
      ${isSelected?'box-shadow:0 0 12px '+h.border+';':''}`;
    card.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:${h.color};
        border:3px solid ${h.border};margin:0 auto 10px;"></div>
      <div style="font-size:20px;font-weight:700;color:${h.border};margin-bottom:8px;">${name}</div>
      <div style="font-size:12px;color:#ccc;line-height:1.5;">${t(h.descKey)}</div>
      <button style="margin-top:12px;background:${isSelected?h.color:'#333'};border-color:${h.border};
        font-weight:${isSelected?'700':'400'};">${isSelected?'✓ Sélectionné':'Choisir'}</button>`;
    card.querySelector('button').addEventListener('click',()=>{
      gameMode=h.mode;saveSettings();
      renderHeroCards();
      const hsb=document.getElementById('heroSelectBtn');
      if(hsb) hsb.textContent='⚔ '+t('heroSelectBtn')+' : '+heroName(gameMode);
      renderDifficultyList();
    });
    container.appendChild(card);
  });
}

function renderKaelList(){
  const el=document.getElementById('kaelList');
  if(sessionMode!=='gameplay4'||kaelPendingGuards.length===0){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML='<div style="color:#dd88ff;font-weight:700;font-size:13px;text-align:center;margin-bottom:6px;">Gardes a placer</div>';
  kaelPendingGuards.forEach((g,i)=>{
    const isSel=kaelSelectedPending===i;
    const btn=document.createElement('div');
    btn.style.cssText=`background:${isSel?'#5a1a8a':'#2a1a3a'};border:2px solid ${isSel?'#dd88ff':'#7733aa'};
      border-radius:8px;padding:8px 10px;margin:4px 0;cursor:pointer;font-size:12px;color:#eee;text-align:center;`;
    btn.innerHTML=`<div style="font-weight:700;color:#dd88ff;margin-bottom:3px;">Garde ${i+1}</div>
      <div>⚔ ${g.dmg} &nbsp; 🎯 ${g.range} &nbsp; 💰 +${g.bounty}€</div>`;
    btn.addEventListener('click',()=>{
      kaelSelectedPending=isSel?null:i;
      renderKaelList();
    });
    el.appendChild(btn);
  });
}

function updateEnzoDisplay(){
  const rem=Math.max(0,waveSpawnTotal-waveSpawnCount);
  const el=document.getElementById('enzoVal');
  if(el) el.textContent=rem;
}

function renderDifficultyList(){
  const list=document.getElementById('diffList');
  list.innerHTML='';
  const lbl=lang==='en'?'Difficulty':'Difficulte';

  for(let d=1;d<=2;d++){
    const stats=loadStats(d,gameMode);
    const row=document.createElement('div');row.className='diffrow';
    row.innerHTML=`<button class="diffbtn" data-d="${d}">${lbl} ${d}</button>
      <div class="diffstats">${t('record')} : ${stats.best}<br>${t('totalPts')} : ${stats.totalPts||0}</div>`;
    list.appendChild(row);
  }
  list.querySelectorAll('.diffbtn').forEach(b=>{
    b.addEventListener('click',()=>startNormalGame(parseInt(b.dataset.d,10)));
  });

  // Defi du jour
  const dSt=loadDailyStats();
  const dRow=document.createElement('div');dRow.className='diffrow';
  dRow.innerHTML=`<button class="diffbtn daily-btn" id="dailyBtn">&#128197; ${t('dailyChallenge')}</button>
    <div class="diffstats">${t('record')} : ${dSt.best>0?dSt.best:'&mdash;'}<br>${dailyDateStr()}</div>`;
  list.appendChild(dRow);
  document.getElementById('dailyBtn').addEventListener('click',startDailyGame);

}

function buildDecorOptions(){
  const sel=document.getElementById('decorSelect');sel.innerHTML='';
  DECORS.forEach((d,i)=>{
    const opt=document.createElement('option');opt.value=i;opt.textContent=t(d.key);sel.appendChild(opt);
  });
  sel.value=decorIndex;
}
function buildModeOptions(){
  const sel=document.getElementById('modeSelect');sel.innerHTML='';
  [['gameplay1','modeNormal'],['gameplay2','modeHardcore'],['gameplay3','modeMidas'],['gameplay4','modeKael'],['gameplay5','modeEnzo'],['gameplay6','modeIris'],['gameplay7','detteMode']].forEach(([v,k])=>{
    const opt=document.createElement('option');opt.value=v;opt.textContent=t(k);sel.appendChild(opt);
  });
  sel.value=gameMode;
}

function applyStaticTexts(){
  const E=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  E('setTitle',t('settings'));
  E('langLbl',t('language')); E('decorLbl',t('decor')); E('modeLbl',t('gameMode'));
  E('closeSettings',t('close')); E('lblHp',t('hero')); E('lblMoney',t('money'));
  E('lblPoint',t('point')); E('lblWave',t('wave'));
  E('lblTimer',t('nextWave')); E('lblChrono',t('chrono'));
  E('abandonBtn',t('abandon'));
  E('speedBtn',t('speed')+' x'+SPEEDS[speedIndex]);
  E('volLbl',t('volume')); E('pauseKeyLbl',t('pauseKeyLbl'));
  E('rulesBtn',t('rulesBtn')); E('rulesTitle',t('rules')); E('closeRules',t('close'));
  E('detteSetupTitle',t('detteMode')); E('detteSetupLabel',t('detteSetupLabel'));
  E('detteStartBtn',t('detteStart')); E('detteCancelBtn',t('detteCancel'));
  E('lblDette',t('detteMode'));
  document.getElementById('rulesText').innerHTML=t('rulesText');
  const hsb=document.getElementById('heroSelectBtn');
  if(hsb) hsb.textContent='⚔ '+t('heroSelectBtn')+' : '+heroName(gameMode);
  document.getElementById('closeHeroSelect').textContent=t('heroSelectClose');
  buildDecorOptions();buildModeOptions();renderHeroCards();renderDifficultyList();
}
