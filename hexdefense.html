<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hex Defense</title>
<style>
/* ── RESET & BASE ─────────────────────────────── */
*{user-select:none;-webkit-user-select:none;}
html,body{margin:0;background:#1b1b1b;color:#eee;font-family:sans-serif;height:100%;overflow:hidden;}
/* Lueur d'ambiance discrete, teintee par l'accent du theme actif, doucement respirante */
body{position:relative;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--accent,#ffd23f) 14%, transparent), transparent 60%);
  animation:ambientBreathe 6s ease-in-out infinite;
}
@keyframes ambientBreathe{0%,100%{opacity:.55;} 50%{opacity:1;}}
#side,#leftPanel,#canvasWrap{position:relative;z-index:1;}
#settingsBtn,#rulesBtn{z-index:2;}
:root{
  --side-bg:#262626;--side-border:#444;--box-bg:#333;--accent:#ffd23f;
  --menu-bg:#1b1b1b;--btn-bg:#3a3a3a;--btn-border:#555;--btn-hover:#4a4a4a;
}
h2{margin:4px 0 16px;font-size:26px;color:var(--accent,#eee);}
h3{margin:4px 0;font-size:19px;}
button{background:var(--btn-bg);color:#eee;border:1px solid var(--btn-border);border-radius:5px;
  padding:10px;margin:5px 0;width:100%;cursor:pointer;font-size:15px;}
button:hover:not(:disabled){background:var(--btn-hover);}
button:disabled{opacity:.4;cursor:default;}

/* ── LAYOUT ───────────────────────────────────── */
#wrap{display:flex;height:100vh;height:100dvh;}
#canvasWrap{flex:1 1 78%;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;min-width:0;min-height:0;}
canvas{background:#222;max-width:100%;max-height:100%;min-width:0;min-height:0;
  width:auto;height:auto;object-fit:contain;}

/* ── SIDEBAR ──────────────────────────────────── */
#side{display:none;flex-direction:column;width:380px;flex:0 0 380px;background:var(--side-bg);
  padding:14px;box-sizing:border-box;overflow:hidden;border-left:3px solid var(--side-border);
  min-width:0;min-height:0;}
.statbox{display:flex;justify-content:space-between;align-items:center;margin:6px 0;
  background:var(--box-bg);border-radius:8px;padding:9px 14px;border:1px solid var(--side-border);}
.statbox .lbl{color:#ddd;font-size:15px;font-weight:600;}
.statbox .val{font-weight:bold;font-size:23px;}
#money{color:#ffd23f;} #hp{color:#ff6666;} #chrono{color:#7fd1ff;} #point{color:#ff7fe0;}
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:15px;}
.price{font-weight:800;color:var(--accent,#ffd23f);}
.hint{font-size:13px;color:#9c9;margin:4px 0;}
#offerBox{display:none;}
#log{font-size:12px;color:#bbb;max-height:90px;overflow-y:auto;
  margin-top:8px;border-top:1px solid var(--side-border);padding-top:5px;flex:0 0 auto;}
/* Sur ordinateur, le journal (garde tue monstre, etc.) n'est pas essentiel : on le masque
   pour garantir que les infos et achats tiennent toujours sans avoir a scroller. */
body:not(.mobile-layout) #log{display:none;}
#panel{margin-top:10px;padding-top:9px;border-top:2px solid var(--side-border);flex:0 0 auto;}
#panel h3{font-size:18px;margin:2px 0;}
#panel button{font-size:15px;padding:10px 10px;font-weight:600;margin:4px 0;}
#panel .row{font-size:16px;padding:3px 0;}
#boxHp,#boxWave{display:none !important;}

/* ── OVERLAYS ─────────────────────────────────── */
#overlay,#settingsOverlay,#rulesOverlay{
  position:absolute;inset:0;background:var(--menu-bg);
  display:flex;align-items:center;justify-content:flex-start;flex-direction:column;gap:4px;
  overflow-y:auto;padding:24px 0;box-sizing:border-box;}
#settingsOverlay,#rulesOverlay{display:none;z-index:5;}
#overlay h2{font-size:42px;margin-bottom:10px;}
#overlay p{font-size:22px;margin:4px 0 14px;}
#overlay button{width:300px;max-width:88vw;font-size:18px;padding:14px;}

/* ── DIFFICULTE ROWS ──────────────────────────── */
.diffrow{display:flex;align-items:center;gap:14px;margin:7px 0;justify-content:center;flex-wrap:wrap;}
.diffbtn{font-size:18px;padding:14px 10px;width:180px;flex:0 0 180px;max-width:60vw;}
.diffstats{font-size:14px;color:#ddd;text-align:left;min-width:160px;}
.daily-btn{background:linear-gradient(135deg,#1a3a6b,#2a5fa8)!important;border-color:#6aabff!important;}
.daily-btn:hover:not(:disabled){background:linear-gradient(135deg,#2a5fa8,#3a7fd8)!important;}

/* ── PARAMETRES & REGLES ──────────────────────── */
.settingsRow{margin:10px 0;font-size:15px;}
.settingsRow select{font-size:14px;padding:4px;}
#settingsBtn{position:absolute;width:auto;padding:8px 12px;top:10px;left:10px;}
#rulesBtn{position:absolute;width:auto;padding:8px 12px;top:54px;left:10px;}
.rulesCard{background:var(--box-bg);border:1px solid var(--side-border);border-radius:14px;
  padding:28px 32px;max-width:620px;max-height:82vh;min-height:0;overflow-y:auto;
  box-shadow:0 10px 36px rgba(0,0,0,.5);flex:0 1 auto;}
.rulesCard h2{text-align:center;margin-top:0;}
#rulesText{text-align:left;font-size:15px;line-height:1.7;color:#e8e0d0;}
#rulesText b{display:block;color:var(--accent,#ffd23f);font-size:17px;margin:16px 0 4px;}
#rulesText b:first-child{margin-top:0;}

/* ── HUD IN-GAME ──────────────────────────────── */
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,.95);color:#ffd23f;padding:10px 22px;border-radius:8px;
  font-size:18px;font-weight:700;opacity:0;transition:opacity .4s;
  pointer-events:none;z-index:40;white-space:nowrap;}
#holdDarken{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:90;}

/* ── STATS DERNIERE PARTIE (affiché dans le menu) ── */
#lastStats{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,0.82);
  color:#eee;padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.8;
  z-index:3;display:none;pointer-events:none;border:1px solid #555;}
#lastStats b{color:var(--accent,#ffd23f);}
.keyBtn{width:80px!important;display:inline-block;}

/* ── THEMES ───────────────────────────────────── */
body.theme-desert{
  --side-bg:linear-gradient(165deg,#3d2b14,#6b4423 50%,#8a5a2a);
  --side-border:#d99b3f;--accent:#2ec4b6;--box-bg:linear-gradient(135deg,#4a341a,#6b4423);
  --menu-bg:#2b2014;--btn-bg:linear-gradient(135deg,#5c3f1e,#7a531f);--btn-border:#d99b3f;
  --btn-hover:linear-gradient(135deg,#7a531f,#a06a2a);}
body.theme-forest{
  --side-bg:linear-gradient(165deg,#0d2414,#1f3d22 50%,#2f5233);
  --side-border:#7bc47f;--accent:#d9a441;--box-bg:linear-gradient(135deg,#16321b,#234d2a);
  --menu-bg:#13211a;--btn-bg:linear-gradient(135deg,#1f4d24,#2e6b32);--btn-border:#7bc47f;
  --btn-hover:linear-gradient(135deg,#2e6b32,#3c8c3c);}
body.theme-characters{
  --side-bg:linear-gradient(165deg,#2a1830,#44225a 50%,#5c2e78);
  --side-border:#d8a8ff;--accent:#ffd23f;--box-bg:linear-gradient(135deg,#3a1f4a,#54306e);
  --menu-bg:#1f1726;--btn-bg:linear-gradient(135deg,#4a2760,#6a3a8a);--btn-border:#d8a8ff;
  --btn-hover:linear-gradient(135deg,#6a3a8a,#8a4ac0);}
body.theme-epure{
  --side-bg:linear-gradient(165deg,#1a2030,#28333f 50%,#34404f);
  --side-border:#90aac0;--accent:#60d8e0;--box-bg:linear-gradient(135deg,#1e2838,#2e3c4a);
  --menu-bg:#141c28;--btn-bg:linear-gradient(135deg,#263040,#344458);--btn-border:#90aac0;
  --btn-hover:linear-gradient(135deg,#344458,#445870);}
.statbox{border:1px solid var(--side-border);}

/* ── RESPONSIVE (mobile / tablette : tableau d'infos a gauche + achats a droite) ── */
#leftPanel{display:none;flex-direction:column;background:var(--side-bg);
  padding:12px;box-sizing:border-box;overflow-y:auto;border-right:3px solid var(--side-border);
  min-width:0;min-height:0;}
body.mobile-layout #leftPanel,body.mobile-layout #side{width:27vw;flex:0 0 27vw;max-width:170px;min-width:92px;}
body.mobile-layout #side h2{font-size:14px;margin:0 0 6px;}
body.mobile-layout .statbox{padding:6px 8px;margin:5px 0;flex-direction:column;align-items:flex-start;gap:2px;}
body.mobile-layout .statbox .lbl{font-size:10.5px;}
body.mobile-layout .statbox .val{font-size:16px;}
body.mobile-layout #panel h3{font-size:14px;}
body.mobile-layout #panel button{font-size:12px;padding:9px 7px;}
body.mobile-layout #panel .row{font-size:13px;padding:2px 0;}
body.mobile-layout .hint{font-size:11px;margin:4px 0;}
body.mobile-layout button{font-size:12px;}
body.mobile-layout #log{font-size:10px;max-height:80px;}
body.mobile-layout #speedBtn{font-size:12px;padding:8px 4px;}
body.mobile-layout #overlay h2{font-size:28px;}
body.mobile-layout #overlay p{font-size:16px;}
body.mobile-layout .rulesCard{padding:16px 18px;max-width:94vw;}
body.mobile-layout #settingsBtn,body.mobile-layout #rulesBtn{padding:8px 10px;font-size:14px;}
@media (max-height:450px){
  body.mobile-layout #leftPanel,body.mobile-layout #side{padding:6px;}
  body.mobile-layout .statbox{padding:4px 6px;margin:3px 0;}
  body.mobile-layout .statbox .val{font-size:13px;}
  body.mobile-layout .statbox .lbl{font-size:9px;}
  body.mobile-layout #panel button{font-size:11px;padding:6px 5px;}
}
/* Mode Infini : chip degrade + petit flash au changement de heros */
#boxDiff.infinite-chip{
  display:inline-block;margin:4px auto;padding:4px 12px;border-radius:14px;
  background:linear-gradient(90deg,#5533aa,#9944cc,#5533aa);background-size:200% 100%;
  color:#fff;font-weight:600;letter-spacing:.3px;
  animation:infiniteGlow 4s linear infinite;
}
@keyframes infiniteGlow{
  0%{background-position:0% 50%;} 100%{background-position:200% 50%;}
}
@keyframes heroFlash{
  0%{transform:scale(1.35);filter:brightness(1.8);}
  100%{transform:scale(1);filter:brightness(1);}
}
#boxDiff.hero-flash{animation:heroFlash .5s ease-out;}
.chaos-btn{background:linear-gradient(90deg,#5533aa,#9944cc);border-color:#cc99ff !important;}
</style>
</head>
<body>
<div id="wrap">

  <!-- ── TABLEAU D'INFOS (mobile/tablette uniquement) ──── -->
  <div id="leftPanel"></div>

  <!-- ── ZONE CANVAS ──────────────────────────── -->
  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="toast"></div>
    <div id="lastStats"></div>

    <!-- Mode Infini : Chose active (popup descriptif, fermeture au clic) -->
    <div id="traitPopup" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.78);
      z-index:20;align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:24px;box-sizing:border-box;">
      <div style="max-width:480px;">
        <div id="traitPopupBody"></div>
        <p style="opacity:.65;font-size:12px;margin-top:14px;">(cliquez pour fermer)</p>
      </div>
    </div>

    <!-- Mode Infini : Garnison Annexe (carte 3x2 auxiliaire) -->
    <div id="sideGarrison" style="display:none;position:absolute;left:8px;top:8px;z-index:5;
      background:rgba(0,0,0,0.55);border:1px solid #555;border-radius:8px;padding:6px;">
      <div id="sideGarrisonGrid" style="display:grid;grid-template-columns:repeat(3,28px);gap:3px;"></div>
    </div>

    <!-- Menu principal -->
    <div id="overlay">
      <div id="overlayZoom" style="display:flex;flex-direction:column;align-items:center;">
        <h2 id="ovTitle">Hex Defense</h2>
        <button id="heroSelectBtn" style="width:260px;font-size:17px;padding:12px;margin-bottom:6px;border-color:#d8a8ff;"></button>
        <div id="diffList"></div>
      </div>
    </div>

    <!-- Selection du heros -->
    <div id="heroSelectOverlay" style="position:absolute;inset:0;background:var(--menu-bg);
      display:none;align-items:center;justify-content:flex-start;flex-direction:column;gap:10px;z-index:6;overflow-y:auto;box-sizing:border-box;padding:24px 0;">
      <h2 style="margin:10px 0 4px;">Choisir le Héros</h2>
      <div id="heroTotalPts" style="font-size:14px;color:var(--accent,#ffd23f);margin-bottom:6px;"></div>
      <div id="heroCards" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px;padding:10px;"></div>
      <button id="closeHeroSelect" style="width:200px;max-width:88vw;margin-top:4px;"></button>
    </div>

    <!-- Regles -->
    <div id="rulesOverlay">
      <div class="rulesCard">
        <h2 id="rulesTitle"></h2>
        <div id="rulesText"></div>
        <button id="closeRules" style="width:200px;margin-top:18px;"></button>
      </div>
    </div>

    <!-- Parametres -->
    <div id="settingsOverlay">
      <h2 id="setTitle"></h2>
      <div class="settingsRow">
        <span id="langLbl"></span> :
        <select id="langSelect">
          <option value="fr">Francais</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="settingsRow"><span id="decorLbl"></span> : <select id="decorSelect"></select></div>
      <div class="settingsRow"><span id="musicTrackLbl"></span> : <select id="musicTrackSelect"></select></div>
      <div class="settingsRow" style="display:none;"><span id="modeLbl"></span> : <select id="modeSelect"></select></div>
      <div class="settingsRow">
        <span id="volLbl"></span> :
        <input type="range" id="volSlider" min="0" max="100" value="50">
      </div>
      <div class="settingsRow">
        <span id="musicVolLbl"></span> :
        <input type="range" id="musicVolSlider" min="0" max="100" value="35">
      </div>
      <div class="settingsRow">
        <span id="pauseKeyLbl"></span> :
        <button id="pauseKeyBtn" class="keyBtn">P</button>
      </div>
      <div class="settingsRow">
        <span id="abandonKeyLbl"></span> :
        <button id="abandonKeyBtn" class="keyBtn">-</button>
      </div>
      <div class="settingsRow">
        <span id="topBuyKeyLbl"></span> :
        <button id="topBuyKeyBtn" class="keyBtn">-</button>
      </div>
      <div class="settingsRow">
        <span id="bottomBuyKeyLbl"></span> :
        <button id="bottomBuyKeyBtn" class="keyBtn">-</button>
      </div>
      <div class="settingsRow">
        <span id="specialKeyLbl"></span> :
        <button id="specialKeyBtn" class="keyBtn">-</button>
      </div>
      <div class="settingsRow">
        <span id="speed2Lbl"></span> :
        <input type="number" id="speed2Input" min="1" step="0.01" value="3" style="width:70px;font-size:14px;padding:4px;">
      </div>
      <button id="closeSettings"></button>
    </div>

    <div id="holdDarken"></div>
    <button id="settingsBtn">&#9881;</button>
    <button id="rulesBtn">&#128220;</button>
  </div>

  <!-- ── SIDEBAR ───────────────────────────────── -->
  <div id="side">
    <h2>Hex Defense</h2>
    <button id="speedBtn"></button>
    <div id="statsScrollAnchor" style="display:none;"></div>
    <div id="statsScroll" style="overflow-y:auto;flex:1 1 auto;min-height:0;">
    <div class="statbox" id="boxHp">
      <span class="lbl" id="lblHp"></span><span class="val" id="hp">50/50</span>
    </div>
    <div class="statbox">
      <span class="lbl" id="lblMoney"></span><span class="val" id="money">0</span>
    </div>
    <div class="statbox" id="boxPoint">
      <span class="lbl" id="lblPoint"></span><span class="val" id="point">0</span>
    </div>
    <div id="boxDiff" style="font-size:13px;color:#bbb;text-align:center;margin:2px 0 2px;letter-spacing:.5px;"></div>
    <div id="boxTrait" style="display:none;cursor:pointer;font-size:12px;text-align:center;margin:2px 0 6px;
      padding:4px 8px;border-radius:8px;background:rgba(255,210,63,0.12);border:1px solid rgba(255,210,63,0.4);color:#ffd23f;"></div>
    <div class="statbox" id="boxSpecial" style="display:none;flex-direction:column;gap:4px;">
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span class="lbl" id="lblSpecial">⏱</span><span class="val" id="specialVal" style="font-size:20px;">-</span>
      </div>
      <div id="midasExtra" style="display:none;width:100%;font-size:13px;color:#ddd;">
        <div style="display:flex;justify-content:space-between;"><span>Doubleurs disponibles</span><span id="midasDoublersVal" style="font-weight:bold;">0</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Dette maximale</span><span id="midasMaxDebtVal" style="font-weight:bold;">-0&euro;</span></div>
      </div>
    </div>
    <div class="statbox" id="boxEnzo" style="display:none;flex-direction:column;gap:4px;">
      <span class="lbl" id="lblEnzo" style="text-align:center;">Prochaine vague</span>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;">⚔ Degats</span>
        <span style="display:flex;align-items:center;gap:6px;">
        <button id="enzoMinusDmg" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">−</button>
        <span class="val" id="enzoValDmg">0</span>
        <button id="enzoPlusDmg" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">+</button></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;">❤ PV</span>
        <span style="display:flex;align-items:center;gap:6px;">
        <button id="enzoMinusHp" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">−</button>
        <span class="val" id="enzoValHp">0</span>
        <button id="enzoPlusHp" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">+</button></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;">⚡ Vitesse</span>
        <span style="display:flex;align-items:center;gap:6px;">
        <button id="enzoMinusFast" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">−</button>
        <span class="val" id="enzoValFast">0</span>
        <button id="enzoPlusFast" style="width:24px;padding:1px 0;font-size:16px;font-weight:900;line-height:1;">+</button></span>
      </div>
      <div style="font-size:11px;color:#aaa;text-align:center;">Minimum 20 ennemis/vague</div>
    </div>
    <div class="statbox" id="boxWave">
      <span class="lbl" id="lblWave"></span><span class="val" id="wave">-</span>
    </div>
    <div class="statbox" id="boxTimer">
      <span class="lbl" id="lblTimer"></span><span class="val" id="timer">-</span>
    </div>
    <div class="statbox" id="boxChrono">
      <span class="lbl" id="lblChrono"></span><span class="val" id="chrono">00:00</span>
    </div>
    <div id="offerBox"></div>
    </div>
    <button id="pauseBtnSide" style="display:none;"></button>
    <button id="prestigeBtn" style="display:none;"></button>
    <button id="abandonBtn"></button>
    <div id="panel"></div>
    <div id="log"></div>
  </div>

</div>
<script>
(function(){
'use strict';

// ══════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════
const SIZE           = 46;
const HEX_R          = 5;
const LARGE_R        = 7;
const PAD_TILE       = SIZE * 1.6;
const HERO_MAXHP     = 50;
const HERO_REGEN     = 0.2;     // PV/s
const WAVE_INTERVAL  = 20;      // s entre vagues
const WAVE_ENEMY_BASE= 10;      // ennemis a la vague 1, +1 par vague suivante (avant ajouts d'Enzo)
const MATCH_DURATION = 900;     // 15 min
const GUARD_INIT     = 3;
const SPEEDS         = [1, 3];
const DIFF_HP_MULT   = [0.7, 1.1];
const BASE_COSTS     = {guardPlace:4, point:10, swap:2, summonAlly:10};
const ALLY_MAXHP     = 10;

// Canvas — défini ici pour être disponible partout (applyTileData, render, events)
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');


// ══════════════════════════════════════════════════════
// I18N
// ══════════════════════════════════════════════════════
const I18N = {
  fr:{
    chooseDifficulty:'Choisis la difficulte',
    record:'Record (points)', totalPts:'Points totaux',
    hero:'Heros', money:'Argent', point:'Points', wave:'Vague',
    nextWave:'Prochaine vague', chrono:'Chrono',
    abandon:'Abandonner', abandonConfirm:'Abandonner la partie ?',
    settings:'Parametres', language:'Langue', decor:'Decor', close:'Fermer', speed:'Vitesse',
    buyGuard:'Placer un nouveau garde', buyMove:'Deplacer 2 gardes',
    buyPoint:'Acheter Points (+1/s)', pointCurrent:'Points/s actuel',
    buyCrystal:'Acheter un Cristal', crystalHint:'Cristaux : {n} (consommes au prestige, +0.1% degats chacun)', crystalBought:'Cristal achete !',
    guard:'Garde', dmg:'Degats', range:'Portee', bounty:'Bonus/kill', bountyPerKill:'Bonus/kill',
    upDmg:'+1 degats', upBounty:'+1e/kill', upRange:'+1 portee',
    buyStatChance:'Chance d\'etincelle : {p}% (+1%)', statSparked:'Un garde gagne +1 {stat} !',

// GEOMETRIE HEX (coordonnees axiales)
// ══════════════════════════════════════════════════════
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const SPEED_PX = SIZE * Math.sqrt(3); // px/s a vitesse x1

function axKey(q, r){ return q+','+r; }

function axToPxRel(q, r){
  return [SIZE * 1.5 * q, SIZE * Math.sqrt(3) * (r + q/2)];
}

function hexCorner(cx, cy, i){
  const a = Math.PI / 180 * (60 * i);
  return [cx + SIZE*Math.cos(a), cy + SIZE*Math.sin(a)];
}

function hexDist(q1, r1, q2, r2){
  return (Math.abs(q1-q2)+Math.abs(r1-r2)+Math.abs(q1+r1-q2-r2)) / 2;
}

// Construit un dict de tuiles {key:{q,r,pxRel,pyRel}} pour un rayon donne
function buildTileData(Rv){
  const d = {};
  for(let q=-Rv; q<=Rv; q++)
    for(let r=-Rv; r<=Rv; r++)
      if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r)) <= Rv){
        const [px,py] = axToPxRel(q,r);
        d[axKey(q,r)] = {q,r,pxRel:px,pyRel:py};
      }
  return d;
}

const normalTileData = buildTileData(HEX_R);
const largeTileData  = buildTileData(LARGE_R);

// Tuiles actives + offsets canvas (muables selon le mode)
let tiles = {};
let CX=0, CY=0;

// Applique un jeu de tuiles et redimensionne le canvas
function applyTileData(tdata){
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for(const k in tdata){
    mnX=Math.min(mnX,tdata[k].pxRel); mxX=Math.max(mxX,tdata[k].pxRel);
    mnY=Math.min(mnY,tdata[k].pyRel); mxY=Math.max(mxY,tdata[k].pyRel);
  }
  cv.width  = Math.ceil(mxX-mnX+PAD_TILE*2);
  cv.height = Math.ceil(mxY-mnY+PAD_TILE*2);
  CX = PAD_TILE-mnX; CY = PAD_TILE-mnY;
  tiles = {};
  for(const k in tdata)
    tiles[k] = {q:tdata[k].q, r:tdata[k].r,
                px:tdata[k].pxRel+CX, py:tdata[k].pyRel+CY};
}
applyTileData(normalTileData);

function axToPx(q,r){ const [p,q2]=axToPxRel(q,r); return [p+CX, q2+CY]; }
function neighbors(q,r){ return DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>tiles[k]); }

function seededRng(seed){
  let s = seed|0;
  return ()=>{ s=Math.imul(1664525,s)+1013904223|0; return (s>>>0)/4294967296; };
}
function dailySeed(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function dailyDateStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const DAILY_HEROES=['gameplay1','gameplay3','gameplay5','gameplay6','gameplay8'];
function dailyHeroMode(){
  const rng=seededRng(dailySeed()+7919);
  return DAILY_HEROES[Math.floor(rng()*DAILY_HEROES.length)];
}
// Genere un sous-ensemble connexe de 80-120 tuiles via BFS aleatoire
function generateDailyMap(){
  const rng=seededRng(dailySeed());
  const target=80+Math.floor(rng()*41);
  const active=new Set(['0,0']), frontier=['0,0'];
  while(active.size<target){
    if(!frontier.length) break;
    const fi=Math.floor(rng()*frontier.length), cur=frontier[fi];
    const [q,r]=cur.split(',').map(Number);
    const ns=DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>largeTileData[k]&&!active.has(k));
    if(!ns.length){ frontier.splice(fi,1); continue; }
    const nk=ns[Math.floor(rng()*ns.length)];
    active.add(nk); frontier.push(nk);
    if(rng()<0.12) frontier.splice(fi,1);
  }
  const res={};
  for(const k of active) res[k]=largeTileData[k];
  return res;
}

let audioCtx=null, sfxVolume=0.5;
// Chaque evenement peut etre soit une note simple (freq/dur/wave/glide/noise),
// soit un petit arpege (notes en demi-tons relatifs a base, joue avec un decalage stagger)
const SFX={
  buy:{freq:520,dur:0.09,wave:'sine',glide:1.6},
  wave:{notes:[0,4,7],base:392,dur:0.15,wave:'triangle',stagger:0.07},
  boss:{freq:110,dur:0.45,wave:'sawtooth'},
  win:{notes:[0,4,7,12],base:523,dur:0.17,wave:'sine',stagger:0.09},
  lose:{notes:[0,-3,-7],base:220,dur:0.24,wave:'sawtooth',stagger:0.13},
  unlock:{notes:[0,7],base:660,dur:0.13,wave:'sine',stagger:0.09},
  heroSwap:{notes:[0,4,7,4],base:440,dur:0.09,wave:'triangle',stagger:0.05}
};
// Coloration sonore propre a chaque theme de decor : filtre passe-bas (chaleur du son)
// + leger detune (justesse) pour que chaque decor ait sa propre "signature" sonore
const SFX_THEME={
  desert:     {cutoff:2200, detune:0},
  forest:     {cutoff:1400, detune:-5},
  characters: {cutoff:6500, detune:0},
  epure:      {cutoff:9000, detune:6}
};
function ensureAudio(){
  if(!audioCtx) try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
}
function noteFreq(base,semis){ return base*Math.pow(2,semis/12); }
// Joue une seule note (avec filtre theme + option glide/bruit) a un instant donne
function playTone(freq,dur,wave,when,glideTo,noiseAmt,gainMul){
  const theme=SFX_THEME[DECORS[decorIndex].key]||SFX_THEME.desert;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  o.type=wave; o.frequency.value=freq; o.detune.value=theme.detune;
  f.type='lowpass'; f.frequency.value=theme.cutoff;
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*glideTo),when+dur);
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(sfxVolume*0.3*(gainMul||1),when+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.start(when); o.stop(when+dur+0.02);
  if(noiseAmt){
    const len=Math.floor(audioCtx.sampleRate*Math.min(dur,0.08));
    const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const ng=audioCtx.createGain(); ng.gain.value=sfxVolume*noiseAmt;
    src.connect(f); ng.connect(audioCtx.destination); src.connect(ng);
    src.start(when);
  }
}
function playSfx(type){
  if(sfxVolume<=0) return; ensureAudio(); if(!audioCtx) return;
  const p=SFX[type]; if(!p) return;
  const now=audioCtx.currentTime;
  if(p.notes){
    p.notes.forEach((semis,i)=>{
      playTone(noteFreq(p.base,semis),p.dur,p.wave,now+i*p.stagger,null,0,1-i*0.08);
    });
  } else {
    playTone(p.freq,p.dur,p.wave,now,p.glide,p.noise||0,1);
  }
}

let musicPieceIndex=0, musicChordIndex=0;
// Chaque theme propose 2 ambiances (A calme/nue, B legerement plus riche) qui alternent
const MUSIC_THEMES={
  desert:{root:196,pieces:[
    {chords:[[0,4,7],[0,3,7],[5,9,12],[0,4,7]],chordDur:10,wave:'sine'},

function ensureMusicAudio(){
  if(!musicCtx) try{
    musicCtx=new(window.AudioContext||window.webkitAudioContext)();
    musicMasterGain=musicCtx.createGain();
    musicMasterGain.gain.value=musicDucked?musicVolume*0.35:musicVolume;
    musicMasterGain.connect(musicCtx.destination);
  }catch(e){}
  if(musicCtx&&musicCtx.state==='suspended') musicCtx.resume();
}
function currentMusicTheme(){ return MUSIC_THEMES[DECORS[decorIndex].key]||MUSIC_THEMES.desert; }
function playMusicChord(chordSemis,root,dur,waveType){
  if(!musicCtx) return;
  const now=musicCtx.currentTime;
  const nodes=[];
  chordSemis.forEach(semis=>{
    const freq=root*Math.pow(2,semis/12);
    const osc=musicCtx.createOscillator(); osc.type=waveType; osc.frequency.value=freq;
    const filt=musicCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1100;
    const g=musicCtx.createGain(); g.gain.value=0;
    osc.connect(filt); filt.connect(g); g.connect(musicMasterGain);
    osc.start(now);
    const peak=0.16/chordSemis.length;
    g.gain.linearRampToValueAtTime(peak,now+1.4);
    g.gain.setValueAtTime(peak,now+dur-1.6);
    g.gain.linearRampToValueAtTime(0,now+dur);
    osc.stop(now+dur+0.1);
    nodes.push({osc,g});
  });
  musicNodes=nodes;
}
// Note simple tenue (utilisee par l'arpege)
function playMusicNote(freq,dur,waveType,when){
  if(!musicCtx) return;
  const osc=musicCtx.createOscillator(); osc.type=waveType; osc.frequency.value=freq;
  const filt=musicCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1400;
  const g=musicCtx.createGain(); g.gain.value=0;
  osc.connect(filt); filt.connect(g); g.connect(musicMasterGain);
  osc.start(when);
  g.gain.linearRampToValueAtTime(0.15,when+0.12);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  osc.stop(when+dur+0.05);
}
// Note "cloche" : attaque rapide, longue decroissance douce
function playMusicBell(freq,when){
  if(!musicCtx) return;
  const osc=musicCtx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
  const g=musicCtx.createGain(); g.gain.value=0;
  osc.connect(g); g.connect(musicMasterGain);
  osc.start(when);
  g.gain.linearRampToValueAtTime(0.13,when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,when+2.4);
  osc.stop(when+2.5);
}
function scheduleNextMusicChord(){
  if(!musicPlaying||!musicCtx) return;
  if(musicTrackIndex===1) scheduleMusicArpeggio();
  else if(musicTrackIndex===2) scheduleMusicChimes();
  else scheduleMusicAmbiance();
}
// Piste 1 (par defaut) : pad d'accords tenus, propre au theme de decor actif
function scheduleMusicAmbiance(){
  const theme=currentMusicTheme();
  const piece=theme.pieces[musicPieceIndex%theme.pieces.length];
  const chord=piece.chords[musicChordIndex%piece.chords.length];
  playMusicChord(chord,theme.root,piece.chordDur,piece.wave);
  musicChordIndex++;
  musicTimer=setTimeout(scheduleNextMusicChord,piece.chordDur*1000*0.9);
}
// Piste 2 : les memes accords, mais joues en arpege (notes en cascade) pour un rendu plus vivant
function scheduleMusicArpeggio(){
  const theme=currentMusicTheme();
  const piece=theme.pieces[musicPieceIndex%theme.pieces.length];
  const chord=piece.chords[musicChordIndex%piece.chords.length];
  const now=musicCtx.currentTime;
  chord.forEach((semis,i)=>{ playMusicNote(theme.root*Math.pow(2,semis/12),0.9,'triangle',now+i*0.35); });
  musicChordIndex++;
  musicTimer=setTimeout(scheduleNextMusicChord,chord.length*350+900);
}
// Piste 3 : notes eparses au timbre de cloche, tres calme et aere
function scheduleMusicChimes(){
  const theme=currentMusicTheme();
  const piece=theme.pieces[musicPieceIndex%theme.pieces.length];
  const chord=piece.chords[musicChordIndex%piece.chords.length];
  const now=musicCtx.currentTime;
  chord.forEach((semis,i)=>{ playMusicBell(theme.root*2*Math.pow(2,semis/12),now+i*1.1); });
  musicChordIndex++;
  musicTimer=setTimeout(scheduleNextMusicChord,chord.length*1100+2500);
}
// Change d'ambiance musicale (appele a des moments precis du jeu, ex. toutes les 4 vagues)
function advanceMusicPiece(){ musicPieceIndex++; musicChordIndex=0; }
// Change immediatement de piste (reglages) sans attendre la fin du morceau en cours
function switchMusicTrack(idx){
  musicTrackIndex=idx;
  if(musicPlaying){ clearTimeout(musicTimer); musicChordIndex=0; scheduleNextMusicChord(); }
}
function startMusic(){
  if(musicPlaying) return;
  ensureMusicAudio(); if(!musicCtx) return;
  musicPlaying=true; musicChordIndex=0;
  scheduleNextMusicChord();
}
function stopMusic(){
  if(!musicPlaying) return;
  musicPlaying=false;
  clearTimeout(musicTimer);
  const now=musicCtx?musicCtx.currentTime:0;
  musicNodes.forEach(n=>{
    try{ n.g.gain.cancelScheduledValues(now); n.g.gain.setValueAtTime(n.g.gain.value,now);
      n.g.gain.linearRampToValueAtTime(0,now+1); n.osc.stop(now+1.05); }catch(e){}
  });
  musicNodes=[];
}
function setMusicDucked(ducked){
  musicDucked=ducked;
  if(!musicMasterGain||!musicCtx) return;
  const now=musicCtx.currentTime;
  musicMasterGain.gain.cancelScheduledValues(now);
  musicMasterGain.gain.setValueAtTime(musicMasterGain.gain.value,now);
  musicMasterGain.gain.linearRampToValueAtTime(ducked?musicVolume*0.35:musicVolume,now+0.6);
}
function setMusicVolume(v){
  musicVolume=v;
  if(musicMasterGain) musicMasterGain.gain.value=musicDucked?v*0.35:v;
  if(v<=0) stopMusic(); else if(!musicPlaying&&state==='playing') startMusic();
}

function occupiedSet(){
  const s=new Set(); s.add(axKey(hero.q,hero.r));
  heroExtraTiles.forEach(t=>s.add(axKey(t.q,t.r)));
  guards.forEach(g=>s.add(axKey(g.q,g.r)));
  allies.forEach(a=>s.add(axKey(a.q,a.r)));
  crystalEntities.forEach(c=>s.add(axKey(c.q,c.r)));
  return s;
}
// Cristal Vivant / Chaises Musicales : melange les positions des gardes entre eux (toujours valide)
function shuffleAllGuards(){
  if(guards.length<2) return;
  const positions=guards.map(g=>({q:g.q,r:g.r}));
  for(let i=positions.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [positions[i],positions[j]]=[positions[j],positions[i]];
  }
  guards.forEach((g,i)=>{ g.q=positions[i].q; g.r=positions[i].r; delete g.mpx; delete g.mpy; });
  monsters.forEach(m=>recomputePath(m));
  showToast(t('guardsShuffled'));
}

// Obese : le corps du heros grossit d'une case a chaque garde achete
function growthCandidates(){
  // Gaston peut grossir sur une case deja occupee par un garde (partagee en deux) ;
  // seuls le heros lui-meme, ses autres cases de corps, les allies et les spawns sont exclus.
  const occ=new Set();
  occ.add(axKey(hero.q,hero.r));
  heroExtraTiles.forEach(t=>occ.add(axKey(t.q,t.r)));
  allies.forEach(a=>occ.add(axKey(a.q,a.r)));
  const bodyKeys=[axKey(hero.q,hero.r),...heroExtraTiles.map(t=>axKey(t.q,t.r))];
  const cands=[];
  bodyKeys.forEach(bk=>{
    const [bq,br]=bk.split(',').map(Number);
    neighbors(bq,br).forEach(nk=>{ if(!occ.has(nk)&&!spawnPoints.includes(nk)) cands.push(nk); });
  });
  return cands;
}
function updateNextGrowthTile(){
  const cands=growthCandidates();
  if(!cands.length){nextGrowthTile=null;return;}
  const nk=cands[Math.floor(Math.random()*cands.length)];
  const [nq,nr]=nk.split(',').map(Number);
  nextGrowthTile={q:nq,r:nr};
}
function growHero(){
  if(!nextGrowthTile) updateNextGrowthTile();
  if(!nextGrowthTile) return;
  heroExtraTiles.push(nextGrowthTile);
  nextGrowthTile=null;
  updateNextGrowthTile();
}

// Verifie que poser un garde en (q,r) ne deconnecte pas la grille
function canPlaceGuard(q,r){
  const k=axKey(q,r);
  if(!tiles[k]||spawnPoints.includes(k)) return false;
  const occ=occupiedSet(); if(occ.has(k)) return false;
  // Seuls les gardes/allies bloquent vraiment le passage ; le corps du heros (Gaston) reste traversable
  const blocked=new Set();
  guards.forEach(g=>blocked.add(axKey(g.q,g.r)));
  allies.forEach(a=>blocked.add(axKey(a.q,a.r)));
  blocked.add(k);
  const reach=new Set([axKey(hero.q,hero.r)]), queue=[axKey(hero.q,hero.r)];
  while(queue.length){
    const cur=queue.shift(); const tt=tiles[cur];
    for(const nk of neighbors(tt.q,tt.r)){
      if(!blocked.has(nk)&&!reach.has(nk)){ reach.add(nk); queue.push(nk); }
    }
  }
  for(const k2 in tiles) if(!blocked.has(k2)&&!reach.has(k2)) return false;
  return true;
}

// BFS du point A vers B en evitant blocked (sauf destination)
function bfsPath(fq,fr,tq,tr,blocked){
  const start=axKey(fq,fr), goal=axKey(tq,tr);
  if(start===goal) return [];
  const came={}, visited=new Set([start]), queue=[start];
  while(queue.length){
    const cur=queue.shift(); if(cur===goal) break;
    const tt=tiles[cur];
    for(const nk of neighbors(tt.q,tt.r)){
      if(visited.has(nk)||blocked.has(nk)&&nk!==goal) continue;
      visited.add(nk); came[nk]=cur; queue.push(nk);
    }
  }
  if(!visited.has(goal)) return null;
  const path=[]; let cur=goal;
  while(cur!==start){ path.unshift(cur); cur=came[cur]; }
  return path;
}

// Verifie si un garde intercepte la ligne monstre->heros
function pointNearSegment(px,py,x1,y1,x2,y2,thr){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0) return Math.hypot(px-x1,py-y1)<thr;
  const t2=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t2*dx),py-(y1+t2*dy))<thr;
}
function guardBlocksLOS(m,heroPx){
  if(!m.rangeBonus) return false;
  for(const g of guards){
    const [gx,gy]=axToPx(g.q,g.r);
    if(pointNearSegment(gx,gy,m.px,m.py,heroPx[0],heroPx[1],SIZE*0.85)) return true;
  }
  return false;
}

function pxToHex(mx,my){
  let best=null,bestD=Infinity;
  for(const k in tiles){
    const tt=tiles[k], d=(tt.px-mx)**2+(tt.py-my)**2;
    if(d<bestD){bestD=d;best=tt;}
  }
  return bestD<=SIZE*SIZE?best:null;
}

function canvasScale(){
  const rect=cv.getBoundingClientRect();
  return {sx:cv.width/rect.width,sy:cv.height/rect.height,rect};
}

      if(free.length){ const tt=tiles[free[Math.floor(Math.random()*free.length)]]; hero.q=tt.q; hero.r=tt.r; }
    }
    // Chaos Temporel : la vitesse du jeu est retiree de vos mains, tiree au sort a chaque vague
    if(hasTrait('randomSpeed')) randomSpeedValue=1+Math.floor(Math.random()*7);
    // Rituels de Zone : le sort en cours ne dure qu'une vague
    if(spellZone&&waveNum>=spellZone.untilWave) spellZone=null;
  }
  waveBannerT=1.6;
  currentMonsterType=MONSTER_TYPES[Math.floor(Math.random()*MONSTER_TYPES.length)];
  waveSpawnCount=0; spawnAcc=0;
  if(sessionMode==='gameplay5'){
    MONSTER_TYPES.forEach(t=>{
      const allowance=ENZO_TYPE_CAP-enzoTotalSpawned[t];
      if(enzoCounts[t]>allowance) enzoCounts[t]=Math.max(0,allowance);
    });
    enzoRemainingThisWave={...enzoCounts};
    waveSpawnTotal=MONSTER_TYPES.reduce((s,t)=>s+enzoRemainingThisWave[t],0);
    updateEnzoDisplay();
  } else {
    waveSpawnTotal=WAVE_ENEMY_BASE+(waveNum-1);
  }
  pickRandomSpawnPoints();
  document.getElementById('wave').textContent=waveNum;
  log(t('waveStart',{n:waveNum})); showToast(t('waveStart',{n:waveNum})); playSfx('wave');
  updateHUD();
  if(chaosMode) saveChaosState();
}

function spawnMonster(){
  if(!spawnPoints.length) return;
  let type=currentMonsterType;
  if(sessionMode==='gameplay5'){
    const avail=MONSTER_TYPES.filter(t=>enzoRemainingThisWave[t]>0);
    if(!avail.length) return;
    type=avail[Math.floor(Math.random()*avail.length)];
    enzoRemainingThisWave[type]--;
    enzoTotalSpawned[type]++;
    updateEnzoDisplay();
  }
  const k=spawnPoints[Math.floor(Math.random()*spawnPoints.length)];
  const tt=tiles[k]; if(!tt) return;
  let {hp,dmg}=monsterStats(), speedMult=1, rangeBonus=0;
  switch(type){
    case 'fast': speedMult=1.5; break;
    case 'hp':   hp=Math.round(hp*1.4); break;
    case 'dmg':  dmg=dmg*1.5; break;
  }
  monsters.push({q:tt.q,r:tt.r,px:tt.px,py:tt.py,hp,maxhp:hp,dmg,
    speedMult,rangeBonus,type,pathKeys:null,attackAcc:0});
}

// Cible la plus proche (a vol d'hex) parmi le heros, son corps agrandi et les allies.
// Egalite = choix aleatoire. Hysteresis : on ne change de cible en cours de route que si
// une nouvelle cible est nettement plus proche, pour eviter les allers-retours infinis
// quand le monstre se trouve a mi-chemin entre deux cibles presque equidistantes.
function nearestTargetTile(m){
  const cands=[{q:hero.q,r:hero.r,key:axKey(hero.q,hero.r)},
    ...heroExtraTiles.map(t=>({q:t.q,r:t.r,key:axKey(t.q,t.r)})),
    ...allies.map(a=>({q:a.q,r:a.r,key:axKey(a.q,a.r)})),
    ...crystalEntities.map(c=>({q:c.q,r:c.r,key:axKey(c.q,c.r)}))];
  if(!cands.length) return null;
  let bestD=Infinity;
  for(const c of cands){ const d=hexDist(m.q,m.r,c.q,c.r); if(d<bestD) bestD=d; }
  if(m.pathTargetKey){
    const cur=cands.find(c=>c.key===m.pathTargetKey);
    if(cur && hexDist(m.q,m.r,cur.q,cur.r)<=bestD+1) return cur;
  }
  const nearest=cands.filter(c=>hexDist(m.q,m.r,c.q,c.r)===bestD);
  return nearest[Math.floor(Math.random()*nearest.length)];
}
function recomputePath(m){
  const blocked=new Set();
  guards.forEach(g=>blocked.add(axKey(g.q,g.r)));
  const target=nearestTargetTile(m);
  if(!target){m.pathKeys=null;m.pathTargetKey=null;return;}
  m.pathTargetKey=axKey(target.q,target.r);
  m.pathKeys=bfsPath(m.q,m.r,target.q,target.r,blocked);
}

function newGuard(){
  return {dmg:1,range:1,bounty:1,cooldown:1,costDmgUp:4,costBountyUp:4,bornAt:performance.now()};
}
// Petit eclat de particules colorees (theme courant) a la mort d'un monstre
function spawnDeathFx(x,y){
  const d=DECORS[decorIndex];
  const n=6;
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i/n)+Math.random()*0.4;
    const sp=60+Math.random()*60;
    deathFx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.45,color:d.monsterStroke||'#ff9a6a'});
  }
}


// ══════════════════════════════════════════════════════
// BOUCLE DE JEU — update
// ══════════════════════════════════════════════════════
function update(dt){
  if(state!=='playing') return;
  elapsedSeconds+=realDt;

  // Sauvegarde automatique du mode Chaos (partie persistante, jamais reinitialisee)
  if(chaosMode){
    chaosSaveTimer+=realDt;
    if(chaosSaveTimer>=2){chaosSaveTimer=0;saveChaosState();}
    checkTraitReroll();
    updateTraitMechanics(dt);
  }

  // Chrono de partie (desactive en mode Chaos : partie sans fin)
  if(!chaosMode){
    matchTimer-=dt;
    document.getElementById('chrono').textContent=formatTime(Math.max(0,matchTimer));
    if(matchTimer<=0){ matchTimer=0; endGame('timeup'); return; }
  }

  // Regeneration heros
  if(hero.hp<hero.maxhp) hero.hp=Math.min(hero.maxhp,hero.hp+HERO_REGEN*dt);

  // Accumulation d'un doubleur toutes les 3 min (Midas)
  if(sessionMode==='gameplay3'){
    midasTimer+=dt;
    const midasLeft=Math.max(0,Math.ceil(180-midasTimer));
    document.getElementById('specialVal').textContent=formatTime(midasLeft);
    document.getElementById('midasDoublersVal').textContent=midasDoublers;
    document.getElementById('midasMaxDebtVal').textContent='-'+Math.floor(midasMaxMoney)+'€';
    if(midasTimer>=180){midasTimer-=180;midasDoublers++;log('Midas : nouveau doubleur disponible !');showToast('+1 doubleur !');}
  }
  // Points accumulés
  if(pointRate>0){
    point+=pointRate*dt;
  }

  // Enzo : si plus aucun type d'ennemi n'est disponible, on accelere le jeu apres 10s d'attente
  if(sessionMode==='gameplay5'){
    const allCapped=MONSTER_TYPES.every(t=>enzoTotalSpawned[t]>=ENZO_TYPE_CAP);
    if(allCapped){
      enzoStarvedTimer+=realDt;
      if(!enzoAutoSpeedBoost&&enzoStarvedTimer>=10){
        enzoAutoSpeedBoost=true;
        log('Plus aucun ennemi disponible — vitesse x20 !');showToast('Vitesse x20 !');
      }
    } else {
      enzoStarvedTimer=0;enzoAutoSpeedBoost=false;
    }
  }

  // Vagues
  waveTimer-=dt;
  document.getElementById('timer').textContent=Math.max(0,Math.ceil(waveTimer))+'s';
  if(waveTimer<=0){ startWave(); return; }
  if(waveNum>=1){
    const remaining=waveSpawnTotal-waveSpawnCount;
    if(remaining>0&&waveTimer>0){
      const dynInterval=Math.max(0.05,waveTimer/remaining);
      spawnAcc+=dt;
      if(spawnAcc>=dynInterval){spawnAcc=0;spawnMonster();waveSpawnCount++;if(sessionMode==='gameplay5') updateEnzoDisplay();}
    }
  }

  const heroPx=axToPx(hero.q,hero.r);
  const heroBodyPx=[heroPx,...heroExtraTiles.map(t=>axToPx(t.q,t.r))];

  // ── Monstres : attaque / deplacement ──
  for(const m of monsters){
    const atkRange=SIZE*1.8+(m.rangeBonus?m.rangeBonus*SIZE*Math.sqrt(3):0);
    let atkTarget=null, atkPx=null, atkDist=Infinity;
    let distHero=Infinity, heroAtkPx=heroPx;
    for(const bpx of heroBodyPx){
      const d=Math.hypot(bpx[0]-m.px,bpx[1]-m.py);
      if(d<distHero){distHero=d;heroAtkPx=bpx;}
    }
    if(distHero<=atkRange&&!guardBlocksLOS(m,heroAtkPx)){atkTarget=hero;atkPx=heroAtkPx;atkDist=distHero;}
    for(const al of allies){
      const [apx,apy]=axToPx(al.q,al.r);
      const dA=Math.hypot(apx-m.px,apy-m.py);
      if(dA<=atkRange&&dA<atkDist&&!guardBlocksLOS(m,[apx,apy])){atkTarget=al;atkPx=[apx,apy];atkDist=dA;}
    }
    for(const cr of crystalEntities){
      const [cpx,cpy]=axToPx(cr.q,cr.r);
      const dC=Math.hypot(cpx-m.px,cpy-m.py);
      if(dC<=atkRange&&dC<atkDist&&!guardBlocksLOS(m,[cpx,cpy])){atkTarget=cr;atkPx=[cpx,cpy];atkDist=dC;}
    }

    if(atkTarget){
      m.attackAcc+=dt;
      while(m.attackAcc>=1){
        m.attackAcc-=1; atkTarget.hp-=m.dmg;
        if(atkTarget===hero) heroHitFlash=0.35;
        monsterAttackFx.push({x1:m.px,y1:m.py,x2:atkPx[0],y2:atkPx[1],life:0.3});
      }
      if(atkTarget.hp<=0&&crystalEntities.includes(atkTarget)){
        crystalEntities=crystalEntities.filter(c=>c!==atkTarget);
      }
      continue;
    }

    const curTarget=nearestTargetTile(m);
    const curTargetKey=curTarget?axKey(curTarget.q,curTarget.r):null;
    if(!m.pathKeys||!m.pathKeys.length||m.pathTargetKey!==curTargetKey) recomputePath(m);
    if(!m.pathKeys||!m.pathKeys.length) continue;
    const boostMult=boostTiles.has(axKey(m.q,m.r))?1.5:1;
    let rem=SPEED_PX*(m.speedMult||1)*boostMult*dt;
    while(rem>0&&m.pathKeys&&m.pathKeys.length){
      const nk=m.pathKeys[0];
      if(guards.some(g=>axKey(g.q,g.r)===nk)){m.pathKeys=null;break;}
      const nt=tiles[nk];
      const dx=nt.px-m.px,dy=nt.py-m.py,d=Math.hypot(dx,dy);
      if(d<=rem){
        m.px=nt.px;m.py=nt.py;m.q=nt.q;m.r=nt.r;rem-=d;m.pathKeys.shift();
        let nearAny=heroBodyPx.some(bpx=>Math.hypot(bpx[0]-m.px,bpx[1]-m.py)<=atkRange);
        if(!nearAny) nearAny=allies.some(al=>{const[apx,apy]=axToPx(al.q,al.r);return Math.hypot(apx-m.px,apy-m.py)<=atkRange;});
        if(nearAny) break;
      } else {
        m.px+=dx/d*rem;m.py+=dy/d*rem;rem=0;
      }
    }
  }

  // ── Gardes : attaque des monstres ──
  for(const g of guards){
    g.cooldown-=dt; if(g.cooldown>0) continue; g.cooldown+=1;
    const [gx,gy]=guardPos(g);
    const maxR=g.range*SIZE*Math.sqrt(3)+SIZE*0.5;
    let target=null;
    for(const m of monsters){
      const d=Math.hypot(gx-m.px,gy-m.py);
      if(d<=maxR&&(!target||m.hp<target.hp)){target=m;}
    }
    if(!target) continue;
    attackFx.push({x1:gx,y1:gy,x2:target.px,y2:target.py,life:0.25});
    target.hp-=g.dmg*(1+infiniteDmgBonusPct/100);
    if(target.hp<=0){
      money+=g.bounty;
      if(inGoldSpellZone(target)) money+=g.bounty; // Rituels de Zone (Sort Or) : double argent
      if(sessionMode==='gameplay3'&&money>midasMaxMoney) midasMaxMoney=money;
      monsters=monsters.filter(m=>m!==target);
      spawnDeathFx(target.px,target.py);
      log(t('guardKill',{x:g.bounty}));
    }
  }

  // Decrementation effets
  for(const fx of attackFx) fx.life-=dt;
  for(const fx of monsterAttackFx) fx.life-=dt;
  for(const fx of deathFx){ fx.life-=dt; fx.x+=fx.vx*dt; fx.y+=fx.vy*dt; fx.vx*=0.9; fx.vy*=0.9; }
  attackFx=attackFx.filter(fx=>fx.life>0);
  monsterAttackFx=monsterAttackFx.filter(fx=>fx.life>0);
  deathFx=deathFx.filter(fx=>fx.life>0);
  if(heroHitFlash>0) heroHitFlash-=realDt;
  if(waveBannerT>0) waveBannerT-=realDt;

  if(allies.some(a=>a.hp<=0)){
    allies.filter(a=>a.hp<=0).forEach(a=>{pointRate-=(a.pointContribution||0);log(t('allyDown'));});
    allies=allies.filter(a=>a.hp>0);
    if(selected&&selected.type==='ally'&&!allies.includes(selected.a)){selected=null;renderPanel();}
  }
  if(hero.hp<=0){
    hero.hp=0;playSfx('lose');
    if(chaosMode){ dieBackToWave1(); return; }
    endGame();return;
  }
  updateHUD();
}

// Mode Infini : mourir ne termine pas la partie, on repart a la vague 1 (nouvelle carte,

  applyTileData(generateRandomMap());

  infiniteCrystals=0; infiniteCrystalCost=100; crystalEntities=[];

  prepareGameUI(false,true,false);
  updateInfiniteBoxDiff(false);
  updatePrestigeBtn();
  saveChaosState();
  log(t('chaosDeath'));showToast(t('chaosDeath'));
  updateHUD();renderPanel();
}

function formatTime(s){
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function loadStats(d,mode){
  try{return JSON.parse(localStorage.getItem('hexdefense_d'+d+'_'+mode))||{best:0,totalPts:0};}
  catch(e){return{best:0,totalPts:0};}
}
function saveStats(d,mode,s){ localStorage.setItem('hexdefense_d'+d+'_'+mode,JSON.stringify(s)); }
function recordNormalResult(d,mode,pts){
  const s=loadStats(d,mode);
  s.totalPts=(s.totalPts||0)+Math.floor(pts);
  if(pts>s.best) s.best=Math.floor(pts);
  saveStats(d,mode,s);
}
function loadDailyStats(){
  try{return JSON.parse(localStorage.getItem('hexdefense_daily_'+dailyDateStr()))||{best:0};}
  catch(e){return{best:0};}
}
function recordDailyResult(pts){
  const s=loadDailyStats(); if(pts>s.best) s.best=pts;
  localStorage.setItem('hexdefense_daily_'+dailyDateStr(),JSON.stringify(s));
  const total=loadDailyTotalPts()+Math.floor(pts);
  localStorage.setItem('hexdefense_daily_totalPts',String(total));
}
function loadDailyTotalPts(){
  try{ return parseInt(localStorage.getItem('hexdefense_daily_totalPts')||'0',10)||0; }
  catch(e){ return 0; }
}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('hexdefense_settings')); if(!s) return;
    if(s.lang) lang=s.lang;
    if(s.decorIndex!==undefined) decorIndex=s.decorIndex;
    if(s.gameMode&&s.gameMode!=='beginner'){
      // migrer anciens noms de mode
      if(['normal','hardcore','gameplay2','gameplay4','gameplay7'].includes(s.gameMode)) gameMode='gameplay1';
      else gameMode=s.gameMode;
    }
    if(s.sfxVolume!==undefined) sfxVolume=s.sfxVolume;
    if(s.musicVolume!==undefined) musicVolume=s.musicVolume;
    if(s.pauseKey) pauseKey=s.pauseKey;
    if(s.abandonKey!==undefined) abandonKey=s.abandonKey;
    if(s.topBuyKey!==undefined) topBuyKey=s.topBuyKey;
    if(s.bottomBuyKey!==undefined) bottomBuyKey=s.bottomBuyKey;
    if(s.specialKey!==undefined) specialKey=s.specialKey;
    if(s.musicTrackIndex!==undefined) musicTrackIndex=s.musicTrackIndex;
    if(s.speed2&&s.speed2>=1) SPEEDS[1]=s.speed2;
  }catch(e){}
}
function saveSettings(){
  localStorage.setItem('hexdefense_settings',
    JSON.stringify({lang,decorIndex,gameMode,sfxVolume,musicVolume,musicTrackIndex,pauseKey,abandonKey,topBuyKey,bottomBuyKey,specialKey,speed2:SPEEDS[1]}));
}

// La musique doit s'arreter completement (pas juste etre mise en sourdine) des que l'on quitte
// l'onglet/la fenetre, meme sans fermer le jeu : on ARRETE et on annule la programmation des
// prochains accords (clearTimeout), on ne se contente pas de suspendre l'AudioContext. Ainsi,
// meme si un evenement inattendu (focus, resume automatique du navigateur, etc.) survient
// pendant que l'onglet est cache, il n'y a plus rien de programme qui puisse produire du son.

const PRESTIGE_HOLD_DUR=0.5;
let prestigeHoldT=0, prestigeHoldActive=false;

// Reinitialise l'etat ephemere lie aux Choses (appele a chaque tirage)
function resetTraitEphemeralState(){
  guardsSinceShuffle=0; freeMoveTimer=0; freeMoveAvailable=false;
  massTeleportTimer=0; massTeleportReady=false;
  sideGarrisonTimer=0;
  spellZone=null; spellCooldownWave=0; randomStatTimer=0;
}
function rerollTraits(){
  const count=activeTraitIds.includes('doubleTrait')?2:1;
  const pool=TRAITS.map(tr=>tr.id);
  const picked=[];
  while(picked.length<count&&pool.length){
    picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  activeTraitIds=picked;
  applyTraitsToSessionMode();
  resetTraitEphemeralState();
  maybeAutoPlaceStartingGuards();
  updateInfiniteBoxDiff(true);
  updateTraitBox();
  updateSideGarrisonUI();
  updatePrestigeBtn();
  openTraitPopup(picked);
  saveChaosState();
}
// Septuor Improvise : place 7 gardes aleatoirement au tout debut d'une partie (avant tout placement manuel)
function maybeAutoPlaceStartingGuards(){
  if(!hasTrait('startWithSevenGuards')||!initialPlacement||guards.length>0) return;
  const free=Object.keys(tiles).filter(k=>!occupiedSet().has(k)&&!spawnPoints.includes(k));
  for(let i=0;i<7&&free.length;i++){
    const idx=Math.floor(Math.random()*free.length);
    const k=free.splice(idx,1)[0];
    const tt=tiles[k];
    const g=newGuard();g.q=tt.q;g.r=tt.r;
    if(boostTiles.has(k)){g.dmg=2;g.boosted=true;}
    guards.push(g);
  }
  initialPlacement=false;
}
// Verifie si un nouveau palier de +10% de bonus de prestige est atteint (tire de nouvelles Choses)
function checkTraitReroll(){
  if(!chaosMode) return;
  const tier=Math.floor(infiniteDmgBonusPct/10);
  if(tier>traitBonusTier){ traitBonusTier=tier; rerollTraits(); }
}

// Toutes les mecaniques periodiques des Choses actives (dt suit la vitesse du jeu)
function updateTraitMechanics(dt){
  if(hasTrait('shufflingGuards')&&!freeMoveAvailable){
    freeMoveTimer+=dt;
    if(freeMoveTimer>=30){ freeMoveAvailable=true; showToast(t('freeMoveReady')); }
  }
  if(hasTrait('massTeleport')&&!massTeleportReady){
    massTeleportTimer+=dt;
    if(massTeleportTimer>=40){ massTeleportReady=true; showToast(t('massTeleportReady')); }
  }
  if(hasTrait('sideGarrison')){
    sideGarrisonTimer+=dt;
    while(sideGarrisonTimer>=1){
      sideGarrisonTimer-=1;
      const empty=sideGarrisonGuards.findIndex(g=>!g);
      if(empty>=0){ sideGarrisonGuards[empty]=newGuard(); updateSideGarrisonUI(); }
    }
    sideGarrisonGuards.forEach(g=>{
      if(!g) return;
      g.attackAcc=(g.attackAcc||0)+dt;
      const atkInterval=1-0.002; // +0.2% de vitesse d'attaque
      while(g.attackAcc>=atkInterval&&monsters.length){
        g.attackAcc-=atkInterval;
        const target=monsters[Math.floor(Math.random()*monsters.length)];
        target.hp-=g.dmg*(1+infiniteDmgBonusPct/100);
        if(target.hp<=0){
          money+=g.bounty;
          if(inGoldSpellZone(target)) money+=g.bounty;
          spawnDeathFx(target.px,target.py); monsters=monsters.filter(m=>m!==target);
        }
      }
    });
  }
  if(hasTrait('mobileGuards')){
    const speed=(0.25+0.2*mobileGuardSpeedLevel)*SPEED_PX;
    guards.forEach(g=>{
      if(g.mpx===undefined){ const[px,py]=axToPx(g.q,g.r); g.mpx=px; g.mpy=py; }
      let nearest=null,bestD=Infinity;
      for(const m of monsters){ const d=Math.hypot(m.px-g.mpx,m.py-g.mpy); if(d<bestD){bestD=d;nearest=m;} }
      if(nearest){
        const dx=nearest.px-g.mpx, dy=nearest.py-g.mpy, d=Math.hypot(dx,dy);
        const step=Math.min(d,speed*dt);
        if(d>0){ g.mpx+=dx/d*step; g.mpy+=dy/d*step; }
      }
    });
  }
  // Etincelle Hasardeuse : chaque seconde, une chance qu'une stat aleatoire d'un garde aleatoire augmente
  if(hasTrait('randomStatChance')&&randomStatChancePct>0&&guards.length){
    randomStatTimer+=dt;
    while(randomStatTimer>=1){
      randomStatTimer-=1;
      if(Math.random()*100<randomStatChancePct){
        const g=guards[Math.floor(Math.random()*guards.length)];
        const stat=['dmg','range','bounty'][Math.floor(Math.random()*3)];
        g[stat]++;
        showToast(t('statSparked',{stat:t(stat)}));
      }
    }
  }
  // Rituels de Zone : Sort Fletrissement, perte de PV max par seconde dans la zone
  if(spellZone&&spellZone.type==='wither'){
    monsters.forEach(m=>{
      if(spellZone.tiles.includes(axKey(m.q,m.r))){
        m.hp-=(m.maxhp*0.1)*dt;
      }
    });
    monsters=monsters.filter(m=>{
      if(m.hp>0) return true;
      spawnDeathFx(m.px,m.py); return false;
    });
  }
}
// Position effective d'un garde (tient compte de Gardes Baladeurs)
function guardPos(g){
  if(hasTrait('mobileGuards')&&g.mpx!==undefined) return [g.mpx,g.mpy];
  return axToPx(g.q,g.r);
}

function generateRandomMap(){
  const rng=seededRng(Math.floor(Math.random()*2147483647));
  const target=80+Math.floor(rng()*41);
  const active=new Set(['0,0']), frontier=['0,0'];
  while(active.size<target){
    if(!frontier.length) break;
    const fi=Math.floor(rng()*frontier.length), cur=frontier[fi];
    const [q,r]=cur.split(',').map(Number);
    const ns=DIRS.map(([dq,dr])=>axKey(q+dq,r+dr)).filter(k=>largeTileData[k]&&!active.has(k));
    if(!ns.length){frontier.splice(fi,1);continue;}
    const nk=ns[Math.floor(rng()*ns.length)];
    active.add(nk);frontier.push(nk);
    if(rng()<0.12) frontier.splice(fi,1);
  }
  const res={};for(const k of active) res[k]=largeTileData[k];
  return res;
}

// Mode Chaos — sauvegarde persistante (une seule partie sans fin, jamais reinitialisee)
const CHAOS_SAVE_KEY='hexdefense_chaos_save';
function saveChaosState(){
  if(!chaosMode) return;
  const s={
    waveNum, sessionMode, difficulty,
    mapKeys:Object.keys(tiles),
    hero, guards, monsters, spawnPoints, allies,
    money, point, pointRate, totalSpent, elapsedSeconds,
    costs, currentMonsterType, waveTimer, spawnAcc, waveSpawnTotal, waveSpawnCount,
    heroExtraTiles, boostTiles:[...boostTiles], nextGrowthTile, gastonGuardsSinceGrowth,
    enzoCounts, enzoTotalSpawned, enzoRemainingThisWave, enzoStarvedTimer, enzoAutoSpeedBoost,
    midasTimer, midasDoublers, midasMaxMoney, infiniteDmgBonusPct,
    infiniteCrystals, infiniteCrystalCost, crystalEntities,
    activeTraitIds, traitBonusTier, guardsSinceShuffle,
    mobileGuardSpeedLevel, mobileGuardSpeedCost, sideGarrisonGuards,
    randomStatChancePct, randomStatUpgradeCost
  };
  try{ localStorage.setItem(CHAOS_SAVE_KEY,JSON.stringify(s)); }catch(e){}
}
function loadChaosState(){
  try{ return JSON.parse(localStorage.getItem(CHAOS_SAVE_KEY)); }catch(e){ return null; }
}
// Vague courante de la partie Chaos en cours (ou sauvegardee) — ne peut jamais redescendre
function chaosCurrentWave(){
  const s=loadChaosState();
  return s ? (s.waveNum||0) : null;
}
// Bonus de degats permanent (%) acquis via prestige, affiche dans le menu
function chaosDmgBonus(){
  const s=loadChaosState();
  return s&&s.infiniteDmgBonusPct||0;
}
function restoreChaosState(s){
  const tdata={}; s.mapKeys.forEach(k=>{ if(largeTileData[k]) tdata[k]=largeTileData[k]; });
  applyTileData(tdata);
  waveNum=s.waveNum; sessionMode=s.sessionMode; difficulty=s.difficulty||2;
  hero=s.hero; guards=s.guards||[]; monsters=s.monsters||[]; spawnPoints=s.spawnPoints||[]; allies=s.allies||[];
  // bornAt vient de performance.now() de la session precedente (donc invalide apres reprise) :
  // sans ce nettoyage l'animation d'apparition du garde calcule un temps ecoule negatif enorme
  // et l'echelle de rendu s'effondre a ~0 -> le garde devient invisible (seules ses stats restent affichees)
  guards.forEach(g=>{ delete g.bornAt; });
  heroExtraTiles=s.heroExtraTiles||[]; // legitime si la Chose "Ame de Gaston" est active
  money=s.money||0; point=s.point||0; pointRate=s.pointRate||0; totalSpent=s.totalSpent||0; elapsedSeconds=s.elapsedSeconds||0;
  costs=s.costs||{...BASE_COSTS}; currentMonsterType=s.currentMonsterType||'hp';
  waveTimer=s.waveTimer||WAVE_INTERVAL; spawnAcc=s.spawnAcc||0;
  waveSpawnTotal=s.waveSpawnTotal||9999; waveSpawnCount=s.waveSpawnCount||0;
  boostTiles=new Set(s.boostTiles||[]); nextGrowthTile=s.nextGrowthTile||null;
  gastonGuardsSinceGrowth=s.gastonGuardsSinceGrowth||0;
  enzoCounts=s.enzoCounts||{fast:7,hp:7,dmg:6}; enzoTotalSpawned=s.enzoTotalSpawned||{fast:0,hp:0,dmg:0};
  enzoRemainingThisWave=s.enzoRemainingThisWave||{fast:0,hp:0,dmg:0};
  enzoStarvedTimer=s.enzoStarvedTimer||0; enzoAutoSpeedBoost=s.enzoAutoSpeedBoost||false;
  midasTimer=s.midasTimer||0; midasDoublers=s.midasDoublers||0; midasMaxMoney=s.midasMaxMoney||0;
  infiniteDmgBonusPct=s.infiniteDmgBonusPct||0;
  infiniteCrystals=s.infiniteCrystals||0; infiniteCrystalCost=s.infiniteCrystalCost||100;
  crystalEntities=s.crystalEntities||[];
  activeTraitIds=s.activeTraitIds||[]; traitBonusTier=s.traitBonusTier||0;
  guardsSinceShuffle=s.guardsSinceShuffle||0;
  mobileGuardSpeedLevel=s.mobileGuardSpeedLevel||0; mobileGuardSpeedCost=s.mobileGuardSpeedCost||8;
  sideGarrisonGuards=s.sideGarrisonGuards||[null,null,null,null,null,null];
  randomStatChancePct=s.randomStatChancePct||0; randomStatUpgradeCost=s.randomStatUpgradeCost||50;
  freeMoveTimer=0; freeMoveAvailable=false; massTeleportTimer=0; massTeleportReady=false; sideGarrisonTimer=0;
  spellZone=null; spellCooldownWave=0; randomStatTimer=0; randomSpeedValue=1;
  matchTimer=Infinity;
  state='playing'; gameRunning=true; initialPlacement=false;
  selected=null; pendingAction=null; pendingAllySource=null; moveSelected=[]; hoverMonster=null;
  attackFx=[]; monsterAttackFx=[]; deathFx=[]; heroHitFlash=0;
  paused=false; pauseUsed=false;
  speedIndex=0; document.getElementById('speedBtn').textContent=t('speed')+' x'+effectiveSpeed(speedIndex);
  document.getElementById('pauseBtnSide').style.display='';
  document.getElementById('wave').textContent=waveNum;
}

function startChaosGame(){
  chaosMode=true;dailyMode=false;difficulty=2;
  const saved=loadChaosState();
  if(saved){
    restoreChaosState(saved);
  } else {
    sessionMode='gameplay9';
    applyTileData(generateRandomMap());

// Termine la partie — retour direct au menu + stats en bas a gauche
function endGame(reason){
  state='gameover';gameRunning=false;

  if(chaosMode) saveChaosState();
  else if(dailyMode) recordDailyResult(Math.floor(point));
  else recordNormalResult(difficulty,sessionMode,Math.floor(point));

  const label=reason==='abandon'?t('abandoned'):reason==='timeup'?t('timeUp'):t('gameOver');

  // Construction HTML des stats
  let html='<b>'+t('lastGame')+' &mdash; '+label+'</b><br>';
  if(chaosMode) html+=t('chaosWaveReached')+' : '+waveNum+'<br>';
  html+=t('finalPoint')+' : '+Math.floor(point)+'<br>';
  html+=t('totalSpent')+' : '+Math.floor(totalSpent)+'&euro;<br>';
  html+=t('time')+' : '+formatTime(elapsedSeconds);

  showMenu();
  const el=document.getElementById('lastStats');
  el.innerHTML=html; el.style.display='block';
}

function drawHex(px,py,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const [x,y]=hexCorner(px,py,i); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  ctx.strokeStyle=stroke||'#444';ctx.lineWidth=2;ctx.stroke();
}

// Case partagee en deux parts egales (corps de Gaston + garde sur la meme case)
function drawSplitHex(px,py,fillA,fillB,stroke){
  const hexPath=()=>{
    ctx.beginPath();
    for(let i=0;i<6;i++){ const [x,y]=hexCorner(px,py,i); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.closePath();
  };
  ctx.save();
  hexPath();ctx.clip();
  ctx.fillStyle=fillA;ctx.fillRect(px-SIZE,py-SIZE,SIZE,SIZE*2);
  ctx.fillStyle=fillB;ctx.fillRect(px,py-SIZE,SIZE,SIZE*2);
  ctx.restore();
  hexPath();ctx.strokeStyle=stroke||'#444';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(px,py-SIZE);ctx.lineTo(px,py+SIZE);
  ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=1.5;ctx.stroke();
}

// Formes des monstres selon leur type
function drawMonsterShape(m){
  const px=m.px,py=m.py,r=SIZE*0.38*(m.isBoss?1.7:1);
  if(m.isBoss){
    ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle='#8a1a1a';ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.stroke();
    return;
  }
  switch(m.type){
    case 'fast':
      ctx.beginPath();
      ctx.moveTo(px,py-r*1.7);ctx.lineTo(px+r*0.55,py);
      ctx.lineTo(px,py+r*0.75);ctx.lineTo(px-r*0.55,py);ctx.closePath();
      ctx.fillStyle='#0899bb';ctx.fill();ctx.strokeStyle='#66ddff';ctx.lineWidth=2;ctx.stroke();break;
    case 'hp':
      ctx.beginPath();ctx.arc(px,py,r*1.28,0,Math.PI*2);
      ctx.fillStyle='#aa8800';ctx.fill();ctx.strokeStyle='#ffdd44';ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(px,py,r*0.75,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,220,60,0.4)';ctx.lineWidth=1.5;ctx.stroke();break;
    case 'dmg':
      ctx.beginPath();
      for(let i=0;i<12;i++){
        const ang=i/12*Math.PI*2-Math.PI/2,rad=i%2===0?r*1.35:r*0.52;
        const x=px+rad*Math.cos(ang),y=py+rad*Math.sin(ang);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fillStyle='#aa1111';ctx.fill();ctx.strokeStyle='#ff5544';ctx.lineWidth=2;ctx.stroke();break;
    case 'fly':
      // corps central violet clair
      ctx.beginPath();ctx.arc(px,py,r*0.7,0,Math.PI*2);
      ctx.fillStyle='#cc44cc';ctx.fill();ctx.strokeStyle='#ff88ff';ctx.lineWidth=2;ctx.stroke();
      // ailes gauche et droite
      ctx.fillStyle='rgba(220,150,255,0.7)';
      ctx.beginPath();ctx.ellipse(px-r*1.3,py-r*0.3,r*0.85,r*0.4,0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(px+r*1.3,py-r*0.3,r*0.85,r*0.4,-0.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,180,255,0.8)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(px-r*1.3,py-r*0.3,r*0.85,r*0.4,0.5,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.ellipse(px+r*1.3,py-r*0.3,r*0.85,r*0.4,-0.5,0,Math.PI*2);ctx.stroke();break;
    default:
      ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fillStyle='#a8311f';ctx.fill();ctx.strokeStyle='#ff9a6a';ctx.lineWidth=2;ctx.stroke();
  }
}

function monsterEmoji(m){
  if(m.isBoss) return '👿';
  return {fast:'💨',hp:'🐉',dmg:'🔥',fly:'🦋'}[m.type]||'👹';
}

// PV compacts : au-dela de 100 000, on affiche les 2 premiers chiffres suivis en exposant
// du nombre de chiffres restants (ex : 1 234 567 -> "12" + exposant "5")
const SUP_DIGITS=['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
function formatHP(hp){
  hp=Math.max(0,Math.round(hp));
  if(hp<100000) return String(hp);
  const s=String(hp);
  const rest=s.length-2;
  const supRest=String(rest).split('').map(d=>SUP_DIGITS[+d]).join('');
  return s.slice(0,2)+supRest;
}

// Tooltip au survol d un ennemi
function drawTooltip(m){
  const names=lang==='en'
    ?{fast:'Fast',hp:'HP',dmg:'Damage',range:'Range'}
    :{fast:'Rapide',hp:'PV',dmg:'Degats',range:'Portee'};
  const lines=['❤ '+formatHP(m.hp)+' / '+formatHP(m.maxhp), '⚔ '+m.dmg+' dmg/s',
    (lang==='en'?'Type: ':'Type : ')+(m.isBoss?'BOSS':(names[m.type]||'?'))];
  if(m.speedMult>1) lines.push('x'+m.speedMult.toFixed(1)+' vitesse');
  if(m.rangeBonus>0) lines.push('+'+m.rangeBonus+' portee');
  const fw=150,lh=17,pad=8,fh=lines.length*lh+pad*2;
  let tx=m.px+SIZE*0.55,ty=m.py-fh-SIZE*0.3;
  if(tx+fw>cv.width-4) tx=m.px-fw-SIZE*0.55;
  if(ty<4) ty=m.py+SIZE*0.55;
  ctx.fillStyle='rgba(0,0,0,0.88)';
  ctx.beginPath();const rx=5;
  ctx.moveTo(tx+rx,ty);ctx.lineTo(tx+fw-rx,ty);ctx.arcTo(tx+fw,ty,tx+fw,ty+rx,rx);
  ctx.lineTo(tx+fw,ty+fh-rx);ctx.arcTo(tx+fw,ty+fh,tx+fw-rx,ty+fh,rx);
  ctx.lineTo(tx+rx,ty+fh);ctx.arcTo(tx,ty+fh,tx,ty+fh-rx,rx);
  ctx.lineTo(tx,ty+rx);ctx.arcTo(tx,ty,tx+rx,ty,rx);ctx.closePath();
  ctx.fill();ctx.strokeStyle='rgba(200,200,200,0.3)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#eee';ctx.font='12px sans-serif';ctx.textAlign='left';
  lines.forEach((l,i)=>ctx.fillText(l,tx+pad,ty+pad+12+i*lh));
}

// Rendu principal (appelee chaque frame)
function render(){
  const d=DECORS[decorIndex];
  ctx.clearRect(0,0,cv.width,cv.height);

  // Tuiles — les zones de spawn ne sont plus indiquees (invisibles pour le joueur)
  for(const k in tiles){
    const tt=tiles[k];
    let fill=((tt.q+tt.r)%2===0)?d.tile:(d.tile2||d.tile);
    if(sessionMode==='gameplay8'&&boostTiles.has(k)) fill='#ffcc33';
    if(spellZone&&spellZone.tiles.includes(k)) fill=spellZone.type==='gold'?'#ffdd44':'#8844cc';
    drawHex(tt.px,tt.py,fill,'#3a3a3a');
  }
  // Surbrillance des cases (vides/spawn) choisies pour l'echange
  for(const st of swapTargets){
    if(st.type!=='empty'&&st.type!=='spawn') continue;
    const [spx,spy]=axToPx(st.obj.q,st.obj.r);
    ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
    ctx.setLineDash([]);ctx.beginPath();
    ctx.arc(spx,spy,SIZE*0.78,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // Heros
  const hpx=axToPx(hero.q,hero.r);
  if(d.characters){
    drawCharacterHero(hpx[0],hpx[1]);
  } else if(d.emoji){
    ctx.font=(SIZE*1.2)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText(d.heroEmoji||'🧑',hpx[0],hpx[1]+SIZE*0.35);
  } else {
    const hColors={gameplay1:['#3388ee','#88ccff'],
      gameplay3:['#cc9922','#ffe070'],gameplay5:['#ee4411','#ffaa55'],
      gameplay6:['#22ccaa','#88ffe0'],gameplay8:['#d97a3a','#ffcc99']};
    const [hFill,hStroke]=(hColors[sessionMode]||[d.heroColor,d.heroStroke]);
    drawHex(hpx[0],hpx[1],hFill,hStroke);
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(heroName(sessionMode).toUpperCase(),hpx[0],hpx[1]-4);
  }
  if(selected&&selected.type==='hero'){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
    ctx.setLineDash([5,4]);ctx.beginPath();
    ctx.arc(hpx[0],hpx[1],SIZE*0.76,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  if(swapTargets.some(t=>t.obj===hero)){
    ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
    ctx.setLineDash([]);ctx.beginPath();
    ctx.arc(hpx[0],hpx[1],SIZE*0.78,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText(Math.round(Math.max(0,hero.hp))+'/'+hero.maxhp,hpx[0],hpx[1]+(d.emoji?SIZE*0.7:12));

  // Corps supplementaire du heros (Gaston) — case partagee si un garde y est deja
  if(heroExtraTiles.length){
    const [hFillB,hStrokeB]=sessionMode==='gameplay8'?['#d97a3a','#ffcc99']:[d.heroColor,d.heroStroke];
    for(const bt of heroExtraTiles){
      const [bpx,bpy]=axToPx(bt.q,bt.r);
      const sharedGuard=guards.find(g=>g.q===bt.q&&g.r===bt.r);
      if(sharedGuard){
        const gFill=(selected&&selected.g===sharedGuard)?d.guardSelColor:d.guardColor;
        drawSplitHex(bpx,bpy,hFillB,gFill,hStrokeB);
      } else {
        drawHex(bpx,bpy,hFillB,hStrokeB);
      }
    }
  }
  // Allies (Iris)
  for(const al of allies){
    const [apx,apy]=axToPx(al.q,al.r);
    drawHex(apx,apy,'#22ccaa','#88ffe0');
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('❤ '+Math.round(Math.max(0,al.hp))+'/'+al.maxhp,apx,apy+4);
    if(selected&&selected.type==='ally'&&selected.a===al){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;
      ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.arc(apx,apy,SIZE*0.76,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  // Cristaux Vivants (mode Infini)
  for(const cr of crystalEntities){
    const [crx,cry]=axToPx(cr.q,cr.r);
    drawHex(crx,cry,'#66ddee','#bff6ff');
    ctx.fillStyle='#023';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('❤ '+Math.round(Math.max(0,cr.hp))+'/'+cr.maxhp,crx,cry+4);
  }

  // Flash rouge sur le heros uniquement
  if(heroHitFlash>0){
    const a=Math.min(1,heroHitFlash/0.35)*0.88;
    const grad=ctx.createRadialGradient(hpx[0],hpx[1],SIZE*0.15,hpx[0],hpx[1],SIZE*1.15);
    grad.addColorStop(0,'rgba(255,50,50,'+a+')');
    grad.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(hpx[0],hpx[1],SIZE*1.2,0,Math.PI*2);ctx.fill();
  }

  // Gardes
  for(const g of guards){
    const [px,py]=guardPos(g);
    const isSel=selected&&selected.g===g;
    const isMoving=pendingAction==='moveSelect'&&moveSelected.includes(g);
    const onGastonBody=heroExtraTiles.some(bt=>bt.q===g.q&&bt.r===g.r);
    if(!onGastonBody){
      // Pop-in : le garde apparait en grossissant depuis 0 pendant ses 220 premieres ms
      const growS=g.bornAt?Math.min(1,(performance.now()-g.bornAt)/220):1;
      const s=1-Math.pow(1-growS,3); // ease-out cubique
      if(s<1){ ctx.save();ctx.translate(px,py);ctx.scale(Math.max(0.01,s),Math.max(0.01,s));ctx.translate(-px,-py); }
      if(d.characters){
        drawCharacterGuard(px,py,isSel,isMoving);
      } else {
        drawHex(px,py,isSel?d.guardSelColor:d.guardColor,isSel?d.guardSelStroke:d.guardStroke);
      }
      if(s<1) ctx.restore();
    }
    if(isSel){
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
      ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.arc(px,py,SIZE*0.76,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(swapTargets.some(t=>t.obj===g)){
      ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
      ctx.setLineDash([]);ctx.beginPath();
      ctx.arc(px,py,SIZE*0.78,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(g.boosted){
      ctx.save();ctx.strokeStyle='rgba(255,204,51,0.9)';ctx.lineWidth=2.5;
      ctx.setLineDash([3,3]);ctx.beginPath();
      ctx.arc(px,py,SIZE*0.82,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      ctx.fillStyle='rgba(20,15,0,0.6)';ctx.beginPath();ctx.arc(px,py-SIZE*0.55,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffcc33';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText('⚡',px,py-SIZE*0.55+5);
    }
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('d'+g.dmg+' p'+g.range+' +'+g.bounty+'€',px,py+(d.emoji?SIZE*0.65:14));
  }

  // Prochaine case de croissance (Gaston) — toujours visible, meme au-dessus d'un garde
  if(sessionMode==='gameplay8'&&nextGrowthTile){
    const [npx,npy]=axToPx(nextGrowthTile.q,nextGrowthTile.r);
    ctx.save();ctx.strokeStyle='rgba(217,122,58,0.9)';ctx.lineWidth=3;
    ctx.setLineDash([6,4]);ctx.beginPath();
    ctx.arc(npx,npy,SIZE*0.7,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.arc(npx,npy-SIZE*0.55,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffcc66';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText('+',npx,npy-SIZE*0.55+6);
  }

  // Effets attaques gardes (jaune)
  for(const fx of attackFx){
    const a=Math.max(0,fx.life/0.25);
    ctx.strokeStyle='rgba(255,220,80,'+a+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);ctx.lineTo(fx.x2,fx.y2);ctx.stroke();
    ctx.beginPath();ctx.arc(fx.x2,fx.y2,SIZE*0.5*a+4,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,220,80,'+a+')';ctx.lineWidth=2;ctx.stroke();
  }

  // Effets attaques monstres (rouge pointille)
  for(const fx of monsterAttackFx){
    const a=Math.max(0,fx.life/0.3);
    ctx.save();ctx.setLineDash([6,4]);
    ctx.strokeStyle='rgba(255,60,60,'+a+')';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);ctx.lineTo(fx.x2,fx.y2);ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(fx.x2,fx.y2,SIZE*0.5*a,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,80,80,'+a*0.6+')';ctx.lineWidth=2;ctx.stroke();
  }

  // Eclats de particules a la mort d'un monstre (colores selon le theme)
  for(const fx of deathFx){
    const a=Math.max(0,fx.life/0.45);
    ctx.globalAlpha=a;
    ctx.fillStyle=fx.color;
    ctx.beginPath();ctx.arc(fx.x,fx.y,3.5*a+1,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // Monstres
  for(const m of monsters){
    const sc=m.isBoss?1.7:1;
    if(!hasTrait('invisibleEnemies')){
      if(d.emoji){
        ctx.font=(SIZE*0.85*sc)+'px sans-serif';ctx.textAlign='center';
        ctx.fillText(monsterEmoji(m),m.px,m.py+SIZE*0.28*sc);
      } else {
        drawMonsterShape(m);
      }
      ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.font=(m.isBoss?'bold 13px':'bold 11px')+' sans-serif';
      ctx.fillText(formatHP(m.hp),m.px,m.py+(d.emoji?SIZE*0.6*sc:3));
    }
    if(swapTargets.some(t=>t.obj===m)){
      ctx.save();ctx.strokeStyle='rgba(255,180,0,0.9)';ctx.lineWidth=3;
      ctx.setLineDash([]);ctx.beginPath();
      ctx.arc(m.px,m.py,SIZE*0.78*sc,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  // Tooltip hover ennemi
  if(hoverMonster&&monsters.includes(hoverMonster)) drawTooltip(hoverMonster);

  // Bandeau "Vague N" — glisse depuis le haut puis s'estompe
  if(waveBannerT>0&&waveNum>0){
    const dur=1.6, tRatio=1-waveBannerT/dur;
    const slideIn=Math.min(1,tRatio/0.25), fadeOut=waveBannerT<0.4?waveBannerT/0.4:1;
    const yPos=-30+Math.min(1,slideIn)*54;
    const alpha=Math.min(slideIn,fadeOut);
    const txt=t('waveStart',{n:waveNum});
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    const tw=ctx.measureText(txt).width+40;
    // Couleur d'accent du theme courant (CSS custom property), avec repli si absente
    ctx.fillStyle=(getComputedStyle(document.body).getPropertyValue('--accent')||'#ffd23f').trim()||'#ffd23f';
    ctx.fillRect(cv.width/2-tw/2,yPos,tw,36);
    ctx.fillStyle='#111';ctx.fillText(txt,cv.width/2,yPos+24);
    ctx.restore();
  }

  // Bandeau placement initial (supprimé)
  if(false&&initialPlacement&&state==='playing'){
    const txt=t('chooseGuardTiles',{n:guards.length,g:GUARD_INIT});
    const tw=ctx.measureText(txt).width+24;
    ctx.fillStyle='rgba(255,220,80,0.95)';
    ctx.fillRect(cv.width/2-tw/2,4,tw,26);
    ctx.fillStyle='#111';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(txt,cv.width/2,22);
  }
  if(pendingAction==='placeGuard'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('hintPlaceGuard'),cv.width/2,24);
  }
  if(pendingAction==='placeAlly'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('chooseTileForAlly'),cv.width/2,24);
  }
  if(pendingAction==='moveHeroFree'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('moveHeroHint'),cv.width/2,24);
  }
  if(pendingAction==='massTeleportTarget'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('massTeleportHint'),cv.width/2,24);
  }
  if(pendingAction==='placeCrystal'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('placeCrystalHint'),cv.width/2,24);
  }
  if(pendingAction==='placeSpell'){
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('placeSpellHint'),cv.width/2,24);
  }
  if(paused){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.textAlign='center';
    ctx.fillText(t('paused'),cv.width/2,cv.height/2);
  }
}

// Boucle principale
function loop(ts){
  const dtRaw=(ts-lastT)/1000;lastT=ts;
  realDt=Math.min(dtRaw,0.25);
  abandonTick(realDt);
  prestigeTick(realDt);
  checkIdlePause();
  const curSpeedMult=hasTrait('randomSpeed')?randomSpeedValue:((sessionMode==='gameplay5'&&enzoAutoSpeedBoost)?20:effectiveSpeed(speedIndex));
  if(!paused&&gameRunning) update(Math.min(dtRaw,0.2)*curSpeedMult);
  if(gameRunning) updateHUD();
  refreshAffordability();
  render();
  requestAnimationFrame(loop);
}

}

function refreshAffordability(){
  if(!selected) return;
  const q=id=>document.getElementById(id);
  if(selected.type==='hero'){
    if(q('buyGuard'))  q('buyGuard').disabled =!canAfford(priceFor('guardPlace',costs.guardPlace));
    if(q('buySwap'))   q('buySwap').disabled =!canAfford(costs.swap);
    if(q('buyPoint'))  q('buyPoint').disabled =!canAfford(costs.point);
    if(q('buyCrystal')) q('buyCrystal').disabled =!canAfford(infiniteCrystalCost);
    if(q('buySpeedUpgrade')) q('buySpeedUpgrade').disabled =!canAfford(mobileGuardSpeedCost);
    if(q('buyStatChance')) q('buyStatChance').disabled =(randomStatChancePct>=10||!canAfford(randomStatUpgradeCost));
    if(q('buyAlly'))   q('buyAlly').disabled =!canAfford(priceFor('summonAlly',costs.summonAlly));
    if(q('useDoubler')) q('useDoubler').disabled=midasDoublers<=0;
  } else if(selected.type==='ally'){
    const al=selected.a;
    if(q('allyBuyGuard')) q('allyBuyGuard').disabled =!canAfford(priceFor('guardPlace',al.costs.guardPlace));
    if(q('allyBuyPoint')) q('allyBuyPoint').disabled =!canAfford(al.costs.point);
  } else if(selected.type==='guard'){
    const g=selected.g;
    if(q('upDmg'))       q('upDmg').disabled =!canAfford(priceFor('dmgAll',g.costDmgUp));
    if(q('upBounty'))    q('upBounty').disabled =!canAfford(priceFor('bountyAll',g.costBountyUp));
  }
}

    if(canPoint)  h+=`<p class="hint">${ptHint}</p>`;
